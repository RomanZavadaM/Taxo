name: Build and publish Taxo 9.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout Taxo 9.0 source
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install runtime and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Compile and test source
        shell: pwsh
        run: |
          python -m py_compile main.py taxo_app.py work_analysis_ext.py activity_register_60.py v9_release.py workspace.py waybill.py tachograph.py attestation_render.py
          python -m unittest discover -s tests -v

      - name: Build Windows portable application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean Taxo.spec
          Move-Item 'dist/Taxo' 'dist/Taxo_v9_0_Windows_x64'

      - name: Verify portable bundle
        shell: pwsh
        run: |
          $bundle = 'dist/Taxo_v9_0_Windows_x64'
          if (!(Test-Path "$bundle/Taxo.exe")) { throw 'Taxo.exe not found' }
          if (!(Test-Path "$bundle/_internal/Бланк підтвердження.docx")) { throw 'DOCX template not found' }
          if (!(Test-Path "$bundle/_internal/attestation_visual_template.pdf")) { throw 'PDF template not found' }
          $db = Get-ChildItem $bundle -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }

      - name: Create Windows Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/Taxo_v9_0_Windows_x64' -DestinationPath 'Taxo_v9_0_Windows_x64_Portable.zip' -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc 'installer/Taxo.iss'
          if (!(Test-Path 'release_out/Taxo_v9_0_Setup_Windows_x64.exe')) { throw 'Installer not found' }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v9.0-Windows-x64
          path: |
            Taxo_v9_0_Windows_x64_Portable.zip
            release_out/Taxo_v9_0_Setup_Windows_x64.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout Taxo 9.0 source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install runtime and packaging dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build-macos.txt

      - name: Compile and test source
        shell: bash
        run: |
          python -m py_compile main.py taxo_app.py work_analysis_ext.py activity_register_60.py v9_release.py workspace.py waybill.py tachograph.py attestation_render.py
          python -m unittest discover -s tests -v

      - name: Build and verify Taxo.app
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean Taxo_macos.spec
          test -x 'dist/Taxo.app/Contents/MacOS/Taxo'
          find 'dist/Taxo.app' -name 'Бланк підтвердження.docx' -print -quit | grep -q .
          find 'dist/Taxo.app' -name 'attestation_visual_template.pdf' -print -quit | grep -q .
          if find 'dist/Taxo.app' -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit | grep -q .; then
            echo 'Database unexpectedly bundled in Taxo.app' >&2
            exit 1
          fi
          file 'dist/Taxo.app/Contents/MacOS/Taxo' | grep -q "${{ matrix.arch }}"
          codesign --verify --deep --strict 'dist/Taxo.app'

      - name: Create macOS Portable ZIP
        shell: bash
        run: |
          bundle_dir="Taxo_v9_0_macOS_${{ matrix.arch }}"
          mkdir "${bundle_dir}"
          mv 'dist/Taxo.app' "${bundle_dir}/Taxo.app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "${bundle_dir}" "${bundle_dir}_Portable.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v9.0-macOS-${{ matrix.arch }}
          path: Taxo_v9_0_macOS_${{ matrix.arch }}_Portable.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact 9.0 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified executables
        uses: actions/download-artifact@v4
        with:
          pattern: Taxo-v9.0-*
          path: release-assets
          merge-multiple: true

      - name: Prepare source package and checksums
        shell: bash
        run: |
          mkdir release-upload
          find release-assets -type f -name 'Taxo_v9_0_Setup_Windows_x64.exe' -exec cp '{}' release-upload/ \;
          find release-assets -type f -name 'Taxo_v9_0_Windows_x64_Portable.zip' -exec cp '{}' release-upload/ \;
          find release-assets -type f -name 'Taxo_v9_0_macOS_arm64_Portable.zip' -exec cp '{}' release-upload/ \;
          find release-assets -type f -name 'Taxo_v9_0_macOS_x86_64_Portable.zip' -exec cp '{}' release-upload/ \;
          git archive --format=zip --prefix='Taxo_v9_0_START/' --output='release-upload/Taxo_v9_0_START.zip' HEAD
          test -f 'release-upload/Taxo_v9_0_Setup_Windows_x64.exe'
          test -f 'release-upload/Taxo_v9_0_Windows_x64_Portable.zip'
          test -f 'release-upload/Taxo_v9_0_macOS_arm64_Portable.zip'
          test -f 'release-upload/Taxo_v9_0_macOS_x86_64_Portable.zip'
          test -f 'release-upload/Taxo_v9_0_START.zip'
          if unzip -l 'release-upload/Taxo_v9_0_START.zip' | grep -Eiq '\.(db|sqlite|sqlite3)([[:space:]]|$)|__pycache__|\.pyc([[:space:]]|$)'; then
            echo 'Database or cache unexpectedly bundled in source package' >&2
            exit 1
          fi
          cd release-upload
          sha256sum \
            Taxo_v9_0_Setup_Windows_x64.exe \
            Taxo_v9_0_Windows_x64_Portable.zip \
            Taxo_v9_0_macOS_arm64_Portable.zip \
            Taxo_v9_0_macOS_x86_64_Portable.zip \
            Taxo_v9_0_START.zip \
            > SHA256SUMS_v9_0.txt
          sha256sum -c SHA256SUMS_v9_0.txt

      - name: Publish stable v9.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v9.0 >/dev/null 2>&1; then
            gh release edit v9.0 \
              --title 'Taxo 9.0 — stable release' \
              --notes-file docs/releases/RELEASE_NOTES_v9_0.md \
              --latest
          else
            gh release create v9.0 \
              --target "$GITHUB_SHA" \
              --title 'Taxo 9.0 — stable release' \
              --notes-file docs/releases/RELEASE_NOTES_v9_0.md \
              --latest
          fi
          gh release upload v9.0 release-upload/* --clobber

      - name: Preserve release manifest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v9.0-release-manifest
          path: |
            release-upload/Taxo_v9_0_START.zip
            release-upload/SHA256SUMS_v9_0.txt
          if-no-files-found: error
          retention-days: 90
