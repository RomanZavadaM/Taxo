name: Publish Taxo 10.9-r2 source prerelease

on:
  push:
    branches:
      - work/v10.9-r2-waybill-integrity
    paths:
      - '.github/workflows/publish-v10.9-r2-source.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact issued source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify candidate identity and unused immutable tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -Fxq 'Version: 10.9-r2' VERSION.txt
          grep -Fxq 'APP_VERSION = "10.9-r2"' main.py
          test -f application_context.py
          test -f feature_layers.py
          test -f output_files.py
          test -f backup_migration.py
          test -f database_runtime.py
          test -f data_access.py
          test -f waybill_integrity.py
          test -f docs/maintenance/AUDIT_WAYBILL_INTEGRITY_v10.9-r2.md
          test -f docs/maintenance/AUDIT_EXTERNAL_REVIEW_2026-10-01.md
          test -f docs/releases/RELEASE_NOTES_v10.9-r2.md
          grep -Fq 'if not exist "waybill_integrity.py" goto :package_incomplete' START.bat
          if git ls-remote --exit-code --tags origin refs/tags/v10.9-r2 >/dev/null 2>&1; then
            echo 'Tag v10.9-r2 already exists; refusing to move/reuse it.' >&2
            exit 1
          fi

      - name: Install Tk/Xvfb and regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install -r requirements.txt

      - name: Run exact-source regression suite
        run: |
          python -m py_compile main.py taxo_app.py application_context.py feature_layers.py output_files.py backup_migration.py database_runtime.py data_access.py waybill_integrity.py vehicle_maintenance.py vehicle_maintenance_ui.py v1084_features.py v1085_features.py
          xvfb-run -a python -m unittest discover -s tests -v

      - name: Build and verify START archive
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          stem='Taxo_v10_9_candidate_r2_START'
          archive="${stem}.zip"
          git archive --format=zip --prefix="${stem}/" --output="$archive" HEAD
          for f in START.bat requirements.txt taxo_app.py main.py application_context.py feature_layers.py output_files.py backup_migration.py database_runtime.py data_access.py waybill_integrity.py workspace.py vehicle_documents.py vehicle_maintenance.py vehicle_maintenance_ui.py v1084_features.py v1085_features.py LICENSE.md COPYRIGHT.md THIRD_PARTY_NOTICES.md; do
            unzip -l "$archive" | grep -q "/${f}$" || { echo "Missing ${f}" >&2; exit 1; }
          done
          if unzip -l "$archive" | grep -Eiq '\.(db|sqlite|sqlite3)([[:space:]]|$)|__pycache__|\.pyc([[:space:]]|$)'; then
            echo 'Database/cache unexpectedly included' >&2
            exit 1
          fi
          sha256sum "$archive" > SHA256SUMS_v10_9_r2.txt
          sha=$(sha256sum "$archive" | awk '{print $1}')
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create immutable tag and prerelease
        shell: bash
        run: |
          set -euo pipefail
          git tag v10.9-r2 "${GITHUB_SHA}"
          git push origin refs/tags/v10.9-r2
          gh release create v10.9-r2 \
            "${{ steps.pack.outputs.archive }}" SHA256SUMS_v10_9_r2.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title 'Taxo 10.9-r2' \
            --prerelease \
            --notes-file docs/releases/RELEASE_NOTES_v10.9-r2.md
          target=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v10.9-r2 --jq '.object.sha')
          test "$target" = "${GITHUB_SHA}"
          printf 'Issued source: %s\nSTART SHA-256: %s\n' "${GITHUB_SHA}" '${{ steps.pack.outputs.sha }}'
