name: Apply Taxo 10.7-r9 order templates

on:
  push:
    branches:
      - work/v10.7-r9-order-templates
    paths:
      - '.github/workflows/apply-v10.7-r9-order-templates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply integration patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('main.py', 'APP_VERSION = "10.7-r8"', 'APP_VERSION = "10.7-r9"')

          replace_once(
              'taxo_app.py',
              'from v1078_features import install as install_v1078\n',
              'from v1078_features import install as install_v1078\nfrom v1079_features import install as install_v1079\n',
          )
          replace_once(
              'taxo_app.py',
              'App = install_v1078(core, App)\n',
              'App = install_v1078(core, App)\nApp = install_v1079(core, App)\n',
          )

          replace_once(
              'operations_orders_ui.py',
              'body_text.insert("1.0",str(existing["body_text"] if existing else ""))',
              'body_text.insert("1.0",str(existing["body_text"] if existing else ops.DEFAULT_BODY_TEMPLATES.get(initial_type,"")))',
          )
          replace_once(
              'operations_orders_ui.py',
              '            key=type_by_label.get(type_var.get(),ops.TYPE_GENERIC); subject_var.set(ops.DEFAULT_SUBJECTS.get(key,"")); preamble.delete("1.0","end"); preamble.insert("1.0",ops.DEFAULT_PREAMBLES.get(key,""))\n',
              '            key=type_by_label.get(type_var.get(),ops.TYPE_GENERIC)\n'
              '            subject_var.set(ops.DEFAULT_SUBJECTS.get(key,""))\n'
              '            preamble.delete("1.0","end"); preamble.insert("1.0",ops.DEFAULT_PREAMBLES.get(key,""))\n'
              '            body_text.delete("1.0","end"); body_text.insert("1.0",ops.DEFAULT_BODY_TEMPLATES.get(key,""))\n',
          )
          replace_once(
              'operations_orders_ui.py',
              '        type_box.bind("<<ComboboxSelected>>",sync_type)\n        def save():\n',
              '        type_box.bind("<<ComboboxSelected>>",sync_type)\n'
              '        def apply_template():\n'
              '            key=force_type or type_by_label.get(type_var.get(),ops.TYPE_GENERIC)\n'
              '            template=ops.DEFAULT_BODY_TEMPLATES.get(key,"")\n'
              '            if not template:\n'
              '                core.messagebox.showinfo("Типовий текст","Для цього типу наказу типовий текст не задано.",parent=dialog); return\n'
              '            current=body_text.get("1.0","end-1c").strip()\n'
              '            if current and current != template and not core.messagebox.askyesno("Замінити текст?","Поточний текст пунктів буде замінено типовою заготовкою. Продовжити?",parent=dialog): return\n'
              '            body_text.delete("1.0","end"); body_text.insert("1.0",template)\n'
              '        def save():\n',
          )
          replace_once(
              'operations_orders_ui.py',
              '        core.ttk.Button(bar,text="Скасувати",command=dialog.destroy).pack(side="right")\n',
              '        core.ttk.Button(bar,text="Скасувати",command=dialog.destroy).pack(side="right")\n'
              '        core.ttk.Button(bar,text="Типовий текст",command=apply_template).pack(side="left")\n',
          )

          Path('VERSION.txt').write_text('10.7-r9\n', encoding='utf-8')

          p = Path('.github/workflows/source-test-archive.yml')
          text = p.read_text(encoding='utf-8')
          marker = '            v1078_features.py\n'
          if '            v1079_features.py\n' not in text:
              if marker not in text:
                  raise SystemExit('v1078 START marker not found')
              text = text.replace(marker, marker + '            v1079_features.py\n', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "RomanZavadaM"
          git config user.email "zavada.roman.m@gmail.com"
          git add main.py taxo_app.py operations_orders_ui.py VERSION.txt .github/workflows/source-test-archive.yml
          git diff --cached --check
          git commit -m "feat: integrate Taxo 10.7-r9 order templates"
          git push origin HEAD:work/v10.7-r9-order-templates
