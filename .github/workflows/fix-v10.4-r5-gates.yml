name: Fix Taxo 10.4-r5 gates

on:
  push:
    branches:
      - work/v10.4-r5-personnel-registry-import
    paths:
      - .github/workflows/fix-v10.4-r5-gates.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r5-personnel-registry-import
          fetch-depth: 0
      - name: Apply deterministic r5 fixes
        shell: python
        run: |
          from pathlib import Path

          main = Path('main.py')
          text = main.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.4-r4"'
          new = 'APP_VERSION = "10.4-r5"'
          if old not in text:
              raise SystemExit('main.py r4 marker not found')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          registry = Path('personnel_registry.py')
          text = registry.read_text(encoding='utf-8')
          old = '    "прізвище ім’я по батькові",\n'
          new = '    "прізвище імя по батькові",\n'
          if old not in text:
              raise SystemExit('detailed normalized header marker not found')
          registry.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_v10_4_r4.py')
          text = test.read_text(encoding='utf-8')
          old = '''    def test_candidate_identity_is_r4(self):
              root=Path(__file__).resolve().parents[1]
              version=(root/"VERSION.txt").read_text("utf-8")
              entry=(root/"taxo_app.py").read_text("utf-8")
              self.assertIn("Version: 10.4-r4",version)
              self.assertIn("install_v1044",entry)
              self.assertIn("APP_VERSION = \\"10.4-r4\\"",(root/"v1044_features.py").read_text("utf-8"))
          '''
          new = '''    def test_r4_checkpoint_identity_remains_historical(self):
              root=Path(__file__).resolve().parents[1]
              entry=(root/"taxo_app.py").read_text("utf-8")
              feature=(root/"v1044_features.py").read_text("utf-8")
              self.assertIn("install_v1044",entry)
              self.assertIn("APP_VERSION = \\"10.4-r4\\"",feature)
              self.assertNotIn("def _waybill_schedule_rows",feature)
          '''
          if old not in text:
              raise SystemExit('r4 identity test block not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py personnel_registry.py tests/test_v10_4_r4.py
          git diff --cached --check
          git commit -m "fix: align r5 identity and registry header detection"
          git push origin HEAD:work/v10.4-r5-personnel-registry-import
