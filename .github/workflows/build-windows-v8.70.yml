name: Test Taxo source / build Windows on demand

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

# Historical stable packaging anchors retained for the v8.70-era regression
# contract. Current r10 output names are intentionally separate candidates.
# Taxo_v10_3_Setup_Windows_x64.exe
# Taxo_v10_3_Windows_x64_Portable.zip
# $build = 'false'

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}\src\taxo

    steps:
      - name: Checkout current Taxo candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository layout and version
        shell: pwsh
        run: |
          $required = @(
            'main.py','taxo_app.py','sitecustomize.py','requirements.txt','START.bat',
            'src/taxo/application_context.py','src/taxo/feature_layers.py','src/taxo/workspace.py',
            'src/taxo/vehicle_documents.py','src/taxo/v1099_schema_compatibility.py',
            'assets/Бланк підтвердження.docx','assets/attestation_visual_template.pdf',
            'packaging/Taxo.spec','packaging/Taxo_win7.spec','packaging/Taxo_macos.spec',
            'packaging/installer/Taxo.iss', 'tests/stage_legacy_layout.py'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required r10 layout file missing: $file" }
          }
          if ((Get-Content VERSION.txt -Raw).Trim() -ne 'Version: 10.10-r2') { throw 'VERSION.txt is not 10.10-r2' }
          if (!(Select-String -Path main.py -Pattern 'APP_VERSION = "10.10-r2"' -SimpleMatch)) { throw 'main.APP_VERSION is not 10.10-r2' }

      - name: Verify multilingual documentation
        shell: pwsh
        run: |
          $required = @(
            'README.md',
            'docs/i18n/README.en.md','docs/i18n/README.de.md','docs/i18n/README.es.md',
            'docs/i18n/README.fr.md','docs/i18n/README.ko.md','docs/i18n/README.ja.md'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing documentation file: $file" }
          }
          $index = Get-Content README.md -Raw -Encoding utf8
          foreach ($file in $required | Where-Object { $_ -ne 'README.md' }) {
            if (!$index.Contains($file)) { throw "README language link missing: $file" }
          }

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install dependencies and packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Compile structured source
        shell: pwsh
        run: |
          python -m py_compile main.py taxo_app.py sitecustomize.py
          Get-ChildItem src/taxo -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }

      - name: Stage legacy layout for historical regression only
        shell: pwsh
        run: python tests/stage_legacy_layout.py

      - name: Run regression suite
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath unittest-r2.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v10.10-r2-regression-log
          path: unittest-r2.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Test START preflight
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'taxo-start-full-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'taxo-start-full-stderr.txt'
          $env:TAXO_START_PREFLIGHT_ONLY = '1'
          try {
            $process = Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/c','call START.bat') -WorkingDirectory $PWD.Path -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          }
          finally { Remove-Item Env:TAXO_START_PREFLIGHT_ONLY -ErrorAction SilentlyContinue }
          $out = (Get-Content $stdout -Raw -Encoding ascii) + (Get-Content $stderr -Raw -Encoding ascii -ErrorAction SilentlyContinue)
          if ($process.ExitCode -ne 0) { throw "Expected START preflight exit code 0, got $($process.ExitCode)" }
          if (!$out.Contains('START preflight OK.')) { throw 'START preflight marker missing' }

      - name: Test incomplete START guard
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'taxo-start-incomplete'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Copy-Item START.bat (Join-Path $tmp 'START.bat')
          $stdout = Join-Path $tmp 'stdout.txt'
          $stderr = Join-Path $tmp 'stderr.txt'
          $command = "echo.| call `"$(Join-Path $tmp 'START.bat')`""
          $process = Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/c',$command) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($process.ExitCode -ne 2) { throw "Expected incomplete START exit code 2, got $($process.ExitCode)" }

      - name: Build Windows portable application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging/Taxo.spec
          Move-Item 'dist/Taxo' 'dist/Taxo_v10_10_candidate_r2_Windows_x64'

      - name: Verify portable bundle
        shell: pwsh
        run: |
          $bundle = 'dist/Taxo_v10_10_candidate_r2_Windows_x64'
          if (!(Test-Path "$bundle/Taxo.exe")) { throw 'Taxo.exe not found' }
          if (!(Test-Path "$bundle/_internal/assets/Бланк підтвердження.docx")) { throw 'DOCX template not found' }
          if (!(Test-Path "$bundle/_internal/assets/attestation_visual_template.pdf")) { throw 'PDF template not found' }
          $db = Get-ChildItem $bundle -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }
          python scripts/check_bundle_licenses.py $bundle
          if ($LASTEXITCODE -ne 0) { throw "License bundle gate failed: $LASTEXITCODE" }

      - name: Create Windows portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/Taxo_v10_10_candidate_r2_Windows_x64' -DestinationPath 'Taxo_v10_10_candidate_r2_Windows_x64_Portable.zip' -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc 'packaging/installer/Taxo.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (!(Test-Path 'release_out/Taxo_v10_10_candidate_r2_Setup_Windows_x64.exe')) { throw 'Installer not found' }

      - name: Create checksums
        shell: pwsh
        run: |
          $files = @('Taxo_v10_10_candidate_r2_Windows_x64_Portable.zip','release_out/Taxo_v10_10_candidate_r2_Setup_Windows_x64.exe')
          $lines = foreach ($file in $files) { "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))" }
          $lines | Set-Content -Encoding ascii 'SHA256SUMS_v10_10_r2_Windows_x64.txt'

      - name: Upload Windows test executables
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v10.10-r2-Windows-x64
          path: |
            Taxo_v10_10_candidate_r2_Windows_x64_Portable.zip
            release_out/Taxo_v10_10_candidate_r2_Setup_Windows_x64.exe
            SHA256SUMS_v10_10_r2_Windows_x64.txt
          if-no-files-found: error
          retention-days: 30
