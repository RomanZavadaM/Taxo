name: Test Taxo v8.70 source / build Windows on demand

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'main.py'
      - 'workspace.py'
      - 'waybill.py'
      - 'tachograph.py'
      - 'attestation_render.py'
      - 'Бланк підтвердження.docx'
      - 'attestation_visual_template.pdf'
      - 'requirements.txt'
      - 'Taxo.spec'
      - 'installer/**'
      - 'tests/**'
      - 'README*.md'
      - '.github/workflows/build-windows-v8.70.yml'
      - 'VERSION.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout v8.70 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect executable changes
        id: changes
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            'build=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
            $head = '${{ github.event.pull_request.head.sha }}'
          } else {
            $base = '${{ github.event.before }}'
            $head = $env:GITHUB_SHA
          }
          $build = 'false'
          "build=$build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Executable build required: $build"

      - name: Verify multilingual documentation
        if: steps.changes.outputs.build != 'true'
        shell: pwsh
        run: |
          $required = @('README.md','README.en.md','README.de.md','README.es.md','README.fr.md')
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing documentation file: $file" }
          }
          $index = Get-Content 'README.md' -Raw -Encoding utf8
          foreach ($file in $required | Where-Object { $_ -ne 'README.md' }) {
            if (!$index.Contains($file)) { throw "README language link missing: $file" }
          }
          Write-Host 'Multilingual documentation links are complete.'

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Windows packaging tools
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.22.2

      - name: Compile and test source
        shell: pwsh
        run: |
          python -m py_compile main.py workspace.py waybill.py tachograph.py attestation_render.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item '.ci-unittest-result' -ErrorAction SilentlyContinue
          cmd /d /c "python tests\run_ci_suite.py & exit /b 0"
          if (!(Test-Path '.ci-unittest-result')) { throw 'Unit test result marker is missing' }
          $testResult = (Get-Content '.ci-unittest-result' -Raw).Trim()
          if ($testResult -ne 'PASS') { throw "Unit tests reported: $testResult" }
          Write-Host 'Recorded unittest result: PASS'

      - name: Build Windows portable application
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean Taxo.spec
          Move-Item 'dist/Taxo' 'dist/Taxo_v8_70_TEST_r9_Windows_x64'

      - name: Verify portable bundle
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          $bundle = 'dist/Taxo_v8_70_TEST_r9_Windows_x64'
          if (!(Test-Path "$bundle/Taxo.exe")) { throw 'Taxo.exe not found' }
          if (!(Test-Path "$bundle/_internal/Бланк підтвердження.docx")) { throw 'DOCX template not found' }
          if (!(Test-Path "$bundle/_internal/attestation_visual_template.pdf")) { throw 'PDF template not found' }
          $db = Get-ChildItem $bundle -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }

      - name: Create portable ZIP
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Taxo_v8_70_TEST_r9_Windows_x64' -DestinationPath 'Taxo_v8_70_TEST_r9_Windows_x64_Portable.zip' -Force

      - name: Build Windows installer
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc 'installer/Taxo.iss'
          if (!(Test-Path 'release_out/Taxo_v8_70_TEST_r9_Setup_Windows_x64.exe')) { throw 'Installer not found' }

      - name: Create checksums
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          $files = @(
            'Taxo_v8_70_TEST_r9_Windows_x64_Portable.zip',
            'release_out/Taxo_v8_70_TEST_r9_Setup_Windows_x64.exe'
          )
          $lines = foreach ($file in $files) {
            "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii 'SHA256SUMS_v8_70_TEST_r9_Windows_x64.txt'
          Get-Content 'SHA256SUMS_v8_70_TEST_r9_Windows_x64.txt'

      - name: Upload Windows executables
        if: steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v8.70-Windows-x64-candidate-r9
          path: |
            Taxo_v8_70_TEST_r9_Windows_x64_Portable.zip
            release_out/Taxo_v8_70_TEST_r9_Setup_Windows_x64.exe
            SHA256SUMS_v8_70_TEST_r9_Windows_x64.txt
          if-no-files-found: error
          retention-days: 30
