name: Build Taxo v8.70 Windows consolidated r5

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/v8.70-consolidated-r5
  pull_request:
    paths:
      - 'main.py'
      - 'waybill.py'
      - 'tachograph.py'
      - 'attestation_render.py'
      - 'Бланк підтвердження.docx'
      - 'attestation_visual_template.pdf'
      - 'requirements.txt'
      - 'Taxo.spec'
      - 'installer/**'
      - 'tests/**'
      - '.github/workflows/build-windows-v8.70.yml'
      - 'VERSION.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout v8.70 candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Compile and test source
        shell: pwsh
        run: |
          python -m py_compile main.py waybill.py tachograph.py attestation_render.py
          python -m unittest discover -s tests -v

      - name: Build Windows portable application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean Taxo.spec
          Move-Item 'dist/Taxo' 'dist/Taxo_v8_70_TEST_r5_Windows_x64'

      - name: Verify portable bundle
        shell: pwsh
        run: |
          $bundle = 'dist/Taxo_v8_70_TEST_r5_Windows_x64'
          if (!(Test-Path "$bundle/Taxo.exe")) { throw 'Taxo.exe not found' }
          if (!(Test-Path "$bundle/_internal/Бланк підтвердження.docx")) { throw 'DOCX template not found' }
          if (!(Test-Path "$bundle/_internal/attestation_visual_template.pdf")) { throw 'PDF template not found' }
          $db = Get-ChildItem $bundle -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Taxo_v8_70_TEST_r5_Windows_x64' -DestinationPath 'Taxo_v8_70_TEST_r5_Windows_x64_Portable.zip' -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc 'installer/Taxo.iss'
          if (!(Test-Path 'release_out/Taxo_v8_70_TEST_r5_Setup_Windows_x64.exe')) { throw 'Installer not found' }

      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            'Taxo_v8_70_TEST_r5_Windows_x64_Portable.zip',
            'release_out/Taxo_v8_70_TEST_r5_Setup_Windows_x64.exe'
          )
          $lines = foreach ($file in $files) {
            "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii 'SHA256SUMS_v8_70_TEST_r5_Windows_x64.txt'
          Get-Content 'SHA256SUMS_v8_70_TEST_r5_Windows_x64.txt'

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v8.70-Windows-x64-consolidated-r5
          path: |
            Taxo_v8_70_TEST_r5_Windows_x64_Portable.zip
            release_out/Taxo_v8_70_TEST_r5_Setup_Windows_x64.exe
            SHA256SUMS_v8_70_TEST_r5_Windows_x64.txt
          if-no-files-found: error
          retention-days: 30
