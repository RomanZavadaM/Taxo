name: Test Taxo 9.x source / build Windows on demand

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'main.py'
      - 'taxo_app.py'
      - 'work_analysis_ext.py'
      - 'activity_register_60.py'
      - 'v91_features.py'
      - 'personnel_v91.py'
      - 'work_regime.py'
      - 'workspace.py'
      - 'waybill.py'
      - 'tachograph.py'
      - 'attestation_render.py'
      - 'Бланк підтвердження.docx'
      - 'attestation_visual_template.pdf'
      - 'requirements.txt'
      - 'START.bat'
      - '00_README_START.txt'
      - 'release_naming.py'
      - 'Taxo.spec'
      - 'installer/**'
      - 'tests/**'
      - 'README*.md'
      - '.github/workflows/build-windows-v8.70.yml'
      - '.github/workflows/source-test-archive.yml'
      - '.github/workflows/publish-v10.0.yml'
      - 'VERSION.txt'

permissions:
  contents: read

concurrency:
  # Keep the required Windows check bound to the exact commit. A stale runner
  # from an earlier PR synchronize event must not block the current stable head.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout current Taxo candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect executable changes
        id: changes
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            'build=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
            $head = '${{ github.event.pull_request.head.sha }}'
          } else {
            $base = '${{ github.event.before }}'
            $head = $env:GITHUB_SHA
          }
          $build = 'false'
          "build=$build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Executable build required: $build"

      - name: Verify multilingual documentation
        if: steps.changes.outputs.build != 'true'
        shell: pwsh
        run: |
          $required = @('README.md','README.en.md','README.de.md','README.es.md','README.fr.md')
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing documentation file: $file" }
          }
          $index = Get-Content 'README.md' -Raw -Encoding utf8
          foreach ($file in $required | Where-Object { $_ -ne 'README.md' }) {
            if (!$index.Contains($file)) { throw "README language link missing: $file" }
          }
          Write-Host 'Multilingual documentation links are complete.'

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Windows packaging tools
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.22.2

      - name: Compile and test source
        shell: pwsh
        run: |
          python -m py_compile main.py taxo_app.py work_analysis_ext.py activity_register_60.py v9_release.py hotfix_901.py v91_features.py personnel_v91.py work_regime.py workspace.py waybill.py tachograph.py attestation_render.py
          python -m unittest discover -s tests -v

      - name: Test START preflight in complete extracted folder
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'taxo-start-full-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'taxo-start-full-stderr.txt'
          $env:TAXO_START_PREFLIGHT_ONLY = '1'
          try {
            $process = Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/c','call START.bat') -WorkingDirectory $PWD.Path -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          }
          finally {
            Remove-Item Env:TAXO_START_PREFLIGHT_ONLY -ErrorAction SilentlyContinue
          }
          $out = (Get-Content $stdout -Raw -Encoding ascii) + (Get-Content $stderr -Raw -Encoding ascii -ErrorAction SilentlyContinue)
          if ($process.ExitCode -ne 0) { throw "Expected complete START preflight exit code 0, got $($process.ExitCode)" }
          if (!$out.Contains('START preflight OK.')) { throw 'Expected successful START preflight marker' }

      - name: Test START guard for launch from incomplete ZIP extraction
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'taxo-start-incomplete'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp | Out-Null
          $bat = Join-Path $tmp 'START.bat'
          $stdout = Join-Path $tmp 'stdout.txt'
          $stderr = Join-Path $tmp 'stderr.txt'
          Copy-Item 'START.bat' $bat
          $command = "echo.| call `"$bat`""
          $process = Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/c',$command) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $code = $process.ExitCode
          $out = (Get-Content $stdout -Raw -Encoding ascii) + (Get-Content $stderr -Raw -Encoding ascii -ErrorAction SilentlyContinue)
          if ($code -ne 2) { throw "Expected START.bat exit code 2 for incomplete package, got $code" }
          if (!$out.Contains('ZIP')) { throw 'Expected extraction guidance mentioning ZIP' }
          if ($out.Contains('pip install')) { throw 'START guard did not stop before pip' }

      - name: Build Windows portable application
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean Taxo.spec
          Move-Item 'dist/Taxo' 'dist/Taxo_v10_0_Windows_x64'

      - name: Verify portable bundle
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          $bundle = 'dist/Taxo_v10_0_Windows_x64'
          if (!(Test-Path "$bundle/Taxo.exe")) { throw 'Taxo.exe not found' }
          if (!(Test-Path "$bundle/_internal/Бланк підтвердження.docx")) { throw 'DOCX template not found' }
          if (!(Test-Path "$bundle/_internal/attestation_visual_template.pdf")) { throw 'PDF template not found' }
          $db = Get-ChildItem $bundle -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }

      - name: Create portable ZIP
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Taxo_v10_0_Windows_x64' -DestinationPath 'Taxo_v10_0_Windows_x64_Portable.zip' -Force

      - name: Build Windows installer
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc 'installer/Taxo.iss'
          if (!(Test-Path 'release_out/Taxo_v10_0_Setup_Windows_x64.exe')) { throw 'Installer not found' }

      - name: Create checksums
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          $files = @(
            'Taxo_v10_0_Windows_x64_Portable.zip',
            'release_out/Taxo_v10_0_Setup_Windows_x64.exe'
          )
          $lines = foreach ($file in $files) {
            "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii 'SHA256SUMS_v10_0_Windows_x64.txt'
          Get-Content 'SHA256SUMS_v10_0_Windows_x64.txt'

      - name: Upload Windows executables
        if: steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v10.0-Windows-x64
          path: |
            Taxo_v10_0_Windows_x64_Portable.zip
            release_out/Taxo_v10_0_Setup_Windows_x64.exe
            SHA256SUMS_v10_0_Windows_x64.txt
          if-no-files-found: error
          retention-days: 30
