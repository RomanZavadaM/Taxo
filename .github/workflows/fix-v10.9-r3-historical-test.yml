name: Fix Taxo 10.9-r3 historical document test

on:
  push:
    branches:
      - work/v10.9-r3-vehicle-document-validity
    paths:
      - '.github/workflows/fix-v10.9-r3-historical-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make historical r1 source assertion extension-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_v10_2_r1.py')
          s=p.read_text(encoding='utf-8')
          old='''        source = inspect.getsource(main.App.issue_selected_waybill)\n        self.assertIn("vehicle_document_warning_lines", source)\n        self.assertIn('today=row["date"]', source)\n        self.assertIn("messagebox.askyesno", source)\n'''
          new='''        # Historical r1 contract: issuing a waybill must surface document\n        # warnings with explicit user confirmation. Later revisions may\n        # legitimately expand the warning scope from one work date to the\n        # complete trip period.\n        source = inspect.getsource(main.App.issue_selected_waybill)\n        self.assertIn("vehicle_document_warning_lines", source)\n        self.assertIn("messagebox.askyesno", source)\n'''
          if old not in s:
              raise SystemExit('stale assertion anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify focused old and new tests
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install -r requirements.txt
          xvfb-run -a python -m unittest tests.test_v10_2_r1 tests.test_v10_9_r3 -v
      - name: Commit test correction
        shell: bash
        run: |
          git config user.name 'RomanZavadaM'
          git config user.email 'zavada.roman.m@gmail.com'
          git add tests/test_v10_2_r1.py
          git commit -m 'Keep 10.2-r1 document warning test historical'
          git push origin HEAD:work/v10.9-r3-vehicle-document-validity
