name: Maintain Taxo 10.7-r3 integration

on:
  push:
    branches:
      - 'work/v10.7-r3-order-appendices'
    paths:
      - '.github/workflows/maintain-v10.7-r3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded integration patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('main.py')
          text = main.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.7-r2"'
          new = 'APP_VERSION = "10.7-r3"'
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected main.py r2 APP_VERSION marker not found')
              text = text.replace(old, new, 1)
              main.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/source-test-archive.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '            v1072_features.py\n'
          addition = marker + '            v1073_features.py\n'
          if '            v1073_features.py\n' not in text:
              if marker not in text:
                  raise SystemExit('Expected v1072 START guard marker not found')
              text = text.replace(marker, addition, 1)
              workflow.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'RomanZavadaM'
          git config user.email 'zavada.roman.m@gmail.com'
          git add main.py .github/workflows/source-test-archive.yml
          git commit -m 'chore: sync Taxo 10.7-r3 runtime and START guard'
          git push origin HEAD:work/v10.7-r3-order-appendices
