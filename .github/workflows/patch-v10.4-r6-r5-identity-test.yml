name: Patch historical r5 identity test for r6

on:
  push:
    branches:
      - work/v10.4-r6-registry-reconciliation
    paths:
      - .github/workflows/patch-v10.4-r6-r5-identity-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r6-registry-reconciliation
          fetch-depth: 0
      - name: Repair historical r5 identity assertion
        shell: python
        run: |
          from pathlib import Path
          path=Path('tests/test_v10_4_r5.py')
          text=path.read_text(encoding='utf-8')
          old='''    def test_candidate_identity_and_entrypoint(self):
              version=(ROOT/"VERSION.txt").read_text("utf-8")
              entry=(ROOT/"taxo_app.py").read_text("utf-8")
              feature=(ROOT/"v1045_features.py").read_text("utf-8")
              self.assertIn("Version: 10.4-r5",version)
              self.assertIn("install_v1045",entry)
              self.assertIn('APP_VERSION = "10.4-r5"',feature)
              self.assertNotIn("Тестовий Петро Іванович",(ROOT/"personnel_registry.py").read_text("utf-8"))
          '''
          new='''    def test_r5_checkpoint_identity_remains_historical(self):
              entry=(ROOT/"taxo_app.py").read_text("utf-8")
              feature=(ROOT/"v1045_features.py").read_text("utf-8")
              self.assertIn("install_v1045",entry)
              self.assertIn('APP_VERSION = "10.4-r5"',feature)
              self.assertNotIn("Тестовий Петро Іванович",(ROOT/"personnel_registry.py").read_text("utf-8"))
          '''
          if old not in text:
              raise SystemExit('r5 identity block not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v10_4_r5.py
          git diff --cached --check
          git commit -m "test: preserve r5 identity without blocking r6"
          git push origin HEAD:work/v10.4-r6-registry-reconciliation
