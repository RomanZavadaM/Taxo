name: Apply Taxo 10.9-r3 vehicle document validity

on:
  push:
    branches:
      - work/v10.9-r3-vehicle-document-validity
    paths:
      - '.github/workflows/apply-v10.9-r3-vehicle-validity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source transformation
        run: python .github/scripts/apply_v10_9_r3.py

      - name: Install dependencies and run focused tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest tests.test_v10_9_r3 -v

      - name: Commit r3 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v10.9-r3-vehicle-validity.yml
          rm -f .github/scripts/apply_v10_9_r3.py
          git config user.name 'RomanZavadaM'
          git config user.email 'zavada.roman.m@gmail.com'
          git add -A
          git commit -m 'Implement 10.9-r3 full-trip vehicle document validity'
          git push origin HEAD:work/v10.9-r3-vehicle-document-validity
