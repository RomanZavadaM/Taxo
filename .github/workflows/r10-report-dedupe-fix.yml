name: One-time r10 report task dedupe fix

on:
  push:
    branches:
      - work/v10.4-r10-military-transport-vehicles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r10-military-transport-vehicles
          fetch-depth: 0
      - name: Make semiannual task scheduling idempotent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('military_transport_2026.py')
          text = p.read_text(encoding='utf-8')
          old = '''    now = datetime.now().isoformat(timespec="seconds")\n    before = con.total_changes\n    con.execute(\n        """INSERT OR IGNORE INTO vehicle_military_transport_actions(\n               vehicle_id,action_type,event_id,event_date,due_date,status,note,source,created_at\n           ) VALUES(NULL,?,NULL,?,?,?,\'\',\'semiannual_schedule\',?)""",\n        (ACTION_REPORT, effective.isoformat(), deadline.isoformat(), ACTION_OPEN, now),\n    )\n    return con.total_changes - before, deadline\n'''
          new = '''    existing = con.execute(\n        """SELECT id FROM vehicle_military_transport_actions\n           WHERE action_type=? AND due_date=? AND source='semiannual_schedule'\n           LIMIT 1""",\n        (ACTION_REPORT, deadline.isoformat()),\n    ).fetchone()\n    if existing:\n        return 0, deadline\n    now = datetime.now().isoformat(timespec="seconds")\n    before = con.total_changes\n    con.execute(\n        """INSERT INTO vehicle_military_transport_actions(\n               vehicle_id,action_type,event_id,event_date,due_date,status,note,source,created_at\n           ) VALUES(NULL,?,NULL,?,?,?,'','semiannual_schedule',?)""",\n        (ACTION_REPORT, effective.isoformat(), deadline.isoformat(), ACTION_OPEN, now),\n    )\n    return con.total_changes - before, deadline\n'''
          if new in text:
              print('already patched')
          elif old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit('Expected r10 scheduling block not found')
          PY
          if git diff --quiet -- military_transport_2026.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add military_transport_2026.py
          git commit -m "fix(r10): deduplicate semiannual reporting task"
          git push origin HEAD:work/v10.4-r10-military-transport-vehicles
