name: Publish Taxo 9.1 candidate r9 source
# r9-final-canonical-intervals

on:
  push:
    branches:
      - 'work/v9.1-monthly-dispatch-waybill-ui'
    paths:
      - '.github/workflows/publish-v9.1-r9-source.yml'

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Отримати точний код r9
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Перевірити код і тести
        run: |
          python -m py_compile main.py taxo_app.py work_analysis_ext.py activity_register_60.py v9_release.py hotfix_901.py v91_features.py personnel_v91.py work_regime.py workspace.py waybill.py tachograph.py attestation_render.py
          python -m unittest discover -s tests -v

      - name: Підготувати START-пакет
        shell: bash
        run: |
          mkdir release-upload
          git archive --format=zip --prefix="Taxo_v9_1_candidate_r9_START/" --output="release-upload/Taxo_v9_1_candidate_r9_START.zip" "$GITHUB_SHA"
          if unzip -l "release-upload/Taxo_v9_1_candidate_r9_START.zip" | grep -Eiq '\.(db|sqlite|sqlite3)([[:space:]]|$)|__pycache__|\.pyc([[:space:]]|$)'; then
            echo 'Database/cache unexpectedly bundled in START' >&2
            exit 1
          fi
          unzip -l "release-upload/Taxo_v9_1_candidate_r9_START.zip" | grep -q 'START.bat'
          cd release-upload
          sha256sum "Taxo_v9_1_candidate_r9_START.zip" > "SHA256SUMS_v9_1_candidate_r9.txt"
          sha256sum -c "SHA256SUMS_v9_1_candidate_r9.txt"

      - name: Створити pre-release r9
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v9.1-r9" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "v9.1-r9" "$GITHUB_SHA"
            git push origin "refs/tags/v9.1-r9" --force
            gh release edit "v9.1-r9" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Taxo 9.1 candidate r9" \
              --notes-file "docs/releases/RELEASE_NOTES_v9_1_candidate_r9.md"
            gh release upload "v9.1-r9" release-upload/* --clobber
          else
            gh release create "v9.1-r9" \
              release-upload/* \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Taxo 9.1 candidate r9" \
              --notes-file "docs/releases/RELEASE_NOTES_v9_1_candidate_r9.md"
          fi
