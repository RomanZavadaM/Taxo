name: Apply Taxo 10.8-r8 main identity

on:
  push:
    branches:
      - work/v10.8-r8-application-context

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/v10.8-r8-application-context
          fetch-depth: 0

      - name: Update exact main identity and remove one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          source = path.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.8-r7"'
          new = 'APP_VERSION = "10.8-r8"'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one r7 APP_VERSION marker, found {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          grep -Fxq 'Version: 10.8-r8' VERSION.txt
          grep -Fxq 'APP_VERSION = "10.8-r8"' main.py
          git rm .github/workflows/apply-v10.8-r8-version.yml

      - name: Commit exact change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'version: synchronize main identity for Taxo 10.8-r8'
          git push origin HEAD:work/v10.8-r8-application-context
