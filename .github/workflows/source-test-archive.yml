name: Package Taxo START source

on:
  push:
    branches:
      - main
      - 'work/v9.*'
      - 'work/v10.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src/taxo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tk/Xvfb runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install regression dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile structured source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = [Path('main.py'), Path('taxo_app.py'), Path('sitecustomize.py')]
          files.extend(sorted(Path('src/taxo').glob('*.py')))
          if len(files) <= 3:
              raise SystemExit('No structured source modules found in src/taxo')
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f'Compiled {len(files)} Python files.')
          PY

      # Historical runtime contract inventory. All names below still ship,
      # now under src/taxo/. Keeping the inventory explicit lets every older
      # checkpoint regression prove that the r10 structure move lost no layer.
      # application_context.py activity_register_60.py attestation_render.py
      # backup_migration.py branding.py branding_asset.py data_access.py
      # database_runtime.py diia_reconciliation.py document_viewer.py
      # employee_document_register.py employee_reminders.py feature_layers.py
      # hotfix_901.py military_accounting_2026.py military_accounting_ui.py
      # military_transport_2026.py military_transport_statement.py
      # military_transport_statement_ui.py military_transport_ui.py
      # operations_orders.py operations_orders_ui.py output_files.py
      # personnel_reconciliation.py personnel_registry.py personnel_registry_lossless.py
      # personnel_v91.py registry_working_data.py release_naming.py tachograph.py
      # vehicle_document_validity.py vehicle_documents.py vehicle_maintenance.py
      # vehicle_maintenance_ui.py vehicle_reconciliation.py vehicle_registry.py
      # waybill.py waybill_integrity.py work_analysis_ext.py work_regime.py
      # work_rest_compliance.py workspace.py v9_release.py v91_features.py
      # v1043_features.py v1044_features.py v1045_features.py v1046_features.py
      # v1048_features.py v1049_features.py v10410_features.py
      # v1051_features.py v1052_features.py v1053_features.py v1054_features.py
      # v1055_features.py v1056_features.py v1057_features.py v1058_features.py
      # v1059_features.py v10510_features.py
      # v1061_features.py v1062_features.py v1063_features.py v1064_features.py
      # v1065_features.py v1066_features.py v1067_features.py v1068_features.py
      # v1069_features.py v10610_features.py
      # v1071_features.py v1072_features.py v1073_features.py v1074_features.py
      # v1074_appendix_history.py v1075_features.py v1076_features.py
      # v1077_features.py v1078_features.py v1079_features.py v10710_features.py
      # v1081_features.py v1082_features.py v1083_features.py v1084_features.py
      # v1085_features.py v1096_personnel_balance.py v1097_stoir_odometer.py
      # v1098_orders_immutability.py v1099_schema_compatibility.py

      - name: Stage legacy layout for historical regression only
        run: python tests/stage_legacy_layout.py

      - name: Run regression suite with virtual display
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Create START.bat source archive
        id: pack
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          from release_naming import start_archive_stem, version_from_file
          stem = start_archive_stem(version_from_file('VERSION.txt'))
          archive = stem + '.zip'
          subprocess.check_call(['git','archive','--format=zip',f'--prefix={stem}/',f'--output={archive}','HEAD'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'archive={archive}\n')
              out.write(f'stem={stem}\n')
          PY

      - name: Verify clean structured operational package
        shell: bash
        run: |
          archive="${{ steps.pack.outputs.archive }}"
          if unzip -l "$archive" | grep -Eiq '\.(db|sqlite|sqlite3)([[:space:]]|$)|__pycache__|\.pyc([[:space:]]|$)'; then
            echo 'Database or cache unexpectedly included in source archive' >&2
            exit 1
          fi
          required_files=(
            START.bat requirements.txt taxo_app.py main.py sitecustomize.py VERSION.txt
            src/taxo/application_context.py src/taxo/feature_layers.py src/taxo/output_files.py src/taxo/pdf_engine.py
            src/taxo/backup_migration.py src/taxo/database_runtime.py src/taxo/data_access.py
            src/taxo/vehicle_reconciliation.py src/taxo/employee_document_register.py
            src/taxo/personnel_registry_lossless.py src/taxo/registry_working_data.py
            src/taxo/diia_reconciliation.py src/taxo/operations_orders.py src/taxo/operations_orders_ui.py
            src/taxo/v1051_features.py src/taxo/v1052_features.py src/taxo/v1053_features.py
            src/taxo/v1054_features.py src/taxo/v1055_features.py src/taxo/v1056_features.py
            src/taxo/v1057_features.py src/taxo/v1058_features.py src/taxo/v1059_features.py
            src/taxo/v10510_features.py
            src/taxo/v1061_features.py src/taxo/v1062_features.py src/taxo/v1063_features.py
            src/taxo/v1064_features.py src/taxo/v1065_features.py src/taxo/v1066_features.py
            src/taxo/v1067_features.py src/taxo/v1068_features.py src/taxo/v1069_features.py
            src/taxo/v10610_features.py
            src/taxo/v1071_features.py src/taxo/v1072_features.py src/taxo/v1073_features.py
            src/taxo/v1074_features.py src/taxo/v1074_appendix_history.py src/taxo/v1075_features.py
            src/taxo/v1076_features.py src/taxo/v1077_features.py src/taxo/v1078_features.py
            src/taxo/v1079_features.py src/taxo/v10710_features.py
            src/taxo/v1081_features.py src/taxo/v1082_features.py src/taxo/v1083_features.py
            src/taxo/v1084_features.py src/taxo/v1085_features.py
            src/taxo/waybill_integrity.py src/taxo/vehicle_document_validity.py src/taxo/work_rest_compliance.py
            src/taxo/v1096_personnel_balance.py src/taxo/v1097_stoir_odometer.py
            src/taxo/v1098_orders_immutability.py src/taxo/v1099_schema_compatibility.py
            src/taxo/workspace.py src/taxo/vehicle_documents.py src/taxo/vehicle_maintenance.py
            src/taxo/vehicle_maintenance_ui.py src/taxo/document_viewer.py src/taxo/release_naming.py
            "assets/Бланк підтвердження.docx" assets/attestation_visual_template.pdf
            packaging/Taxo.spec packaging/Taxo_win7.spec packaging/Taxo_macos.spec
            packaging/history/stable-v10.3/Taxo.iss packaging/history/stable-v10.3/Taxo_macos.spec
            tests/stage_legacy_layout.py
            00_README_START.txt LICENSE.md COPYRIGHT.md THIRD_PARTY_NOTICES.md
            PROJECT_RULES.md PROJECT_STATE.md START_HERE.md WORKLOG.md
          )
          for file in "${required_files[@]}"; do
            if ! unzip -Z1 "$archive" | grep -Fq "/${file}"; then
              echo "Required START package file missing: ${file}" >&2
              exit 1
            fi
          done
          unzip -p "$archive" '*/START.bat' > /tmp/START.bat
          python - <<'PY'
          data = open('/tmp/START.bat','rb').read()
          if not data: raise SystemExit('START.bat is empty')
          if any(byte >= 128 for byte in data): raise SystemExit('START.bat must remain ASCII-only')
          if b'\r\n' not in data: raise SystemExit('START.bat must contain CRLF')
          PY

      - name: Stage START artifact without nested ZIP
        shell: bash
        run: |
          archive="${{ steps.pack.outputs.archive }}"
          stem="${{ steps.pack.outputs.stem }}"
          rm -rf artifact-upload
          mkdir artifact-upload
          unzip -q "$archive" -d artifact-upload
          test -d "artifact-upload/$stem"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.stem }}
          path: artifact-upload/
          if-no-files-found: error
          retention-days: 30
