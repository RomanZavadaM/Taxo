name: Package Taxo START source

on:
  push:
    branches:
      - main
      - 'work/v9.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create START.bat source archive
        id: pack
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess

          from release_naming import start_archive_stem, version_from_file

          stem = start_archive_stem(version_from_file("VERSION.txt"))
          archive = stem + ".zip"
          subprocess.check_call([
              "git", "archive", "--format=zip",
              f"--prefix={stem}/",
              f"--output={archive}",
              "HEAD",
          ])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"archive={archive}\n")
              out.write(f"stem={stem}\n")
          print(archive)
          PY

      - name: Verify clean operational package
        shell: bash
        run: |
          archive="${{ steps.pack.outputs.archive }}"

          if unzip -l "$archive" | grep -Eiq '\.(db|sqlite|sqlite3)([[:space:]]|$)|__pycache__|\.pyc([[:space:]]|$)'; then
            echo 'Database or cache unexpectedly included in source archive' >&2
            exit 1
          fi

          if unzip -l "$archive" | grep -Eiq '/(CHECKPOINT_v8|TEST_REPORT_v8|PUBLISH_STATUS_v8|PATCH_v8)'; then
            echo 'Legacy v8 development clutter unexpectedly included in START archive' >&2
            exit 1
          fi

          required_files=(
            START.bat
            requirements.txt
            taxo_app.py
            00_README_START.txt
            release_naming.py
            v9_release.py
            hotfix_901.py
            v91_features.py
            personnel_v91.py
            work_regime.py
          )

          for file in "${required_files[@]}"; do
            if ! unzip -l "$archive" | grep -q "/${file}$"; then
              echo "Required START package file missing: ${file}" >&2
              exit 1
            fi
          done

          unzip -p "$archive" "*/START.bat" > /tmp/START.bat
          python - <<'PY'
          data = open('/tmp/START.bat', 'rb').read()
          if not data:
              raise SystemExit('START.bat is empty')
          if any(byte >= 128 for byte in data):
              raise SystemExit('START.bat must remain ASCII-only for Windows cmd.exe compatibility')
          if b'chcp' in data.lower():
              raise SystemExit('START.bat must not switch code pages')
          if b'\r\n' not in data:
              raise SystemExit('START.bat must contain Windows CRLF line endings')
          PY

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.stem }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
