name: Package Taxo START source

on:
  push:
    branches:
      - main
      - 'work/v9.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create START.bat source archive
        id: pack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re, subprocess

          text = Path('VERSION.txt').read_text(encoding='utf-8')
          line = next((x.strip() for x in text.splitlines() if x.startswith('Version:')), 'Version: candidate')
          version = line.split(':', 1)[1].strip()
          candidate = re.search(r'(\d+)\.(\d+).*?r(\d+)', version, re.I)
          stable = re.fullmatch(r'(\d+)\.(\d+)(?:\.(\d+))?', version)
          if candidate:
              stem = f"Taxo_v{candidate.group(1)}_{candidate.group(2)}_candidate_r{candidate.group(3)}_START"
          elif stable:
              parts = [stable.group(1), stable.group(2)]
              if stable.group(3) is not None:
                  parts.append(stable.group(3))
              stem = "Taxo_v" + "_".join(parts) + "_START"
          else:
              safe = re.sub(r'[^A-Za-z0-9._-]+', '_', version).strip('_') or 'candidate'
              stem = f"Taxo_{safe}_START"
          archive = stem + '.zip'
          subprocess.check_call([
              'git', 'archive', '--format=zip', f'--prefix={stem}/', f'--output={archive}', 'HEAD'
          ])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"archive={archive}\n")
              out.write(f"stem={stem}\n")
          print(archive)
          PY

      - name: Verify clean operational package
        shell: bash
        run: |
          if unzip -l "${{ steps.pack.outputs.archive }}" | grep -Eiq '\.(db|sqlite|sqlite3)([[:space:]]|$)|__pycache__|\.pyc([[:space:]]|$)'; then
            echo 'Database or cache unexpectedly included in source archive' >&2
            exit 1
          fi
          if unzip -l "${{ steps.pack.outputs.archive }}" | grep -Eiq '/(CHECKPOINT_v8|TEST_REPORT_v8|PUBLISH_STATUS_v8|PATCH_v8)'; then
            echo 'Legacy v8 development clutter unexpectedly included in START archive' >&2
            exit 1
          fi
          unzip -l "${{ steps.pack.outputs.archive }}" | grep -q '/START.bat$'
          unzip -l "${{ steps.pack.outputs.archive }}" | grep -q '/taxo_app.py$'
          unzip -l "${{ steps.pack.outputs.archive }}" | grep -q '/v9_release.py$'
          unzip -l "${{ steps.pack.outputs.archive }}" | grep -q '/hotfix_901.py$'
          unzip -l "${{ steps.pack.outputs.archive }}" | grep -q '/v91_features.py$'
          unzip -l "${{ steps.pack.outputs.archive }}" | grep -q '/personnel_v91.py
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.stem }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

          unzip -l "${{ steps.pack.outputs.archive }}" | grep -q '/work_regime.py
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.stem }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 30


      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.stem }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
