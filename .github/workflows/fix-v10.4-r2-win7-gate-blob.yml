name: Prepare corrected Taxo 10.4-r2 Win7 gate blob

on:
  push:
    branches:
      - 'work/v10.4-r2-ui-docs-waybill'
    paths:
      - '.github/workflows/fix-v10.4-r2-win7-gate-blob.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create corrected publisher blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/publish-v10.4-r2.yml')
          text=p.read_text(encoding='utf-8')
          old='''          for path in root.rglob("*"):\n              if path.suffix.lower() not in {".exe", ".dll", ".pyd"}:\n                continue\n            try:\n'''
          new='''          for path in root.rglob("*"):\n              if path.suffix.lower() not in {".exe", ".dll", ".pyd"}:\n                  continue\n              try:\n'''
          if old not in text:
              raise SystemExit('Expected malformed Win7 gate block not found')
          text=text.replace(old,new,1)
          Path('/tmp/publisher.yml').write_text(text,encoding='utf-8')
          PY
          payload=$(base64 -w0 /tmp/publisher.yml)
          sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" -f content="$payload" -f encoding=base64 --jq .sha)
          mkdir -p .release
          printf '%s\n' "$sha" > .release/v10.4-r2-publisher-win7-blob-sha.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release/v10.4-r2-publisher-win7-blob-sha.txt
          git commit -m 'ci: prepare corrected r2 Win7 gate blob'
          git push origin HEAD:work/v10.4-r2-ui-docs-waybill
