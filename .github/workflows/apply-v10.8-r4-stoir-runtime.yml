name: Apply Taxo 10.8-r4 STOIR runtime once

on:
  push:
    branches:
      - work/v10.8-r4-stoir-maintenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.8-r4-stoir-maintenance
          fetch-depth: 0
      - name: Wire current runtime and legal OTK label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('taxo_app.py')
          text=path.read_text(encoding='utf-8')
          old='from v1083_features import install as install_v1083\n'
          new=old+'from v1084_features import install as install_v1084\n'
          if 'install_v1084' not in text:
              if old not in text: raise SystemExit('v1083 import anchor missing')
              text=text.replace(old,new,1)
          old2='App = install_v1083(core, App)\n'
          new2=old2+'App = install_v1084(core, App)\n'
          if 'App = install_v1084(core, App)' not in text:
              if old2 not in text: raise SystemExit('v1083 install anchor missing')
              text=text.replace(old2,new2,1)
          path.write_text(text,encoding='utf-8')

          path=Path('main.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace('APP_VERSION = "10.8-r3"','APP_VERSION = "10.8-r4"',1)
          path.write_text(text,encoding='utf-8')

          path=Path('vehicle_documents.py')
          text=path.read_text(encoding='utf-8')
          old='"inspection": "Діагностика / техконтроль"'
          new='"inspection": "Протокол ОТК / перевірки технічного стану"'
          if old not in text: raise SystemExit('inspection label anchor missing')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          path=Path('START.bat')
          data=path.read_bytes()
          text=data.decode('ascii')
          anchor='if not exist "v1083_features.py" goto :package_incomplete\r\n'
          if 'v1084_features.py' not in text:
              if anchor not in text: raise SystemExit('START v1083 anchor missing')
              text=text.replace(anchor,anchor+'if not exist "v1084_features.py" goto :package_incomplete\r\nif not exist "vehicle_maintenance.py" goto :package_incomplete\r\nif not exist "vehicle_maintenance_ui.py" goto :package_incomplete\r\n',1)
              text=text.replace('v1083_features.py','v1083_features.py, v1084_features.py, vehicle_maintenance.py, vehicle_maintenance_ui.py',1)
          path.write_bytes(text.encode('ascii'))
          PY
          git rm .github/workflows/apply-v10.8-r4-stoir-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taxo_app.py main.py vehicle_documents.py START.bat
          git commit -m "feat: wire 10.8-r4 STOIR runtime and OTK terminology"
          git push origin HEAD:work/v10.8-r4-stoir-maintenance
