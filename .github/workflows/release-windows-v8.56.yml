name: Build Taxo v8.56 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/windows-v8.56
    paths:
      - 'release/v8.56/**'
      - '.github/workflows/release-windows-v8.56.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v8.56
      SOURCE_SHA256: 333bb31ba2a378c61ce041f1b17d970c682b45d18f7cac564320b8d739c4fbaa
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified v8.56 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'release/v8.56/source/source.b64.part*.txt' | Sort-Object Name
          if ($parts.Count -eq 0) { throw 'Source parts not found' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('Taxo_v8_56_source.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'Taxo_v8_56_source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SOURCE_SHA256) { throw "Source SHA-256 mismatch: $hash" }
          Expand-Archive 'Taxo_v8_56_source.zip' -DestinationPath 'work' -Force
          if (!(Test-Path 'work/Taxo_v8_56/main.py')) { throw 'main.py not found after extraction' }
          Copy-Item 'release/v8.56/Taxo.spec' 'work/Taxo_v8_56/Taxo.spec' -Force
          New-Item -ItemType Directory -Force 'work/Taxo_v8_56/installer' | Out-Null
          Copy-Item 'release/v8.56/installer/Taxo.iss' 'work/Taxo_v8_56/installer/Taxo.iss' -Force

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install Python dependencies
        shell: pwsh
        working-directory: work/Taxo_v8_56
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Compile source
        shell: pwsh
        working-directory: work/Taxo_v8_56
        run: python -m py_compile main.py tachograph.py

      - name: Build portable application
        shell: pwsh
        working-directory: work/Taxo_v8_56
        run: python -m PyInstaller --noconfirm --clean Taxo.spec

      - name: Verify portable bundle
        shell: pwsh
        run: |
          if (!(Test-Path 'work/Taxo_v8_56/dist/Taxo/Taxo.exe')) { throw 'Taxo.exe not found' }
          if (!(Test-Path 'work/Taxo_v8_56/dist/Taxo/_internal/Бланк підтвердження.docx')) { throw 'DOCX template not found' }
          $db = Get-ChildItem 'work/Taxo_v8_56/dist/Taxo' -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'work/Taxo_v8_56/dist/Taxo' -DestinationPath 'Taxo_v8_56_Windows_x64_Portable.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        working-directory: work/Taxo_v8_56
        run: |
          New-Item -ItemType Directory -Force -Path release_out | Out-Null
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { throw 'ISCC.exe not found' }
          & $iscc 'installer\Taxo.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (!(Test-Path 'release_out/Taxo_v8_56_Setup_Windows_x64.exe')) { throw 'Installer not found' }

      - name: Copy release assets
        shell: pwsh
        run: |
          Copy-Item 'work/Taxo_v8_56/release_out/Taxo_v8_56_Setup_Windows_x64.exe' '.' -Force
          $files = @(
            'Taxo_v8_56_Setup_Windows_x64.exe',
            'Taxo_v8_56_Windows_x64_Portable.zip',
            'Taxo_v8_56_source.zip'
          )
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $f"
          }
          $lines | Set-Content -Encoding ascii 'SHA256SUMS_RELEASE.txt'
          Get-Content 'SHA256SUMS_RELEASE.txt'

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v8.56-Windows-release
          path: |
            Taxo_v8_56_Setup_Windows_x64.exe
            Taxo_v8_56_Windows_x64_Portable.zip
            Taxo_v8_56_source.zip
            SHA256SUMS_RELEASE.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release v8.56
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            'Taxo_v8_56_Setup_Windows_x64.exe',
            'Taxo_v8_56_Windows_x64_Portable.zip',
            'Taxo_v8_56_source.zip',
            'SHA256SUMS_RELEASE.txt'
          )
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            gh release edit $env:RELEASE_TAG --title 'Taxo v8.56' --notes-file 'release/v8.56/RELEASE_NOTES.md'
          } else {
            gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title 'Taxo v8.56' --notes-file 'release/v8.56/RELEASE_NOTES.md'
          }
