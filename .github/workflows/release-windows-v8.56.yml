name: Build Taxo v8.56 Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'tachograph.py'
      - 'Бланк підтвердження.docx'
      - 'requirements.txt'
      - 'Taxo.spec'
      - 'installer/**'
      - '.github/workflows/release-windows-v8.56.yml'
      - 'VERSION.txt'
      - 'RELEASE_NOTES_v8_56.md'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v8.56
      PYTHONUTF8: '1'
      MAIN_SHA256: 30c5d46974964be86ee3a0d72130f20ef7c63893c7e82e30b8484abda014815f
      TACHO_SHA256: 6018a71b4a283dbbba640e1daa313eff9f26cdde931aa4cba77884a5141d20cc
      TEMPLATE_SHA256: 47aeb545509af8d43102f76de772838b36de1fa85a2d09bae2d2ce7798358ec0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Verify v8.56 source hashes
        shell: pwsh
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $sha = [System.Security.Cryptography.SHA256]::Create()

          $textChecks = @{
            'main.py' = $env:MAIN_SHA256
            'tachograph.py' = $env:TACHO_SHA256
          }
          foreach ($file in $textChecks.Keys) {
            if (!(Test-Path $file)) { throw "Missing required file: $file" }
            $text = [IO.File]::ReadAllText($file, $utf8).Replace("`r`n", "`n")
            $bytes = $utf8.GetBytes($text)
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
            if ($actual -ne $textChecks[$file]) { throw "SHA-256 mismatch for $file : $actual" }
            Write-Host "OK $file $actual"
          }

          $template = 'Бланк підтвердження.docx'
          if (!(Test-Path $template)) { throw "Missing required file: $template" }
          $templateHash = (Get-FileHash $template -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($templateHash -ne $env:TEMPLATE_SHA256) { throw "SHA-256 mismatch for $template : $templateHash" }
          Write-Host "OK $template $templateHash"

      - name: Compile source
        shell: pwsh
        run: python -m py_compile main.py tachograph.py

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Build portable application
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean Taxo.spec

      - name: Verify portable bundle
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/Taxo/Taxo.exe')) { throw 'Taxo.exe not found' }
          if (!(Test-Path 'dist/Taxo/_internal/Бланк підтвердження.docx')) { throw 'DOCX template not found in bundle' }
          $db = Get-ChildItem 'dist/Taxo' -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/Taxo' -DestinationPath 'Taxo_v8_56_Windows_x64_Portable.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_out | Out-Null
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { throw 'ISCC.exe not found' }
          & $iscc 'installer\Taxo.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (!(Test-Path 'release_out/Taxo_v8_56_Setup_Windows_x64.exe')) { throw 'Installer not found' }

      - name: Create source ZIP
        shell: pwsh
        run: |
          $source = @(
            'main.py','tachograph.py','Бланк підтвердження.docx','requirements.txt',
            'START.bat','README.md','PROJECT_STATE.md','VERSION.txt','Taxo.spec',
            'installer','RELEASE_NOTES_v8_56.md'
          )
          Compress-Archive -Path $source -DestinationPath 'Taxo_v8_56_source.zip' -Force

      - name: Create release checksums
        shell: pwsh
        run: |
          $files = @(
            'release_out/Taxo_v8_56_Setup_Windows_x64.exe',
            'Taxo_v8_56_Windows_x64_Portable.zip',
            'Taxo_v8_56_source.zip'
          )
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $([IO.Path]::GetFileName($f))"
          }
          $lines | Set-Content -Encoding ascii 'SHA256SUMS_RELEASE.txt'
          Get-Content 'SHA256SUMS_RELEASE.txt'

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v8.56-Windows-release
          path: |
            release_out/Taxo_v8_56_Setup_Windows_x64.exe
            Taxo_v8_56_Windows_x64_Portable.zip
            Taxo_v8_56_source.zip
            SHA256SUMS_RELEASE.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release v8.56
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item 'release_out/Taxo_v8_56_Setup_Windows_x64.exe' '.' -Force
          $assets = @(
            'Taxo_v8_56_Setup_Windows_x64.exe',
            'Taxo_v8_56_Windows_x64_Portable.zip',
            'Taxo_v8_56_source.zip',
            'SHA256SUMS_RELEASE.txt'
          )
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            gh release edit $env:RELEASE_TAG --title 'Taxo v8.56' --notes-file 'RELEASE_NOTES_v8_56.md'
          } else {
            gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title 'Taxo v8.56' --notes-file 'RELEASE_NOTES_v8_56.md'
          }
