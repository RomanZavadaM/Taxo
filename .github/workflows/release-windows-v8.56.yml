name: Build Taxo v8.56 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - build/windows-v8.56
    paths:
      - '.github/workflows/release-windows-v8.56.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect existing v8.41 control package
        shell: pwsh
        run: |
          $archive = 'releases/Taxo_v8_41_source.zip'
          if (!(Test-Path $archive)) { throw "Missing $archive" }
          New-Item -ItemType Directory -Force 'inspect' | Out-Null
          Expand-Archive $archive -DestinationPath 'inspect' -Force
          Write-Host 'Archive contents:'
          Get-ChildItem inspect -Recurse -File | ForEach-Object { Write-Host $_.FullName }
          $template = Get-ChildItem inspect -Recurse -File -Filter '*.docx' | Select-Object -First 1
          if (!$template) { throw 'DOCX template not found in v8.41 archive' }
          $hash = (Get-FileHash $template.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "TEMPLATE_PATH=$($template.FullName)"
          Write-Host "TEMPLATE_SHA256=$hash"
          Write-Host "EXPECTED_V856_TEMPLATE_SHA256=47aeb545509af8d43102f76de772838b36de1fa85a2d09bae2d2ce7798358ec0"
