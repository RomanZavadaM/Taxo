# Taxo 10.7-r8 source publisher
name: Publish Taxo 10.7-r8 source prerelease

on:
  push:
    branches:
      - 'work/v10.7-r8-operations-order-groups'
    paths:
      - '.github/workflows/publish-v10.7-r8-source.yml'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from release_naming import version_from_file
          version = version_from_file('VERSION.txt')
          if version != '10.7-r8':
              raise SystemExit(f'Expected 10.7-r8, got {version!r}')
          main = Path('main.py').read_text(encoding='utf-8')
          entry = Path('taxo_app.py').read_text(encoding='utf-8')
          if 'APP_VERSION = "10.7-r8"' not in main:
              raise SystemExit('main.APP_VERSION is not 10.7-r8')
          if 'App = install_v1078(core, App)' not in entry:
              raise SystemExit('10.7-r8 runtime layer is not outermost')
          PY

      - name: Install Tk runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install regression dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full regression suite
        run: python -m unittest discover -s tests -v

      - name: Build immutable START archive
        shell: bash
        run: |
          stem='Taxo_v10_7_candidate_r8_START'
          archive="${stem}.zip"
          git archive --format=zip --prefix="${stem}/" --output="${archive}" HEAD

          if unzip -l "${archive}" | grep -Eiq '\.(db|sqlite|sqlite3)([[:space:]]|$)|__pycache__|\.pyc([[:space:]]|$)'; then
            echo 'Database or cache unexpectedly included in candidate archive' >&2
            exit 1
          fi

          required_files=(
            START.bat
            requirements.txt
            taxo_app.py
            main.py
            operations_orders.py
            operations_orders_ui.py
            v1078_features.py
            VERSION.txt
            docs/releases/RELEASE_NOTES_v10.7-r8.md
            LICENSE.md
            COPYRIGHT.md
            THIRD_PARTY_NOTICES.md
          )
          for file in "${required_files[@]}"; do
            unzip -l "${archive}" | grep -q "/${file}$" || { echo "Missing ${file}" >&2; exit 1; }
          done

          unzip -p "${archive}" "*/START.bat" > /tmp/START.bat
          python - <<'PY'
          data = open('/tmp/START.bat', 'rb').read()
          if not data or any(byte >= 128 for byte in data):
              raise SystemExit('START.bat must remain non-empty ASCII')
          if b'chcp' in data.lower():
              raise SystemExit('START.bat must not switch code pages')
          if b'\r\n' not in data:
              raise SystemExit('START.bat must contain CRLF line endings')
          PY

          sha256sum "${archive}" > SHA256SUMS_v10_7_r8.txt

      - name: Refuse overwrite of immutable tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v10.7-r8 >/dev/null 2>&1; then
            echo 'v10.7-r8 tag already exists; refusing to move or overwrite it.' >&2
            exit 1
          fi
          if gh release view v10.7-r8 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'v10.7-r8 release already exists; refusing to overwrite it.' >&2
            exit 1
          fi

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v10.7-r8 \
            Taxo_v10_7_candidate_r8_START.zip \
            SHA256SUMS_v10_7_r8.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title 'Taxo 10.7-r8' \
            --notes-file docs/releases/RELEASE_NOTES_v10.7-r8.md \
            --prerelease
