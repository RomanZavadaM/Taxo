name: Apply Taxo 10.4-r7 registry merge policy

on:
  push:
    branches:
      - work/v10.4-r7-document-control-registry-separation
    paths:
      - .github/workflows/patch-v10.4-r7-registry-merge-policy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r7-document-control-registry-separation
          fetch-depth: 0
      - name: Apply registry reconciliation modes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # personnel_registry.py — explicit reconciliation modes + quarterly freshness + local-only comparison.
          path=Path('personnel_registry.py')
          text=path.read_text('utf-8')
          anchor='SOURCE_SUMMARY = "military_registry_employees"\n'
          addition='''SOURCE_SUMMARY = "military_registry_employees"\n\nIMPORT_COMPARE = "compare"\nIMPORT_FILL_EMPTY = "fill_empty"\nIMPORT_UPDATE = "update"\nIMPORT_MODES = (IMPORT_COMPARE, IMPORT_FILL_EMPTY, IMPORT_UPDATE)\nIMPORT_MODE_LABELS = {\n    IMPORT_COMPARE: "Лише звірити",\n    IMPORT_FILL_EMPTY: "Доповнити порожні поля",\n    IMPORT_UPDATE: "Оновити з реєстру + доповнити",\n}\n'''
          if 'IMPORT_COMPARE = "compare"' not in text:
              if anchor not in text: raise SystemExit('source constants anchor missing')
              text=text.replace(anchor,addition,1)

          # Existing installations need the mode column too.
          schema_anchor='''    con.executescript("""\n        CREATE TABLE IF NOT EXISTS employee_military_profile ('''
          # We add migration after executescript closes, using a stable later anchor.
          migration_anchor='''    """)\n\n\ndef ensure_schema(core):'''
          migration='''    """)\n    import_cols={row[1] for row in con.execute("PRAGMA table_info(employee_registry_imports)").fetchall()}\n    if "mode" not in import_cols:\n        con.execute("ALTER TABLE employee_registry_imports ADD COLUMN mode TEXT NOT NULL DEFAULT 'update'")\n\n\ndef ensure_schema(core):'''
          if 'PRAGMA table_info(employee_registry_imports)' not in text:
              if migration_anchor not in text: raise SystemExit('schema migration anchor missing')
              text=text.replace(migration_anchor,migration,1)

          # Preview also reports local Taxo employees absent from this exact extract.
          old_preview='''def preview_registry_import(core, path):\n    parsed=parse_registry_xlsx(path)\n    sha=file_sha256(path)\n    con=core.db()\n    try:\n        plan=plan_import_rows(con,parsed)\n    finally:\n        con.close()\n    return {"path":str(path),"file_sha256":sha,"parsed":parsed,"plan":plan}\n'''
          new_preview='''def preview_registry_import(core, path):\n    parsed=parse_registry_xlsx(path)\n    sha=file_sha256(path)\n    con=core.db()\n    try:\n        plan=plan_import_rows(con,parsed)\n        matched_ids={int(row["employee_id"]) for row in plan if row.get("employee_id") is not None}\n        local_only=[]\n        for employee in con.execute("SELECT * FROM employees WHERE COALESCE(active,1)=1 ORDER BY last_name,first_name,middle_name,id").fetchall():\n            if int(employee["id"]) in matched_ids:\n                continue\n            local_only.append({\n                "employee_id":int(employee["id"]),\n                "employee_name":" ".join(x for x in (employee["last_name"],employee["first_name"],employee["middle_name"]) if x),\n                "status":"local_only",\n                "note":"Є у Taxo, але відсутній у цьому витягу. Дані не видаляються і не обнуляються.",\n            })\n    finally:\n        con.close()\n    return {"path":str(path),"file_sha256":sha,"parsed":parsed,"plan":plan,"local_only":local_only}\n\n\ndef _changes_for_mode(changes, mode):\n    if mode not in IMPORT_MODES:\n        raise ValueError("Невідомий режим реєстрової звірки: %s" % mode)\n    if mode==IMPORT_COMPARE:\n        return []\n    if mode==IMPORT_FILL_EMPTY:\n        return [change for change in changes if not _text(change.get("old")) and _text(change.get("new"))]\n    return [change for change in changes if _text(change.get("new"))]\n\n\ndef registry_quarter_status(con, source_kind=None, today=None):\n    """Return whether at least one successful reconciliation exists in current calendar quarter."""\n    ensure_schema_on_connection(con)\n    today=today or date.today()\n    quarter=(today.month-1)//3+1\n    first_month=(quarter-1)*3+1\n    quarter_start=date(today.year,first_month,1)\n    params=[]\n    sql="SELECT imported_at,source_kind,source_name,mode FROM employee_registry_imports"\n    if source_kind:\n        sql += " WHERE source_kind=?"\n        params.append(source_kind)\n    sql += " ORDER BY imported_at DESC,id DESC LIMIT 1"\n    row=con.execute(sql,params).fetchone()\n    last_date=None\n    if row is not None:\n        try: last_date=datetime.fromisoformat(str(row["imported_at"])).date()\n        except Exception: last_date=None\n    current=bool(last_date and last_date>=quarter_start and last_date<=today)\n    return {\n        "current":current,\n        "quarter":"Q%d %d" % (quarter,today.year),\n        "label":"Актуально" if current else "Потрібне звіряння",\n        "last_date":last_date.isoformat() if last_date else "",\n        "source_kind":row["source_kind"] if row is not None else "",\n        "source_name":row["source_name"] if row is not None else "",\n        "mode":row["mode"] if row is not None and "mode" in row.keys() else "",\n    }\n'''
          if old_preview not in text: raise SystemExit('preview block missing')
          text=text.replace(old_preview,new_preview,1)

          # Replace apply function with mode-aware implementation while preserving snapshots/provenance.
          start=text.index('def apply_registry_import(core, preview):')
          end=text.index('\n\ndef employee_profile(',start)
          old_apply=text[start:end]
          new_apply='''def apply_registry_import(core, preview, mode=IMPORT_UPDATE):\n    if mode not in IMPORT_MODES:\n        raise ValueError("Невідомий режим реєстрової звірки: %s" % mode)\n    path=preview["path"]\n    current_sha=file_sha256(path)\n    if current_sha!=preview["file_sha256"]:\n        raise ValueError("Файл змінився після попереднього перегляду. Виконайте імпорт ще раз.")\n    parsed=preview["parsed"]\n    plan=preview["plan"]\n    now=datetime.now().isoformat(timespec="seconds")\n    con=core.db()\n    try:\n        ensure_schema_on_connection(con)\n        cur=con.execute(\n            """INSERT INTO employee_registry_imports(\n                   source_kind,source_name,file_sha256,imported_at,total_rows,mode\n               ) VALUES(?,?,?,?,?,?)""",\n            (parsed["source_kind"],parsed["source_name"],current_sha,now,len(plan),mode),\n        )\n        import_id=cur.lastrowid\n        matched=updated=skipped=warnings=0\n        potential_changes=0\n        for row_plan in plan:\n            warnings += len(row_plan.get("notes") or [])\n            employee_id=row_plan.get("employee_id")\n            if employee_id is None:\n                skipped += 1\n                continue\n            matched += 1\n            item=row_plan["item"]\n            potential_changes += len(row_plan.get("changes") or [])\n            selected_changes=_changes_for_mode(row_plan.get("changes") or [],mode)\n            employee_changes=[c for c in selected_changes if c["scope"]=="employee"]\n            if employee_changes:\n                sql="UPDATE employees SET "+", ".join(c["field"]+"=?" for c in employee_changes)+" WHERE id=?"\n                con.execute(sql,[c["new"] for c in employee_changes]+[employee_id])\n            military_changes=[c for c in selected_changes if c["scope"]=="military"]\n            _ensure_profile(con,employee_id)\n            if military_changes:\n                sql="UPDATE employee_military_profile SET "+", ".join(c["field"]+"=?" for c in military_changes)+", last_source_kind=?, last_source_name=?, last_verified_at=?, updated_at=? WHERE employee_id=?"\n                con.execute(sql,[c["new"] for c in military_changes]+[\n                    parsed["source_kind"],parsed["source_name"],now,now,employee_id\n                ])\n            else:\n                con.execute(\n                    """UPDATE employee_military_profile SET last_source_kind=?,last_source_name=?,last_verified_at=?,updated_at=?\n                       WHERE employee_id=?""",\n                    (parsed["source_kind"],parsed["source_name"],now,now,employee_id),\n                )\n            if selected_changes:\n                updated += 1\n            snapshot=_canonical_snapshot(item)\n            fingerprint=_row_fingerprint(item)\n            con.execute(\n                """INSERT OR IGNORE INTO employee_military_history(\n                       employee_id,import_id,source_kind,source_name,file_sha256,source_row,\n                       row_fingerprint,snapshot_json,imported_at\n                   ) VALUES(?,?,?,?,?,?,?,?,?)""",\n                (employee_id,import_id,parsed["source_kind"],parsed["source_name"],current_sha,\n                 item.get("source_row"),fingerprint,\n                 json.dumps(snapshot,ensure_ascii=False,sort_keys=True),now),\n            )\n            # Compare-only must never mutate the local document register.\n            if mode!=IMPORT_COMPARE:\n                for doc in item.get("documents",[]):\n                    _upsert_document_hint(con,employee_id,doc,parsed["source_kind"],parsed["source_name"],now)\n        con.execute(\n            """UPDATE employee_registry_imports\n               SET matched_rows=?,updated_rows=?,skipped_rows=?,warning_count=? WHERE id=?""",\n            (matched,updated,skipped,warnings,import_id),\n        )\n        con.commit()\n        return {"import_id":import_id,"total":len(plan),"matched":matched,"updated":updated,\n                "skipped":skipped,"warnings":warnings,"potential_changes":potential_changes,\n                "local_only":len(preview.get("local_only") or []),"mode":mode,\n                "source_kind":parsed["source_kind"],"source_name":parsed["source_name"]}\n    except Exception:\n        con.rollback()\n        raise\n    finally:\n        con.close()\n'''
          text=text[:start]+new_apply+text[end:]
          path.write_text(text,'utf-8')

          # v1045 UI — expose three explicit modes and quarterly state.
          path=Path('v1045_features.py')
          text=path.read_text('utf-8')
          old_button='''            core.ttk.Button(\n                parent,text="Імпорт з реєстру…",command=self.import_personnel_registry_xlsx\n            ).pack(side="right",padx=(8,0))'''
          new_button='''            self._personnel_registry_import_button=core.ttk.Button(\n                parent,text="Імпорт з реєстру…",command=self.import_personnel_registry_xlsx\n            )\n            self._personnel_registry_import_button.pack(side="right",padx=(8,0))\n            self._refresh_personnel_registry_quarter_status()'''
          if old_button not in text: raise SystemExit('registry import button anchor missing')
          text=text.replace(old_button,new_button,1)

          method_anchor='''        def import_personnel_registry_xlsx(self):\n'''
          status_method='''        def _refresh_personnel_registry_quarter_status(self):\n            button=getattr(self,"_personnel_registry_import_button",None)\n            if not _alive(button):\n                return\n            con=core.db()\n            try:\n                status=registry.registry_quarter_status(con)\n            finally:\n                con.close()\n            if status["current"]:\n                button.configure(text="Реєстр працівників: актуально %s…" % status["quarter"])\n            else:\n                button.configure(text="Реєстр працівників: потрібне звіряння %s…" % status["quarter"])\n\n'''+method_anchor
          if '_refresh_personnel_registry_quarter_status' not in text[text.index('class Taxo1045App'):]:
              if method_anchor not in text: raise SystemExit('import method anchor missing')
              text=text.replace(method_anchor,status_method,1)

          # Add local-only count and explicit import mode controls before the table.
          summary_old='''            updates=sum(1 for row in plan if row["status"]=="update")\n            matched=sum(1 for row in plan if row.get("employee_id") is not None)\n            problem=sum(1 for row in plan if row["status"] in ("unmatched","ambiguous","conflict"))'''
          summary_new='''            updates=sum(1 for row in plan if row["status"]=="update")\n            matched=sum(1 for row in plan if row.get("employee_id") is not None)\n            problem=sum(1 for row in plan if row["status"] in ("unmatched","ambiguous","conflict"))\n            local_only=list(preview.get("local_only") or [])'''
          if summary_old not in text: raise SystemExit('preview summary anchor missing')
          text=text.replace(summary_old,summary_new,1)

          old_info='''                text=("Taxo не створює нових працівників автоматично. РНОКПП має пріоритет; збіг лише за ПІБ показується окремо. "\n                      "Порожні поля джерела не стирають наявні дані."),\n                wraplength=1040,justify="left",\n            ).pack(anchor="w",pady=(0,10))\n            frame=core.ttk.Frame(body); frame.pack(fill="both",expand=True)'''
          new_info='''                text=("Taxo не створює нових працівників автоматично. РНОКПП має пріоритет; збіг лише за ПІБ показується окремо. "\n                      "Порожні поля джерела ніколи не стирають наявні дані. Відсутність працівника/поля у витягу не видаляє його з Taxo."),\n                wraplength=1040,justify="left",\n            ).pack(anchor="w",pady=(0,8))\n            mode_var=core.tk.StringVar(value=registry.IMPORT_FILL_EMPTY)\n            modes=core.ttk.LabelFrame(body,text="Режим застосування державного витягу",padding=(8,5))\n            modes.pack(fill="x",pady=(0,10))\n            for value,label in (\n                (registry.IMPORT_COMPARE,"Лише звірити — нічого не змінювати в Taxo"),\n                (registry.IMPORT_FILL_EMPTY,"Доповнити — заповнити тільки порожні поля та нові відомості"),\n                (registry.IMPORT_UPDATE,"Оновити — замінити непорожні реєстрові поля та доповнити нове"),\n            ):\n                core.ttk.Radiobutton(modes,text=label,variable=mode_var,value=value).pack(anchor="w",pady=1)\n            core.ttk.Label(\n                modes,\n                text="У всіх режимах дані, яких немає у витягу, залишаються в Taxo без змін.",\n                style="Muted.TLabel",\n            ).pack(anchor="w",pady=(4,0))\n            frame=core.ttk.Frame(body); frame.pack(fill="both",expand=True)'''
          if old_info not in text: raise SystemExit('preview info anchor missing')
          text=text.replace(old_info,new_info,1)

          # Add local-only rows to comparison table.
          insert_anchor='''            tree.tag_configure("update",foreground="#0B5D1E")'''
          local_insert='''            for offset,row in enumerate(local_only,start=len(plan)):\n                tree.insert("","end",iid="local-%d" % offset,values=(\n                    "Є лише в Taxo",row["employee_name"],"—","—",row["note"]\n                ),tags=("local_only",))\n            tree.tag_configure("local_only",foreground="#7A5B00")\n'''+insert_anchor
          if insert_anchor not in text: raise SystemExit('tree tag anchor missing')
          text=text.replace(insert_anchor,local_insert,1)

          # Apply chosen mode, not unconditional overwrite.
          old_confirm='''                    "Буде оновлено %d карток працівників.\\n\\nНеоднозначні, конфліктні та незнайдені рядки буде пропущено. Продовжити?" % updates,'''
          new_confirm='''                    "Режим: %s\\nПотенційних карток зі змінами: %d.\\n\\nНеоднозначні, конфліктні та незнайдені рядки буде пропущено. Дані, відсутні у витягу, не видаляються. Продовжити?" % (registry.IMPORT_MODE_LABELS[mode_var.get()],updates),'''
          if old_confirm not in text: raise SystemExit('confirmation anchor missing')
          text=text.replace(old_confirm,new_confirm,1)
          text=text.replace('result=registry.apply_registry_import(core,preview)','result=registry.apply_registry_import(core,preview,mode=mode_var.get())',1)
          old_result='''                    ("Джерело: %s\\nРядків: %d\\nЗіставлено: %d\\nОновлено: %d\\nПропущено: %d\\nПопереджень: %d"\n                     % (_source_label(result["source_kind"]),result["total"],result["matched"],\n                        result["updated"],result["skipped"],result["warnings"])),'''
          new_result='''                    ("Джерело: %s\\nРежим: %s\\nРядків: %d\\nЗіставлено: %d\\nЗмінено карток: %d\\nЄ лише в Taxo: %d\\nПропущено: %d\\nПопереджень: %d"\n                     % (_source_label(result["source_kind"]),registry.IMPORT_MODE_LABELS[result["mode"]],result["total"],result["matched"],\n                        result["updated"],result["local_only"],result["skipped"],result["warnings"])),'''
          if old_result not in text: raise SystemExit('result info anchor missing')
          text=text.replace(old_result,new_result,1)
          text=text.replace('''                win.destroy()\n\n            core.ttk.Button(actions,text="Закрити"''','''                self._refresh_personnel_registry_quarter_status()\n                win.destroy()\n\n            core.ttk.Button(actions,text="Закрити"''',1)
          path.write_text(text,'utf-8')

          # Permanent architecture wording for both people and «Шлях».
          path=Path('docs/architecture/REGISTRY_AND_LOCAL_DOCUMENTS_BOUNDARY.md')
          doc=path.read_text('utf-8')
          if '## Правила застосування XLSX' not in doc:
              doc += '''\n\n## Правила застосування XLSX\n\nДля кожного підтриманого державного XLSX/CSV Taxo пропонує три режими:\n\n1. **Лише звірити** — показати відповідності/розбіжності, записати факт звірки та snapshot, не змінювати робочі поля Taxo.\n2. **Доповнити** — заповнити тільки порожні локальні поля та додати нові відомості, які є у реєстрі.\n3. **Оновити з реєстру + доповнити** — для полів, які реально присутні й непорожні у витягу, прийняти значення реєстру; нові відомості додати.\n\nНезалежно від режиму:\n\n- порожнє поле реєстру ніколи не очищує локальне поле Taxo;\n- запис/поле, якого немає у витягу, не видаляється і не архівується автоматично;\n- локальні записи, відсутні у поточному витягу, позначаються як **«є у Taxo, відсутнє у цьому витягу»** для аналізу того, що державний зріз не підтверджує;\n- конфлікти і неоднозначні збіги не перезаписуються автоматично;\n- раз на календарний квартал Taxo нагадує отримати свіжий витяг і повторити звірку; ручне повторне звіряння дозволене будь-коли.\n\nЦі правила однаково застосовуються до реєстрових відомостей працівників/військового обліку та до реєстру «Шлях» по ТЗ/ліцензійній справі. Вони не поширюються на локальний контроль документів ТЗ.\n'''
          path.write_text(doc,'utf-8')

          # Extend r7 tests with pure merge-policy / quarterly assertions.
          path=Path('tests/test_v10_4_r7.py')
          test=path.read_text('utf-8')
          test=test.replace('from pathlib import Path\n','from pathlib import Path\nfrom datetime import date\nimport sqlite3\n\nimport personnel_registry as registry\n',1)
          marker='''    def test_boundary_is_recorded_as_permanent_rule(self):\n'''
          extra='''    def test_registry_modes_never_delete_missing_values(self):\n        changes=[\n            {"old":"LOCAL","new":"REGISTRY"},\n            {"old":"","new":"NEW"},\n            {"old":"LOCAL_ONLY","new":""},\n        ]\n        self.assertEqual(registry._changes_for_mode(changes,registry.IMPORT_COMPARE),[])\n        fill=registry._changes_for_mode(changes,registry.IMPORT_FILL_EMPTY)\n        self.assertEqual([c["new"] for c in fill],["NEW"])\n        update=registry._changes_for_mode(changes,registry.IMPORT_UPDATE)\n        self.assertEqual([c["new"] for c in update],["REGISTRY","NEW"])\n\n    def test_quarterly_status_uses_calendar_quarter(self):\n        con=sqlite3.connect(":memory:")\n        con.row_factory=sqlite3.Row\n        con.execute("CREATE TABLE employees(id INTEGER PRIMARY KEY, active INTEGER, last_name TEXT, first_name TEXT, middle_name TEXT)")\n        registry.ensure_schema_on_connection(con)\n        con.execute("INSERT INTO employee_registry_imports(source_kind,source_name,file_sha256,imported_at,total_rows,mode) VALUES(?,?,?,?,?,?)",\n                    (registry.SOURCE_SUMMARY,"test.xlsx","abc","2026-07-01T09:00:00",1,registry.IMPORT_COMPARE))\n        self.assertTrue(registry.registry_quarter_status(con,today=date(2026,9,30))["current"])\n        self.assertFalse(registry.registry_quarter_status(con,today=date(2026,10,1))["current"])\n        con.close()\n\n'''+marker
          if 'test_registry_modes_never_delete_missing_values' not in test:
              if marker not in test: raise SystemExit('test marker missing')
              test=test.replace(marker,extra,1)
          path.write_text(test,'utf-8')
          PY

          git rm .github/workflows/patch-v10.4-r7-registry-merge-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personnel_registry.py v1045_features.py docs/architecture/REGISTRY_AND_LOCAL_DOCUMENTS_BOUNDARY.md tests/test_v10_4_r7.py
          git diff --cached --check
          git commit -m "feat: add safe registry reconciliation modes and quarterly reminder"
          git push origin HEAD:work/v10.4-r7-document-control-registry-separation
