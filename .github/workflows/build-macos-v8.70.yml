name: Test Taxo source / build macOS on demand

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'main.py'
      - 'taxo_app.py'
      - 'sitecustomize.py'
      - 'src/taxo/**'
      - 'assets/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'tests/**'
      - 'VERSION.txt'
      - 'WORKLOG.md'
      - '.github/workflows/build-macos-v8.70.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/src/taxo

    steps:
      - name: Checkout current Taxo candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Verify runner architecture and layout
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          version="$(sed -n 's/^Version:[[:space:]]*//p' VERSION.txt | tr -d '\r')"
          test -n "$version"
          grep -Fq "APP_VERSION = \"$version\"" main.py
          test -f src/taxo/application_context.py
          test -f assets/attestation_visual_template.pdf
          test -f packaging/Taxo_macos.spec
          test -f tests/stage_legacy_layout.py

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build-macos.txt

      - name: Resolve release naming from VERSION.txt
        run: python src/taxo/release_naming.py --github-env "$GITHUB_ENV"

      - name: Compile structured source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = [Path('main.py'), Path('taxo_app.py'), Path('sitecustomize.py')]
          files.extend(sorted(Path('src/taxo').glob('*.py')))
          if len(files) <= 3:
              raise SystemExit('No structured source modules found in src/taxo')
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f'Compiled {len(files)} Python files.')
          PY

      - name: Stage legacy layout for historical regression only
        run: python tests/stage_legacy_layout.py

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Build native Taxo.app
        shell: bash
        run: python -m PyInstaller --noconfirm --clean packaging/Taxo_macos.spec

      - name: Verify application bundle
        shell: bash
        run: |
          test -x 'dist/Taxo.app/Contents/MacOS/Taxo'
          find 'dist/Taxo.app' -path '*/assets/Бланк підтвердження.docx' -print -quit | grep -q .
          find 'dist/Taxo.app' -path '*/assets/attestation_visual_template.pdf' -print -quit | grep -q .
          if find 'dist/Taxo.app' -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit | grep -q .; then
            echo 'Database unexpectedly bundled in Taxo.app' >&2
            exit 1
          fi
          file 'dist/Taxo.app/Contents/MacOS/Taxo' | grep -q "${{ matrix.arch }}"
          python scripts/check_bundle_licenses.py 'dist/Taxo.app'
          codesign --verify --deep --strict 'dist/Taxo.app'

      - name: Create portable ZIP and checksum
        shell: bash
        run: |
          bundle_dir="${TAXO_CANDIDATE_STEM}_macOS_${{ matrix.arch }}"
          zip_name="${bundle_dir}_Portable.zip"
          mkdir "$bundle_dir"
          mv 'dist/Taxo.app' "$bundle_dir/Taxo.app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$bundle_dir" "$zip_name"
          shasum -a 256 "$zip_name" > "SHA256SUMS_v${TAXO_CHECKSUM_STEM}_macOS_${{ matrix.arch }}.txt"

      - name: Upload macOS candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Taxo-current-macOS-${{ matrix.arch }}
          path: |
            Taxo_v*_macOS_${{ matrix.arch }}_Portable.zip
            SHA256SUMS_v*_macOS_${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30
