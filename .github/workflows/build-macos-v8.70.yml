name: Test Taxo 9.x source / build macOS on demand

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'main.py'
      - 'taxo_app.py'
      - 'work_analysis_ext.py'
      - 'activity_register_60.py'
      - 'v91_features.py'
      - 'personnel_v91.py'
      - 'work_regime.py'
      - 'workspace.py'
      - 'waybill.py'
      - 'tachograph.py'
      - 'attestation_render.py'
      - 'Бланк підтвердження.docx'
      - 'attestation_visual_template.pdf'
      - 'requirements.txt'
      - 'requirements-build-macos.txt'
      - 'Taxo_macos.spec'
      - 'tests/**'
      - '.github/workflows/build-macos-v8.70.yml'
      - 'VERSION.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout current Taxo candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install macOS packaging dependencies
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          python -m pip install -r requirements-build-macos.txt

      - name: Compile and test source
        shell: bash
        run: |
          python -m py_compile main.py taxo_app.py work_analysis_ext.py activity_register_60.py v9_release.py hotfix_901.py v91_features.py personnel_v91.py work_regime.py workspace.py waybill.py tachograph.py attestation_render.py
          python -m unittest discover -s tests -v

      - name: Build native Taxo.app
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: python -m PyInstaller --noconfirm --clean Taxo_macos.spec

      - name: Verify application bundle
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test -x 'dist/Taxo.app/Contents/MacOS/Taxo'
          find 'dist/Taxo.app' -name 'Бланк підтвердження.docx' -print -quit | grep -q .
          find 'dist/Taxo.app' -name 'attestation_visual_template.pdf' -print -quit | grep -q .
          if find 'dist/Taxo.app' -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit | grep -q .; then
            echo 'Database unexpectedly bundled in Taxo.app' >&2
            exit 1
          fi
          file 'dist/Taxo.app/Contents/MacOS/Taxo' | grep -q "${{ matrix.arch }}"
          codesign --verify --deep --strict 'dist/Taxo.app'

      - name: Create portable ZIP and checksum
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          bundle_dir="Taxo_v9_1_candidate_r9_7_macOS_${{ matrix.arch }}"
          zip_name="${bundle_dir}_Portable.zip"
          mkdir "${bundle_dir}"
          mv 'dist/Taxo.app' "${bundle_dir}/Taxo.app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "${bundle_dir}" "${zip_name}"
          shasum -a 256 "${zip_name}" > "SHA256SUMS_v9_1_candidate_r9_7_macOS_${{ matrix.arch }}.txt"

      - name: Upload macOS candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v9.1-macOS-${{ matrix.arch }}-candidate-r9.7
          path: |
            Taxo_v9_1_candidate_r9_7_macOS_${{ matrix.arch }}_Portable.zip
            SHA256SUMS_v9_1_candidate_r9_7_macOS_${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30
