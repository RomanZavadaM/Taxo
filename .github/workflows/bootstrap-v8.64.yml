name: Bootstrap Taxo v8.64 source

on:
  workflow_dispatch:
  push:
    branches:
      - candidate-v8.64
    paths:
      - '.github/workflows/bootstrap-v8.64.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      ARCHIVE_SHA256: 6635bd9e065e836378f455cebe7c97d381d6e1356d0efc038d882660471aba0c
      MAIN_SHA256: 2f23301d651372d06b6a39f0edb03b009b23a61e919c98b2123c855835f8483c
      TACHO_SHA256: 83c916457c6602e9ed93a55fdc0578e91775e073dad12da94ccd31d1e81fa108
      RENDER_SHA256: b65178e0bf18207e75e10ebfb6c2896397e685184228ece70efb7615d4215c88
      TEMPLATE_SHA256: 47aeb545509af8d43102f76de772838b36de1fa85a2d09bae2d2ce7798358ec0
      VISUAL_TEMPLATE_SHA256: 6e5d79bebdeed68c79e49d438d37dbd165e2316fda3233b3442911a9a3b61151

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preserved DOCX template
        shell: pwsh
        run: |
          $template = 'Бланк підтвердження.docx'
          if (!(Test-Path $template)) { throw 'DOCX template is missing before bootstrap' }
          $actual = (Get-FileHash $template -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TEMPLATE_SHA256) { throw "DOCX template SHA-256 mismatch: $actual" }

      - name: Reconstruct and verify source archive
        shell: pwsh
        run: |
          $ordered = @()
          $ordered += 0..8 | ForEach-Object { Get-Item ('.release_payload/v8.64/part{0:D2}.b64' -f $_) }
          $ordered += Get-ChildItem '.release_payload/v8.64/rem09_*.b64' | Sort-Object Name
          $ordered += 10..12 | ForEach-Object { Get-Item ('.release_payload/v8.64/part{0:D2}.b64' -f $_) }
          $ordered += Get-ChildItem '.release_payload/v8.64/rem13_*.b64' | Sort-Object Name
          $ordered += Get-ChildItem '.release_payload/v8.64/rem14_*.b64' | Sort-Object Name
          $ordered += Get-ChildItem '.release_payload/v8.64/rem15_*.b64' | Sort-Object Name
          $ordered += Get-ChildItem '.release_payload/v8.64/rem16_*.b64' | Sort-Object Name
          if ($ordered.Count -ne 35) { throw "Expected 35 payload files, got $($ordered.Count)" }
          $b64 = ($ordered | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $b64 = $b64.Replace('BfIKiiagl44','BfIKiigl44')
          if ($b64.Length -ne 248624) { throw "Unexpected Base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes('Taxo_v8_64_source.tar.xz', [Convert]::FromBase64String($b64))
          $archiveHash = (Get-FileHash 'Taxo_v8_64_source.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:ARCHIVE_SHA256) { throw "Archive SHA-256 mismatch: $archiveHash" }
          New-Item -ItemType Directory -Force -Path '_v864_unpack' | Out-Null
          tar -xJf 'Taxo_v8_64_source.tar.xz' -C '_v864_unpack'
          if ($LASTEXITCODE -ne 0) { throw "tar extraction failed: $LASTEXITCODE" }
          $src = Join-Path $PWD '_v864_unpack/Taxo_v8_64_source'
          if (!(Test-Path (Join-Path $src 'main.py'))) { throw 'Reconstructed source is invalid' }

      - name: Verify reconstructed runtime files
        shell: pwsh
        run: |
          $src = Join-Path $PWD '_v864_unpack/Taxo_v8_64_source'
          $checks = @{
            'main.py' = $env:MAIN_SHA256
            'tachograph.py' = $env:TACHO_SHA256
            'attestation_render.py' = $env:RENDER_SHA256
            'attestation_visual_template.pdf' = $env:VISUAL_TEMPLATE_SHA256
          }
          foreach ($file in $checks.Keys) {
            $full = Join-Path $src $file
            if (!(Test-Path $full)) { throw "Missing reconstructed file: $file" }
            $actual = (Get-FileHash $full -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $checks[$file]) { throw "SHA-256 mismatch for $file : $actual" }
            Write-Host "OK $file $actual"
          }
          if (!(Test-Path (Join-Path $src '.github/workflows/publish-windows-v8.64.yml'))) { throw 'v8.64 publish workflow missing' }

      - name: Publish canonical source to candidate branch
        shell: pwsh
        run: |
          $src = Join-Path $PWD '_v864_unpack/Taxo_v8_64_source'
          robocopy $src $PWD /E /R:2 /W:1 /XF *.docx /XD .git | Out-Host
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed: $LASTEXITCODE" }
          Remove-Item '.github/workflows/release-windows-v8.56.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/bootstrap-v8.64.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.release_payload' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'Taxo_v8_64_source.tar.xz' -Force -ErrorAction SilentlyContinue
          Remove-Item '_v864_unpack' -Recurse -Force -ErrorAction SilentlyContinue
          $template = 'Бланк підтвердження.docx'
          $templateHash = (Get-FileHash $template -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($templateHash -ne $env:TEMPLATE_SHA256) { throw "Final DOCX template mismatch: $templateHash" }
          python -m py_compile main.py tachograph.py attestation_render.py
          if (!(Test-Path '.github/workflows/publish-windows-v8.64.yml')) { throw 'Final publish workflow missing' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish canonical Taxo v8.64 source'
          git push origin HEAD:candidate-v8.64
