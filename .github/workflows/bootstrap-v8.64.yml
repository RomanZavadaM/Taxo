name: Bootstrap and build Taxo v8.64 candidate

on:
  workflow_dispatch:
  push:
    branches:
      - candidate-v8.64
    paths:
      - '.release_payload/v8.64/**'
      - '.github/workflows/bootstrap-v8.64.yml'

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      ARCHIVE_SHA256: 6635bd9e065e836378f455cebe7c97d381d6e1356d0efc038d882660471aba0c
      MAIN_SHA256: 2f23301d651372d06b6a39f0edb03b009b23a61e919c98b2123c855835f8483c
      TACHO_SHA256: 83c916457c6602e9ed93a55fdc0578e91775e073dad12da94ccd31d1e81fa108
      RENDER_SHA256: b65178e0bf18207e75e10ebfb6c2896397e685184228ece70efb7615d4215c88
      TEMPLATE_SHA256: 47aeb545509af8d43102f76de772838b36de1fa85a2d09bae2d2ce7798358ec0
      VISUAL_TEMPLATE_SHA256: 6e5d79bebdeed68c79e49d438d37dbd165e2316fda3233b3442911a9a3b61151

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v8.64 source from protected payload
        shell: pwsh
        run: |
          $base = Get-ChildItem '.release_payload/v8.64/part*.b64' | Sort-Object Name
          $rem  = Get-ChildItem '.release_payload/v8.64/rem*.b64' | Sort-Object Name
          if ($base.Count -ne 13) { throw "Expected 13 base payload files, got $($base.Count)" }
          if ($rem.Count -ne 18) { throw "Expected 18 remainder payload files, got $($rem.Count)" }
          $all = @($base) + @($rem)
          $b64 = ($all | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          if ($b64.Length -ne 248624) { throw "Unexpected Base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes('Taxo_v8_64_source.tar.xz', [Convert]::FromBase64String($b64))
          $archiveHash = (Get-FileHash 'Taxo_v8_64_source.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:ARCHIVE_SHA256) { throw "Archive SHA-256 mismatch: $archiveHash" }
          if (Test-Path '_v864_unpack') { Remove-Item '_v864_unpack' -Recurse -Force }
          New-Item -ItemType Directory -Path '_v864_unpack' | Out-Null
          tar -xJf 'Taxo_v8_64_source.tar.xz' -C '_v864_unpack'
          if ($LASTEXITCODE -ne 0) { throw "tar extraction failed: $LASTEXITCODE" }
          $src = Join-Path $PWD '_v864_unpack/Taxo_v8_64_source'
          if (!(Test-Path (Join-Path $src 'main.py'))) { throw 'Reconstructed source is invalid' }
          robocopy $src $PWD /E /R:2 /W:1 /XD .git .release_payload _v864_unpack | Out-Host
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed: $LASTEXITCODE" }
          Remove-Item 'Taxo_v8_64_source.tar.xz' -Force
          Remove-Item '_v864_unpack' -Recurse -Force

      - name: Verify reconstructed source hashes
        shell: pwsh
        run: |
          $checks = @{
            'main.py' = $env:MAIN_SHA256
            'tachograph.py' = $env:TACHO_SHA256
            'attestation_render.py' = $env:RENDER_SHA256
            'Бланк підтвердження.docx' = $env:TEMPLATE_SHA256
            'attestation_visual_template.pdf' = $env:VISUAL_TEMPLATE_SHA256
          }
          foreach ($file in $checks.Keys) {
            if (!(Test-Path $file)) { throw "Missing required file: $file" }
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $checks[$file]) { throw "SHA-256 mismatch for $file : $actual" }
            Write-Host "OK $file $actual"
          }

      - name: Commit canonical v8.64 source to candidate branch
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/bootstrap-v8.64.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/release-windows-v8.56.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.release_payload' -Recurse -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) {
            Write-Host 'No canonical source changes to commit.'
          } else {
            git commit -m 'Publish canonical Taxo v8.64 source'
            git push origin HEAD:candidate-v8.64
          }

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Compile source
        shell: pwsh
        run: python -m py_compile main.py tachograph.py attestation_render.py

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Build portable application
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean Taxo.spec

      - name: Verify portable bundle
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/Taxo/Taxo.exe')) { throw 'Taxo.exe not found' }
          if (!(Test-Path 'dist/Taxo/_internal/Бланк підтвердження.docx')) { throw 'DOCX template not found in bundle' }
          if (!(Test-Path 'dist/Taxo/_internal/attestation_visual_template.pdf')) { throw 'Visual PDF template not found in bundle' }
          $db = Get-ChildItem 'dist/Taxo' -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/Taxo' -DestinationPath 'Taxo_v8_64_Windows_x64_Portable.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_out | Out-Null
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { throw 'ISCC.exe not found' }
          & $iscc 'installer\Taxo.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (!(Test-Path 'release_out/Taxo_v8_64_Setup_Windows_x64.exe')) { throw 'Installer not found' }

      - name: Create Windows checksums
        shell: pwsh
        run: |
          $files = @(
            'release_out/Taxo_v8_64_Setup_Windows_x64.exe',
            'Taxo_v8_64_Windows_x64_Portable.zip'
          )
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $([IO.Path]::GetFileName($f))"
          }
          $lines | Set-Content -Encoding ascii 'SHA256SUMS_WINDOWS.txt'
          Get-Content 'SHA256SUMS_WINDOWS.txt'

      - name: Upload candidate Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Taxo-v8.64-Windows-candidate
          path: |
            release_out/Taxo_v8_64_Setup_Windows_x64.exe
            Taxo_v8_64_Windows_x64_Portable.zip
            SHA256SUMS_WINDOWS.txt
          if-no-files-found: error
          retention-days: 30
