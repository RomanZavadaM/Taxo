name: Apply Taxo 10.9-r5 activity patch

on:
  push:
    branches:
      - work/v10.9-r5-tachograph-activity-safety
    paths:
      - .github/workflows/apply-v10.9-r5-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.9-r5-tachograph-activity-safety
          fetch-depth: 0
      - name: Patch activity register
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_r5.py
          python /tmp/apply_r5.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add activity_register_60.py main.py VERSION.txt
          git commit -m 'Harden 60-day activity evidence in 10.9-r5'
          git push origin HEAD:work/v10.9-r5-tachograph-activity-safety
