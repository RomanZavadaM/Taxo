name: Apply Taxo 10.9-r5 activity patch

on:
  push:
    branches:
      - work/v10.9-r5-tachograph-activity-safety
    paths:
      - .github/workflows/apply-v10.9-r5-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.9-r5-tachograph-activity-safety
          fetch-depth: 0
      - name: Patch activity register
        shell: bash
        run: python -c "from pathlib import Path; p=Path('activity_register_60.py'); s=p.read_text(encoding='utf-8'); s=s.replace('Taxo v8.70 r11 — 60-day minute-by-minute driver activity register.','Taxo 10.9-r5 — 60-day minute-by-minute driver activity register.',1); s=s.replace('100 if manual else 80','100 if manual else 40',1); old='''        if first is not None:\n            for minute in range(MINUTES_PER_DAY):\n                if cells[minute] is not None:\n                    continue\n                if first <= minute <= last:\n                    cells[minute] = _cell(\n                        \"Перерва\", \"Розраховано з меж активності\", 10,\n                        \"Проміжок між зафіксованими активностями\",\n                    )\n                else:\n                    cells[minute] = _cell(\n                        \"Відпочинок\", \"Розраховано поза межами активності\", 10,\n                        \"Поза першою/останньою зафіксованою активністю дня\",\n                    )\n\n        for minute in range(MINUTES_PER_DAY):\n            if cells[minute] is None:\n                cells[minute] = _cell(\"Невизначено\", \"Немає достатніх даних\", 0)'''; new='''        # Missing minutes are never promoted to legal rest/break merely from position.\n        for minute in range(MINUTES_PER_DAY):\n            if cells[minute] is not None:\n                continue\n            inside = first is not None and first <= minute <= last\n            cells[minute] = _cell(\n                \"Невизначено\", \"Немає достатніх даних\", 0,\n                \"Проміжок між зафіксованими активностями\" if inside\n                else \"Поза зафіксованими активностями; відпочинок не припускається автоматично\",\n            )'''; assert old in s; s=s.replace(old,new,1); s=s.replace('    - uncovered minutes inside an observed work envelope become a calculated break;\\n    - uncovered minutes outside an observed work envelope become calculated rest;\\n','    - uncovered minutes remain undefined even inside/outside an observed envelope;\\n    - only explicit source data may classify rest or a break;\\n',1); p.write_text(s,encoding='utf-8'); q=Path('main.py'); m=q.read_text(encoding='utf-8'); assert 'APP_VERSION = \"10.9-r4\"' in m; q.write_text(m.replace('APP_VERSION = \"10.9-r4\"','APP_VERSION = \"10.9-r5\"',1),encoding='utf-8'); Path('VERSION.txt').write_text('Version: 10.9-r5\\n',encoding='utf-8')"
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add activity_register_60.py main.py VERSION.txt
          git commit -m 'Harden 60-day activity evidence in 10.9-r5'
          git push origin HEAD:work/v10.9-r5-tachograph-activity-safety
