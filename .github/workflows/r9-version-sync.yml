name: One-time sync Taxo r9 version

on:
  push:
    branches:
      - work/v10.4-r9-personnel-registry-military-accounting
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r9-personnel-registry-military-accounting
          fetch-depth: 0
      - name: Sync main APP_VERSION to r9
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          text = p.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.4-r8"'
          new = 'APP_VERSION = "10.4-r9"'
          if new in text:
              print('main.py already r9')
          elif old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit('Expected r8 APP_VERSION marker not found')
          PY
          if git diff --quiet -- main.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "chore(r9): sync main application version"
          git push origin HEAD:work/v10.4-r9-personnel-registry-military-accounting
