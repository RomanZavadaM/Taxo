name: Apply Taxo 10.9-r8 integration

on:
  push:
    branches:
      - work/v10.9-r8-orders-immutability
    paths:
      - '.github/workflows/apply-v10.9-r8-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.9-r8-orders-immutability
      - name: Apply r8 runtime identity and registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = Path('VERSION.txt')
          text = version.read_text(encoding='utf-8')
          if 'Version: 10.9-r7' not in text:
              raise SystemExit('Expected r7 VERSION baseline')
          version.write_text(text.replace('Version: 10.9-r7', 'Version: 10.9-r8', 1), encoding='utf-8')

          main = Path('main.py')
          text = main.read_text(encoding='utf-8')
          if text.count('APP_VERSION = "10.9-r7"') != 1:
              raise SystemExit('Expected exactly one r7 APP_VERSION')
          main.write_text(text.replace('APP_VERSION = "10.9-r7"', 'APP_VERSION = "10.9-r8"', 1), encoding='utf-8')

          feature = Path('feature_layers.py')
          text = feature.read_text(encoding='utf-8')
          import_marker = 'from v1097_stoir_odometer import install as install_v1097_stoir_odometer\n'
          layer_marker = '    FeatureLayer("v1097-stoir-odometer", install_v1097_stoir_odometer, domain="maintenance"),\n'
          if 'install_v1098_orders_immutability' not in text:
              if text.count(import_marker) != 1 or text.count(layer_marker) != 1:
                  raise SystemExit('Unable to locate r7 feature registry anchors')
              text = text.replace(import_marker, import_marker + 'from v1098_orders_immutability import install as install_v1098_orders_immutability\n', 1)
              text = text.replace(layer_marker, layer_marker + '    FeatureLayer("v1098-orders-immutability", install_v1098_orders_immutability, domain="operations"),\n', 1)
              feature.write_text(text, encoding='utf-8')

          start = Path('START.bat')
          data = start.read_bytes()
          guard = b'if not exist "v1097_stoir_odometer.py" goto :package_incomplete\r\n'
          addition = guard + b'if not exist "v1098_orders_immutability.py" goto :package_incomplete\r\n'
          if b'v1098_orders_immutability.py' not in data:
              if data.count(guard) != 1:
                  raise SystemExit('Unable to locate r7 START guard with CRLF')
              start.write_bytes(data.replace(guard, addition, 1))
          PY
          grep -Fxq 'Version: 10.9-r8' VERSION.txt
          grep -Fxq 'APP_VERSION = "10.9-r8"' main.py
          grep -Fq 'v1098-orders-immutability' feature_layers.py
          grep -Fq 'v1098_orders_immutability.py' START.bat
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Taxo CI'
          git config user.email 'actions@users.noreply.github.com'
          git add VERSION.txt main.py feature_layers.py START.bat
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate 10.9-r8 immutable orders safety'
          git push origin HEAD:work/v10.9-r8-orders-immutability
