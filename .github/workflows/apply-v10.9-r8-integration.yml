name: Sync Taxo 10.9-r8 canonical state

on:
  push:
    branches:
      - work/v10.9-r8-orders-immutability
    paths:
      - '.github/workflows/apply-v10.9-r8-integration.yml'

permissions:
  contents: write

jobs:
  sync-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.9-r8-orders-immutability
      - name: Sync PROJECT_STATE through issued r7 and active r8
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('PROJECT_STATE.md')
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'- \*\*Latest issued fast-test:\*\*.*',
              '- **Latest issued fast-test:** **10.9-r7 / `v10.9-r7`** → `88fcfb20e8632178b095a99ef9b09c86701a072e` — immutable.',
              text,
              count=1,
          )
          text = re.sub(
              r'- \*\*10\.9-r6 START:\*\*.*',
              '- **10.9-r7 START:** `Taxo_v10_9_candidate_r7_START.zip`, SHA-256 `8d35d2e8af76af1a90e9a6600b5d637d80fb80a28cb4d2331e85f9a336e88222`.',
              text,
              count=1,
          )
          text = re.sub(
              r'- \*\*10\.9-r6 exact-source regression:\*\*.*',
              '- **10.9-r7 exact-source regression:** **769/769 OK**; publisher `36916515063`, source `36916227610`, Windows `36916259871`, macOS `36916259785` — success.',
              text,
              count=1,
          )
          text = re.sub(
              r'- \*\*Active development:\*\*.*',
              '- **Active development:** **10.9-r8 — накази / незмінність і закріплення**.',
              text,
              count=1,
          )
          text = re.sub(
              r'- \*\*Active branch:\*\*.*',
              '- **Active branch:** `work/v10.9-r8-orders-immutability`, based on frozen r7 source; unmerged.',
              text,
              count=1,
          )
          text = text.replace('`v10.9-r2` … `v10.9-r6` є виданими stacked fast-test ревізіями', '`v10.9-r2` … `v10.9-r7` є виданими stacked fast-test ревізіями')
          text = text.replace('## Issued stacked fast-test line 10.9-r2 … r6', '## Issued stacked fast-test line 10.9-r2 … r7')
          r6_bullet = '- `v10.9-r6` — персонал/баланс/П-5: вихідний не зменшує норму як неявка, історичний employment-aware mapping, тести 2/2 і 3/3.\n'
          if '- `v10.9-r7` —' not in text:
              text = text.replace(r6_bullet, r6_bullet + '- `v10.9-r7` — СТОІР: надійна хронологія одометра, fallback `work_date`, newest-fact forecast anchor і outlier guard.\n')
          replacement = '''## Active slice — 10.9-r8

Мета r8: зробити юридично/операційно значущі накази незмінними після затвердження/підпису та прибрати неоднозначність закріплень водія за ТЗ.

- approved/signed наказ не редагується як чернетка;
- cancelled наказ не можна повторно затвердити;
- непереданий `control_employee_id` не очищає відповідального;
- assignments під approved/signed наказом незмінні;
- конфліктні одночасні закріплення одного водія за різними ТЗ блокують approval;
- одне однозначне попереднє закріплення завершується новим наказом окремим фактом, без переписування старого наказу;
- runtime layer: `v1098_orders_immutability.py`;
- behavioral tests: `tests/test_v10_9_r8.py`;
- audit: `docs/maintenance/AUDIT_OPERATIONS_ORDERS_v10.9-r8.md`.
'''
          text, count = re.subn(r'## Active slice — 10\.9-r7\n.*?(?=\n## )', replacement.rstrip() + '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Unable to replace active r7 slice in PROJECT_STATE.md')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit state sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Taxo CI'
          git config user.email 'actions@users.noreply.github.com'
          git add PROJECT_STATE.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: sync state through issued r7 and active r8'
          git push origin HEAD:work/v10.9-r8-orders-immutability
