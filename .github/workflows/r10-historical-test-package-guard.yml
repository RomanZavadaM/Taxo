name: One-time r10 historical test and package guard

on:
  push:
    branches:
      - work/v10.4-r10-military-transport-vehicles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r10-military-transport-vehicles
          fetch-depth: 0
      - name: Make r9 guards historical and require r10 runtime in START
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('tests/test_v10_4_r9.py')
          text = test.read_text(encoding='utf-8')
          old = '''    def test_version_metadata_is_r9(self):
        version = (ROOT / "VERSION.txt").read_text("utf-8")
        self.assertIn("Version: 10.4-r9", version)
        self.assertIn("Порядок №1487, редакція 27.06.2026", version)

    def test_feature_layer_is_installed_after_r8(self):
        entry = (ROOT / "taxo_app.py").read_text("utf-8")
        self.assertIn("from v1049_features import install as install_v1049", entry)
        self.assertIn("from military_accounting_ui import install as install_military_accounting_ui", entry)
        self.assertIn("App = install_military_accounting_ui(", entry)
        ui = (ROOT / "v1049_features.py").read_text("utf-8")
        self.assertIn('APP_VERSION = "10.4-r9"', ui)
        self.assertIn("квартальна звірка — політика Taxo", ui)
'''
          new = '''    def test_r9_historical_metadata_remains_immutable(self):
        notes = (ROOT / "docs/releases/RELEASE_NOTES_v10_4_r9.md").read_text("utf-8")
        self.assertIn("Taxo 10.4-r9", notes)
        self.assertIn("Порядок №1487, редакція 27.06.2026", notes)
        ui = (ROOT / "v1049_features.py").read_text("utf-8")
        self.assertIn('APP_VERSION = "10.4-r9"', ui)

    def test_r9_feature_layer_remains_in_install_chain_after_later_revisions(self):
        entry = (ROOT / "taxo_app.py").read_text("utf-8")
        self.assertIn("from v1049_features import install as install_v1049", entry)
        self.assertIn("from military_accounting_ui import install as install_military_accounting_ui", entry)
        self.assertIn("install_military_accounting_ui(", entry)
        self.assertIn("install_v1049(", entry)
        ui = (ROOT / "v1049_features.py").read_text("utf-8")
        self.assertIn('APP_VERSION = "10.4-r9"', ui)
        self.assertIn("квартальна звірка — політика Taxo", ui)
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected r9 integration guard block not found')
              test.write_text(text.replace(old, new, 1), encoding='utf-8')

          wf = Path('.github/workflows/source-test-archive.yml')
          wtext = wf.read_text(encoding='utf-8')
          anchor = '''            personnel_v91.py
            work_regime.py
'''
          replacement = '''            personnel_v91.py
            military_accounting_2026.py
            military_accounting_ui.py
            military_transport_2026.py
            military_transport_ui.py
            v1049_features.py
            v10410_features.py
            work_regime.py
'''
          if replacement not in wtext:
              if anchor not in wtext:
                  raise SystemExit('START required-files anchor not found')
              wf.write_text(wtext.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v10_4_r9.py .github/workflows/source-test-archive.yml
          git commit -m "test(r10): preserve r9 history and guard r10 START runtime"
          git push origin HEAD:work/v10.4-r10-military-transport-vehicles
