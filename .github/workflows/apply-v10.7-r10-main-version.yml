name: Apply Taxo 10.7-r10 main identity once

on:
  push:
    branches:
      - 'work/v10.7-r10-document-center'
    paths:
      - '.github/workflows/apply-v10.7-r10-main-version.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact current version and remove one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.7-r9"'
          new = 'APP_VERSION = "10.7-r10"'
          if old not in text:
              if new not in text:
                  raise SystemExit('Expected current APP_VERSION marker not found')
          else:
              if text.count(old) != 1:
                  raise SystemExit('APP_VERSION marker is not unique')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/apply-v10.7-r10-main-version.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'chore: set main identity to 10.7-r10'
          git push origin HEAD:work/v10.7-r10-document-center
