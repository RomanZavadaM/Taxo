name: One-time patch Taxo 10.6-r2 core version

on:
  push:
    branches:
      - work/v10.6-r2-waybill-nonregular-ui
    paths:
      - '.github/workflows/patch-v10.6-r2-main-version.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.6-r2-waybill-nonregular-ui
          fetch-depth: 0
      - name: Patch exact core version marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('main.py')
          text=p.read_text(encoding='utf-8')
          old='APP_VERSION = "10.6-r1"'
          new='APP_VERSION = "10.6-r2"'
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old APP_VERSION marker, got {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit exact change
        run: |
          if git diff --quiet -- main.py; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.py
          git commit -m 'chore: sync core APP_VERSION to 10.6-r2'
          git push origin HEAD:work/v10.6-r2-waybill-nonregular-ui
