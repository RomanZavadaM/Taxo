name: Backfill Taxo 10.9-r9 full multi-platform assets

on:
  push:
    branches:
      - 'docs/v10.9-r9-public-state-sync'
    paths:
      - '.github/workflows/backfill-v10.9-r9-full-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-v10.9-r9-full-assets
  cancel-in-progress: false

env:
  RELEASE_TAG: v10.9-r9
  VERSION_LABEL: 10.9-r9
  STEM: Taxo_v10_9_candidate_r9

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable r9 source
        uses: actions/checkout@v4
        with:
          ref: v10.9-r9
          fetch-depth: 0
      - name: Verify exact r9 identity
        shell: bash
        run: |
          grep -Fxq 'Version: 10.9-r9' VERSION.txt
          grep -Fq 'APP_VERSION = "10.9-r9"' main.py
          test "$(git rev-parse HEAD)" = 'a368bf3bdfd4a16cc099844b830379c5e2646c2d'

  build-windows:
    needs: verify-source
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable r9 source
        uses: actions/checkout@v4
        with:
          ref: v10.9-r9
      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2
      - name: Build modern Windows portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean Taxo.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed: $LASTEXITCODE" }
          Move-Item 'dist/Taxo' "dist/${env:STEM}_Windows_x64"
          if (!(Test-Path "dist/${env:STEM}_Windows_x64/Taxo.exe")) { throw 'Taxo.exe missing' }
          $db = Get-ChildItem "dist/${env:STEM}_Windows_x64" -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }
          Compress-Archive -Path "dist/${env:STEM}_Windows_x64" -DestinationPath "${env:STEM}_Windows_x64_Portable.zip" -Force
      - name: Build modern Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_out | Out-Null
          $iss = @"
          #define MyAppName "Taxo"
          #define MyAppVersion "10.9-r9"
          #define MyAppPublisher "Roman Zavada"
          #define MyAppExeName "Taxo.exe"
          [Setup]
          AppId={{5D5D4FC7-9FE8-4B24-94EE-7B0F1EDB8560}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Taxo
          DefaultGroupName=Taxo
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=release_out
          OutputBaseFilename=Taxo_v10_9_candidate_r9_Setup_Windows_x64
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\Taxo.exe
          VersionInfoCopyright=Copyright (C) 2026 Roman Zavada. All rights reserved.
          [Languages]
          Name: "ukrainian"; MessagesFile: "compiler:Languages\Ukrainian.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          [Files]
          Source: "dist\Taxo_v10_9_candidate_r9_Windows_x64\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\Taxo"; Filename: "{app}\Taxo.exe"
          "@
          Set-Content -Path 'Taxo_v10_9_r9.iss' -Value $iss -Encoding UTF8
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc 'Taxo_v10_9_r9.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (!(Test-Path "release_out/${env:STEM}_Setup_Windows_x64.exe")) { throw 'Installer missing' }
      - name: Checksums and publish modern Windows assets
        shell: pwsh
        run: |
          $files = @("${env:STEM}_Windows_x64_Portable.zip", "release_out/${env:STEM}_Setup_Windows_x64.exe")
          $lines = foreach ($f in $files) { "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($f))" }
          $lines | Set-Content -Encoding ascii 'SHA256SUMS_v10_9_r9_Windows_x64.txt'
          gh release upload $env:RELEASE_TAG "${env:STEM}_Windows_x64_Portable.zip" "release_out/${env:STEM}_Setup_Windows_x64.exe" 'SHA256SUMS_v10_9_r9_Windows_x64.txt' --clobber

  build-win7:
    needs: verify-source
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable r9 source
        uses: actions/checkout@v4
        with:
          ref: v10.9-r9
      - name: Set up CPython 3.8.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x64'
      - name: Install Win7 compatibility dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install -r requirements-win7.txt
          python -m pip install pyinstaller==5.13.2 pefile==2023.2.7
      - name: Build Windows 7 portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean Taxo_win7.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller Win7 failed: $LASTEXITCODE" }
          Move-Item 'dist/Taxo' "dist/${env:STEM}_Windows7_x64"
          if (!(Test-Path "dist/${env:STEM}_Windows7_x64/Taxo.exe")) { throw 'Taxo.exe missing' }
          if (!(Get-ChildItem "dist/${env:STEM}_Windows7_x64" -Recurse -Filter python38.dll | Select-Object -First 1)) { throw 'python38.dll missing' }
          $env:TAXO_WIN7_BUNDLE = (Resolve-Path "dist/${env:STEM}_Windows7_x64").Path
          python scripts/check_win7_pe.py
          if ($LASTEXITCODE -ne 0) { throw "Win7 PE compatibility check failed: $LASTEXITCODE" }
          $db = Get-ChildItem "dist/${env:STEM}_Windows7_x64" -Recurse -File -Include *.db,*.sqlite,*.sqlite3
          if ($db) { throw "Database unexpectedly bundled: $($db.FullName -join ', ')" }
          Compress-Archive -Path "dist/${env:STEM}_Windows7_x64" -DestinationPath "${env:STEM}_Windows7_x64_Portable.zip" -Force
      - name: Build Windows 7 installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_out | Out-Null
          $iss = @"
          #define MyAppName "Taxo"
          #define MyAppVersion "10.9-r9"
          #define MyAppPublisher "Roman Zavada"
          [Setup]
          AppId={{5D5D4FC7-9FE8-4B24-94EE-7B0F1EDB8560}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion} Windows 7 SP1
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Taxo
          DefaultGroupName=Taxo
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=release_out
          OutputBaseFilename=Taxo_v10_9_candidate_r9_Setup_Windows7_x64
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\Taxo.exe
          VersionInfoCopyright=Copyright (C) 2026 Roman Zavada. All rights reserved.
          [Languages]
          Name: "ukrainian"; MessagesFile: "compiler:Languages\Ukrainian.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          [Files]
          Source: "dist\Taxo_v10_9_candidate_r9_Windows7_x64\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\Taxo"; Filename: "{app}\Taxo.exe"
          "@
          Set-Content -Path 'Taxo_v10_9_r9_win7.iss' -Value $iss -Encoding UTF8
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc 'Taxo_v10_9_r9_win7.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup Win7 failed: $LASTEXITCODE" }
      - name: Checksums and publish Windows 7 assets
        shell: pwsh
        run: |
          $files = @("${env:STEM}_Windows7_x64_Portable.zip", "release_out/${env:STEM}_Setup_Windows7_x64.exe")
          $lines = foreach ($f in $files) { "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($f))" }
          $lines | Set-Content -Encoding ascii 'SHA256SUMS_v10_9_r9_Windows7_x64.txt'
          gh release upload $env:RELEASE_TAG "${env:STEM}_Windows7_x64_Portable.zip" "release_out/${env:STEM}_Setup_Windows7_x64.exe" 'SHA256SUMS_v10_9_r9_Windows7_x64.txt' --clobber

  build-macos:
    needs: verify-source
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable r9 source
        uses: actions/checkout@v4
        with:
          ref: v10.9-r9
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify native architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build-macos.txt
      - name: Patch packaging metadata only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Taxo_macos.spec')
          s = p.read_text(encoding='utf-8')
          s = s.replace("datas=[('Бланк підтвердження.docx', '.'), ('attestation_visual_template.pdf', '.')],", "datas=[('Бланк підтвердження.docx', '.'), ('attestation_visual_template.pdf', '.'), ('LICENSE.md', '.'), ('COPYRIGHT.md', '.'), ('THIRD_PARTY_NOTICES.md', '.')],")
          s = s.replace("version='10.3'", "version='10.9.9'")
          s = s.replace("'CFBundleShortVersionString': '10.3'", "'CFBundleShortVersionString': '10.9.9'")
          s = s.replace("'CFBundleVersion': '10.3'", "'CFBundleVersion': '10909'")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build native macOS app
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean Taxo_macos.spec
          test -x 'dist/Taxo.app/Contents/MacOS/Taxo'
          for f in LICENSE.md COPYRIGHT.md THIRD_PARTY_NOTICES.md; do find 'dist/Taxo.app' -name "$f" -print -quit | grep -q . || { echo "Missing $f" >&2; exit 1; }; done
          if find 'dist/Taxo.app' -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit | grep -q .; then echo 'Database unexpectedly bundled' >&2; exit 1; fi
          file 'dist/Taxo.app/Contents/MacOS/Taxo' | grep -q "${{ matrix.arch }}"
          codesign --verify --deep --strict 'dist/Taxo.app'
      - name: Package, checksum and publish macOS asset
        shell: bash
        run: |
          bundle_dir="${STEM}_macOS_${{ matrix.arch }}"
          zip_name="${bundle_dir}_Portable.zip"
          mkdir "$bundle_dir"
          mv 'dist/Taxo.app' "$bundle_dir/Taxo.app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$bundle_dir" "$zip_name"
          shasum -a 256 "$zip_name" > "SHA256SUMS_v10_9_r9_macOS_${{ matrix.arch }}.txt"
          gh release upload "$RELEASE_TAG" "$zip_name" "SHA256SUMS_v10_9_r9_macOS_${{ matrix.arch }}.txt" --clobber

  verify-release-assets:
    needs: [build-windows, build-win7, build-macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify complete release asset set
        shell: bash
        run: |
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for required in \
            Taxo_v10_9_candidate_r9_START.zip \
            Taxo_v10_9_candidate_r9_Windows_x64_Portable.zip \
            Taxo_v10_9_candidate_r9_Setup_Windows_x64.exe \
            Taxo_v10_9_candidate_r9_Windows7_x64_Portable.zip \
            Taxo_v10_9_candidate_r9_Setup_Windows7_x64.exe \
            Taxo_v10_9_candidate_r9_macOS_arm64_Portable.zip \
            Taxo_v10_9_candidate_r9_macOS_x86_64_Portable.zip \
            SHA256SUMS_v10_9_r9.txt \
            SHA256SUMS_v10_9_r9_Windows_x64.txt \
            SHA256SUMS_v10_9_r9_Windows7_x64.txt \
            SHA256SUMS_v10_9_r9_macOS_arm64.txt \
            SHA256SUMS_v10_9_r9_macOS_x86_64.txt; do
            echo "$assets" | grep -Fxq "$required" || { echo "Missing release asset: $required" >&2; exit 1; }
          done
          echo 'Taxo 10.9-r9 full multi-platform asset set is complete.'
