name: Diagnose Taxo v8.66 r10 exact apply

on:
  push:
    branches:
      - work/v8.66-ui-polish-r10
    paths:
      - .github/workflows/diag-r10-exact.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v8.66-ui-polish-r10
          fetch-depth: 0
      - name: Apply and print verification values
        shell: bash
        run: |
          cat .r10_exact/main*.diff > /tmp/main.diff
          cat .r10_exact/tacho*.diff > /tmp/tacho.diff
          git apply --check /tmp/main.diff
          git apply /tmp/main.diff
          git apply --check /tmp/tacho.diff
          git apply /tmp/tacho.diff
          echo "MAIN_BLOB=$(git hash-object main.py)"
          echo "TACHO_BLOB=$(git hash-object tachograph.py)"
          python -m py_compile main.py tachograph.py attestation_render.py && echo PY_COMPILE=PASS
          grep -q 'text="Застосувати маршрут"' main.py && echo APPLY_ROUTE_MARKER=PASS || echo APPLY_ROUTE_MARKER=FAIL
          grep -q 'for tab_index in range(8)' main.py && echo TAB8_MARKER=PASS || echo TAB8_MARKER=FAIL
          grep -q 'make_scrollable_page("Перегляд")' tachograph.py && echo PREVIEW_TAB_MARKER=PASS || echo PREVIEW_TAB_MARKER=FAIL
          grep -q 'make_scrollable_page("Результати")' tachograph.py && echo RESULTS_TAB_MARKER=PASS || echo RESULTS_TAB_MARKER=FAIL
