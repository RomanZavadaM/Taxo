name: One-shot Taxo 10.4-r4 version sync

on:
  push:
    branches:
      - work/v10.4-r4-waybill-boundary-times
    paths:
      - .github/workflows/one-shot-r4-version-sync.yml

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r4-waybill-boundary-times
          fetch-depth: 0
      - name: Sync main APP_VERSION and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('main.py')
          text=p.read_text(encoding='utf-8')
          old='APP_VERSION = "10.4-r3"'
          new='APP_VERSION = "10.4-r4"'
          if old not in text:
              raise SystemExit('Expected 10.4-r3 marker not found in main.py')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/one-shot-r4-version-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py .github/workflows/one-shot-r4-version-sync.yml
          git commit -m "chore: sync Taxo 10.4-r4 runtime identity"
          git push origin HEAD:work/v10.4-r4-waybill-boundary-times
