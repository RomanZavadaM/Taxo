name: Finalize Taxo v8.66 r10 docs

on:
  push:
    branches:
      - work/v8.66-ui-polish-r10
    paths:
      - .github/workflows/finalize-r10-docs.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v8.66-ui-polish-r10
          fetch-depth: 0
      - name: Update README and release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('# Taxo — v8.66 candidate r8','# Taxo — v8.66 candidate r10',1)
          s=s.replace(
              '- У r7 copy/paste для полів переведено на прямий системний clipboard, додано Alt+1…Alt+9 для швидкого переходу між розділами, прокрутку Canvas колесом миші та кнопку приховування каталогу ТАХО.',
              '- У r7 copy/paste для полів переведено на прямий системний clipboard, додано швидку навігацію Alt+цифра, прокрутку Canvas колесом миші та кнопку приховування каталогу ТАХО.',
              1
          )
          old='- Алгоритм розпізнавання тахокарт у v8.66 r8 **не змінювався**.'
          new='''- У r9 прибрано окрему сутність `Шаблони маршрутів`: лишився один розділ `Маршрути`, де кожен маршрут містить власний точний часовий сценарій, автомобіль за замовчуванням, тип зміни та примітки. Старі шаблони переносяться автоматично, legacy-таблиці не видаляються.\n- У табелі маршрут вибирається як `номер / назва` і застосовується однією кнопкою; окремого вибору шаблону більше немає.\n- У r9 верхній інтерфейс має 8 основних вкладок замість 9, а місячний графік та кнопки вибору дати перевірені на вузьких вікнах.\n- У r10 робочу область ТАХО розділено на дві підвкладки `Перегляд` / `Результати`, кожна має власну вертикальну прокрутку; скан і таблиця інтервалів зберігають власні X/Y scrollbar. Старий вертикальний sash між сканом і результатами прибрано.\n- У r10 також збережено актуальну r8-логіку місячного графіка та перевипуску PDF після `Оновити`.\n- Алгоритм розпізнавання тахокарт у v8.66 r10 **не змінювався**.'''
          if old not in s:
              raise SystemExit('README r8 recognition marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('RELEASE_NOTES_v8_66.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('# Taxo v8.66 candidate r8 — практичний інтерфейс','# Taxo v8.66 candidate r10 — практичний інтерфейс',1)
          s=s.replace('Дата кандидата: 13.09.2026','Дата кандидата: 14.09.2026',1)
          s=s.replace('Подвійний клік або Enter відкриває редагування водія, автомобіля, маршруту та шаблону.','Подвійний клік або Enter відкриває редагування водія, автомобіля та маршруту.',1)
          if '## Об’єднання маршрутів — r9' not in s:
              s=s.rstrip()+'''\n\n## Об’єднання маршрутів — r9\n\n- Окрему вкладку `Шаблони маршрутів` прибрано. Користувацька модель тепер має один довідник `Маршрути`.\n- Один маршрут означає один точний часовий сценарій: `номер / назва`, автомобіль за замовчуванням, тип зміни, робочі інтервали, інтервали керування, опис і примітка.\n- Додано `route_segments`; старі `route_templates` та `route_template_segments` автоматично копіюються у нову модель один раз і залишаються в БД як legacy-страховка. Дані не треба вводити повторно.\n- Якщо в старій БД до одного маршруту було прив’язано кілька шаблонів, жоден не губиться: перший наповнює вихідний маршрут, додаткові сценарії переносяться як окремі маршрути.\n- У табелі вилучено окремий комбобокс шаблону. Користувач вибирає маршрут як `номер / назва` і натискає `Застосувати маршрут`; після підстановки конкретний день можна редагувати вручну.\n- Основних вкладок стало 8. Старий індекс останньої відкритої вкладки автоматично переноситься; Alt+1…Alt+8 відповідають новій схемі.\n- Кнопки `Дата…` стиснено до безпечної ширини: горизонтальний UI-аудит дає 0 обрізаних кнопок на 900×600 по всіх 8 вкладках.\n- Алгоритм розпізнавання тахокарт не змінювався.\n'''
          if '## Дві робочі підвкладки ТАХО — r10' not in s:
              s=s.rstrip()+'''\n\n## Дві робочі підвкладки ТАХО — r10\n\n- Праву робочу область `Тахограф — шайби` розділено на `Перегляд` і `Результати`.\n- Обидві підвкладки мають незалежну вертикальну прокрутку, тому нижні елементи керування залишаються досяжними на невисоких екранах.\n- `Перегляд` містить дані шайби, 24-годинну шкалу та скан; режим 100% зберігає власні горизонтальну і вертикальну прокрутки.\n- `Результати` містить редагування інтервалів, підсумкову статистику, протоколи контролю та таблицю з власними X/Y scrollbar.\n- Старий вертикальний `PanedWindow`, у якому великий скан міг витиснути результати нижче межі вікна, вилучено.\n- Додано швидкі переходи `До результатів →` та `← До перегляду`.\n- Перевірено 900×600, 1024×700, 1200×760 та 1400×780.\n- Канонічний r10 базується на актуальному GitHub r8 і зберігає новішу логіку місячного графіка/PDF.\n- Алгоритм розпізнавання тахокарт не змінювався.\n'''
          p.write_text(s,encoding='utf-8')

          assert '# Taxo — v8.66 candidate r10' in Path('README.md').read_text(encoding='utf-8')
          rel=Path('RELEASE_NOTES_v8_66.md').read_text(encoding='utf-8')
          assert rel.count('## Дві робочі підвкладки ТАХО — r10') == 1
          assert '## Об’єднання маршрутів — r9' in rel
          PY
      - name: Commit docs and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-r10-docs.yml
          git add README.md RELEASE_NOTES_v8_66.md
          git commit -m "Finalize Taxo v8.66 r10 documentation"
          git push origin HEAD:work/v8.66-ui-polish-r10
