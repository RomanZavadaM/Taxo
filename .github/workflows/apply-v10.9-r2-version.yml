name: Apply Taxo 10.9-r2 identity sync

on:
  push:
    branches:
      - work/v10.9-r2-waybill-integrity
    paths:
      - .github/workflows/apply-v10.9-r2-version.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch immutable candidate identity
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.9-r1"'
          new = 'APP_VERSION = "10.9-r2"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/apply-v10.9-r2-version.yml
      - name: Commit one-shot patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.py .github/workflows/apply-v10.9-r2-version.yml
          git commit -m "Sync Taxo 10.9-r2 runtime identity"
          git push origin HEAD:work/v10.9-r2-waybill-integrity
