name: Apply Taxo 10.5-r8 Win7 tabId compatibility fix

on:
  push:
    branches:
      - 'work/v10.5-r8-win7-tabid-compat'
    paths:
      - '.github/workflows/apply-v10.5-r8-win7-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow r8 compatibility patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # r5 compatibility classifier: Python 3.8/openpyxl omits the class name
          # and reports only "__init__() got an unexpected keyword argument 'tabId'".
          path = Path('v1055_features.py')
          text = read(path)
          old = 'return isinstance(exc, TypeError) and "ChildSheet" in text and "tabId" in text'
          new = 'return isinstance(exc, TypeError) and "unexpected keyword argument" in text and "tabId" in text'
          if old not in text:
              raise SystemExit('v1055 classifier anchor not found')
          write(path, text.replace(old, new, 1))

          # Historical r5 fixture must accept both openpyxl error renderings.
          path = Path('tests/test_v10_5_r5.py')
          text = read(path)
          old = '            self.assertIn("ChildSheet", str(cm.exception))\n            self.assertIn("tabId", str(cm.exception))'
          new = '            self.assertIn("unexpected keyword argument", str(cm.exception))\n            self.assertIn("tabId", str(cm.exception))'
          if old not in text:
              raise SystemExit('r5 fixture assertion anchor not found')
          old2 = '''        self.assertTrue(v1055_features._is_childsheet_tabid_error(\n            TypeError("ChildSheet.__init__() got an unexpected keyword argument 'tabId'")\n        ))'''
          new2 = '''        self.assertTrue(v1055_features._is_childsheet_tabid_error(\n            TypeError("ChildSheet.__init__() got an unexpected keyword argument 'tabId'")\n        ))\n        self.assertTrue(v1055_features._is_childsheet_tabid_error(\n            TypeError("__init__() got an unexpected keyword argument 'tabId'")\n        ))'''
          if old2 not in text:
              raise SystemExit('r5 classifier test anchor not found')
          write(path, text.replace(old, new, 1).replace(old2, new2, 1))

          # New revision layer: packaging blocker fix only, no business-model change.
          write('v1058_features.py', '''# -*- coding: utf-8 -*-\n"""Taxo 10.5-r8 — Windows 7 / openpyxl tabId compatibility checkpoint.\n\nThe functional compatibility patch lives in the existing registry parser layer;\nthis outer layer advances the issued application identity without changing r7\nbusiness workflows.\n"""\nfrom __future__ import annotations\n\nAPP_VERSION = "10.5-r8"\n\n\ndef install(core, base_app):\n    if getattr(core, "_TAXO_1058_INSTALLED", False):\n        return core.App\n    core.APP_VERSION = APP_VERSION\n\n    class Taxo1058App(base_app):\n        def __init__(self, *args, **kwargs):\n            super().__init__(*args, **kwargs)\n            core.APP_VERSION = APP_VERSION\n            self.title("Taxo %s — Працівники, графіки та шляхівки" % core.APP_VERSION)\n\n    Taxo1058App.__name__ = "App"\n    Taxo1058App.__qualname__ = "App"\n    core._TAXO_1058_INSTALLED = True\n    core.App = Taxo1058App\n    return Taxo1058App\n''')

          # Wrap the existing r7 entrypoint with r8.
          path = Path('taxo_app.py')
          text = read(path)
          import_anchor = 'from v1057_features import install as install_v1057\n'
          if import_anchor not in text:
              raise SystemExit('taxo_app r7 import anchor not found')
          text = text.replace(import_anchor, import_anchor + 'from v1058_features import install as install_v1058\n', 1)
          start = text.index('App = install_v1057(')
          end = text.index('\n\n\ndef run():', start)
          old_block = text[start:end]
          inner = old_block[len('App = '):]
          indented = '\n'.join(('    ' + line if line else line) for line in inner.splitlines())
          new_block = 'App = install_v1058(\n    core,\n' + indented + '\n)'
          text = text[:start] + new_block + text[end:]
          write(path, text)

          # Current version identity.
          path = Path('main.py')
          text = read(path)
          if 'APP_VERSION = "10.5-r7"' not in text:
              raise SystemExit('main version anchor not found')
          write(path, text.replace('APP_VERSION = "10.5-r7"', 'APP_VERSION = "10.5-r8"', 1))

          write('VERSION.txt', '''Taxo / Driver Worktime\nVersion: 10.5-r8\nRelease date: 2026-09-28\nRelease type: candidate\nStable baseline: Taxo 10.3\nStable tag: v10.3\nStable target: 7d2044d2cad00acdd7d6fccdad2ffc037dc2bf60\n\nTaxo 10.5-r8 — сумісність Windows 7 / Python 3.8 з XLSX реєстру «Шлях».\n\nОсновне:\n- r7 залишається виданою immutable ревізією; її код і тег не переписуються;\n- повний checkpoint r7 виявив відмінність тексту TypeError у Python 3.8/openpyxl для атрибута tabId;\n- r8 розпізнає обидва фактичні варіанти помилки «unexpected keyword argument tabId» і виконує той самий безпечний in-memory retry;\n- вихідний XLSX користувача не змінюється;\n- сторонні TypeError не маскуються;\n- бізнес-логіка r7 не змінюється.\n\nНумерація:\n- 10.5-r1..r7 вже видані та immutable;\n- поточний кодовий крок — 10.5-r8;\n- після видачі 10.5-r8 наступний кодовий крок — 10.5-r9.\n''')

          # START/source package guard must include the outermost runtime.
          path = Path('.github/workflows/source-test-archive.yml')
          text = read(path)
          anchor = '            v1057_features.py\n'
          if anchor not in text:
              raise SystemExit('source package r7 guard anchor not found')
          write(path, text.replace(anchor, anchor + '            v1058_features.py\n', 1))

          write('tests/test_v10_5_r8.py', '''# -*- coding: utf-8 -*-\nimport re\nimport unittest\nfrom pathlib import Path\n\nimport v1055_features\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass Win7TabIdCompatibilityR8Tests(unittest.TestCase):\n    def test_python38_openpyxl_signature_is_recognized(self):\n        self.assertTrue(v1055_features._is_childsheet_tabid_error(\n            TypeError("__init__() got an unexpected keyword argument 'tabId'")\n        ))\n\n    def test_verbose_childsheet_signature_remains_recognized(self):\n        self.assertTrue(v1055_features._is_childsheet_tabid_error(\n            TypeError("ChildSheet.__init__() got an unexpected keyword argument 'tabId'")\n        ))\n\n    def test_unrelated_typeerrors_are_not_swallowed(self):\n        self.assertFalse(v1055_features._is_childsheet_tabid_error(TypeError("other failure")))\n        self.assertFalse(v1055_features._is_childsheet_tabid_error(\n            TypeError("__init__() got an unexpected keyword argument 'tabIndex'")\n        ))\n        self.assertFalse(v1055_features._is_childsheet_tabid_error(ValueError("tabId")))\n\n\nclass R8IntegrationTests(unittest.TestCase):\n    def test_candidate_identity_is_r8_or_later(self):\n        version = (ROOT / "VERSION.txt").read_text(encoding="utf-8")\n        match = re.search(r"Version:\\s+(\\d+)\\.(\\d+)-r(\\d+)", version)\n        self.assertIsNotNone(match)\n        self.assertGreaterEqual(tuple(map(int, match.groups())), (10, 5, 8))\n        main = (ROOT / "main.py").read_text(encoding="utf-8")\n        self.assertIn('APP_VERSION = "10.5-r8"', main)\n\n    def test_r8_is_outermost_entrypoint_and_r7_remains_in_chain(self):\n        entry = (ROOT / "taxo_app.py").read_text(encoding="utf-8")\n        self.assertIn("from v1058_features import install as install_v1058", entry)\n        self.assertIn("App = install_v1058(", entry)\n        self.assertIn("install_v1057(", entry)\n\n    def test_source_package_requires_r8_runtime(self):\n        workflow = (ROOT / ".github/workflows/source-test-archive.yml").read_text(encoding="utf-8")\n        self.assertIn("v1058_features.py", workflow)\n\n    def test_r8_is_compatibility_only_checkpoint(self):\n        source = (ROOT / "v1058_features.py").read_text(encoding="utf-8")\n        self.assertIn("Windows 7 / openpyxl tabId compatibility checkpoint", source)\n        self.assertIn('APP_VERSION = "10.5-r8"', source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          Path('docs/releases/RELEASE_NOTES_v10_5_r8.md').write_text('''# Taxo 10.5-r8 — Windows 7 / XLSX `tabId` compatibility checkpoint\n\n## Чому з’явилась r8\n\nПід час повного багатоплатформного checkpoint для 10.5-r7 окремий gate Python 3.8 / Windows 7 показав, що openpyxl на цій лінії формує коротший текст `TypeError`: без слова `ChildSheet`, але з тим самим `unexpected keyword argument 'tabId'`. r7 вже була видана і залишається immutable, тому виправлення оформлено новою ревізією r8.\n\n## Виправлено\n\n- сумісність імпорту XLSX «Шлях» з Python 3.8 / Windows 7;\n- безпечний retry активується лише для `TypeError` з `unexpected keyword argument` і `tabId`;\n- вихідний XLSX не переписується — очищення службового атрибута відбувається тільки в пам’яті;\n- regression fixture більше не залежить від того, чи openpyxl включив назву `ChildSheet` у текст помилки.\n\n## Не змінювалось\n\nБізнес-логіка r7, локальний цикл звіряння через Дію, робочі/державні snapshot реєстрів, військово-транспортна відомість і правила план/факт не змінювались.\n\n## Release gate\n\nПеред злиттям у `main` r8 має пройти повний regression на сучасному Windows, Windows 7 compatibility line (Python 3.8), macOS ARM64/Intel та START packaging.\n''', encoding='utf-8')
          PY

          git diff --check
          git status --short
      - name: Commit r8 code slice
        shell: bash
        run: |
          git config user.name 'RomanZavadaM'
          git config user.email 'zavada.roman.m@gmail.com'
          git add v1055_features.py v1058_features.py taxo_app.py main.py VERSION.txt \
                  tests/test_v10_5_r5.py tests/test_v10_5_r8.py \
                  .github/workflows/source-test-archive.yml \
                  docs/releases/RELEASE_NOTES_v10_5_r8.md
          git commit -m 'fix(10.5-r8): support Win7 openpyxl tabId signature'
          git push origin HEAD:work/v10.5-r8-win7-tabid-compat
