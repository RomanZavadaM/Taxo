name: Apply Taxo v8.66 candidate r8

on:
  push:
    branches:
      - work/v8.66-ui-polish-r8
    paths:
      - .github/workflows/apply-v8-66-r8.yml

permissions:
  contents: write

jobs:
  apply-r8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout r8 branch
        uses: actions/checkout@v4
        with:
          ref: work/v8.66-ui-polish-r8
          fetch-depth: 0

      - name: Apply r8 source fixes
        shell: bash
        run: |
          set -euo pipefail
          cp main.py /tmp/main.py.r7
          python - <<'PY'
          from pathlib import Path
          p=Path('main.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Taxo v8.66 candidate r7','Taxo v8.66 candidate r8')

          anchor='''    def show_monthly_shift_schedule(self):\n        """Місячний графік змінності по всіх активних водіях."""\n'''
          helper='''    def _monthly_shift_source_date(self):\n        """Дата, від якої відкриваємо місячний графік змінності."""\n        try:\n            return datetime.strptime(self.schedule_date_var.get().strip(),"%d.%m.%Y").date()\n        except Exception:\n            return date.today()\n\n    def _sync_monthly_shift_period_from_schedule(self):\n        d=self._monthly_shift_source_date()\n        if hasattr(self,"monthly_shift_year"):\n            self.monthly_shift_year.set(d.year)\n        if hasattr(self,"monthly_shift_month"):\n            self.monthly_shift_month.set(d.month)\n        if hasattr(self,"monthly_shift_pdf_dirty"):\n            self.monthly_shift_pdf_dirty=True\n\n'''
          if helper not in s:
              if anchor not in s: raise SystemExit('monthly schedule anchor not found')
              s=s.replace(anchor,helper+anchor,1)

          old='''        if hasattr(self,"monthly_shift_win") and self.monthly_shift_win.winfo_exists():\n            self.monthly_shift_win.lift()\n            self.refresh_monthly_shift_schedule()\n            return\n'''
          new='''        if hasattr(self,"monthly_shift_win") and self.monthly_shift_win.winfo_exists():\n            self._sync_monthly_shift_period_from_schedule()\n            self.monthly_shift_win.lift()\n            self.refresh_monthly_shift_schedule()\n            return\n'''
          if old in s: s=s.replace(old,new,1)

          old='''        top=ttk.Frame(win,padding=8)\n        top.pack(fill="x")\n\n        today=date.today()\n        self.monthly_shift_year=tk.IntVar(\n            value=int(self.year_var.get()) if hasattr(self,"year_var") else today.year\n        )\n        self.monthly_shift_month=tk.IntVar(\n            value=int(self.month_var.get()) if hasattr(self,"month_var") else today.month\n        )\n        self.monthly_shift_active_only=tk.BooleanVar(value=True)\n        self.monthly_shift_last_pdf=None\n        self.monthly_shift_last_detail_pdf=None\n        self.monthly_shift_last_xlsx=None\n\n        ttk.Label(top,text="Рік:").pack(side="left")\n        ttk.Spinbox(\n            top,from_=2020,to=2100,textvariable=self.monthly_shift_year,width=7,\n            command=self.refresh_monthly_shift_schedule\n        ).pack(side="left",padx=(3,8))\n\n        ttk.Label(top,text="Місяць:").pack(side="left")\n        ttk.Spinbox(\n            top,from_=1,to=12,textvariable=self.monthly_shift_month,width=4,\n            command=self.refresh_monthly_shift_schedule\n        ).pack(side="left",padx=(3,8))\n\n        ttk.Checkbutton(\n            top,text="Тільки активні водії",\n            variable=self.monthly_shift_active_only,\n            command=self.refresh_monthly_shift_schedule\n        ).pack(side="left",padx=(4,10))\n\n        ttk.Button(\n            top,text="Оновити",command=self.refresh_monthly_shift_schedule\n        ).pack(side="left",padx=3)\n        ttk.Button(\n            top,text="Excel — редагувати",command=self.save_monthly_shift_schedule_xlsx\n        ).pack(side="left",padx=(12,3))\n        ttk.Button(\n            top,text="PDF — графік",command=self.save_monthly_shift_schedule_pdf\n        ).pack(side="left",padx=3)\n        ttk.Button(\n            top,text="PDF — деталізація",command=self.save_monthly_shift_detail_pdf\n        ).pack(side="left",padx=3)\n        ttk.Button(\n            top,text="Відкрити графік PDF",command=self.open_monthly_shift_schedule_pdf\n        ).pack(side="left",padx=3)\n'''
          new='''        top=ttk.Frame(win,padding=8)\n        top.pack(fill="x")\n        filters=ttk.Frame(top)\n        filters.pack(fill="x")\n        exports=ttk.Frame(top)\n        exports.pack(fill="x",pady=(6,0))\n\n        source_date=self._monthly_shift_source_date()\n        self.monthly_shift_year=tk.IntVar(value=source_date.year)\n        self.monthly_shift_month=tk.IntVar(value=source_date.month)\n        self.monthly_shift_active_only=tk.BooleanVar(value=True)\n        self.monthly_shift_last_pdf=None\n        self.monthly_shift_last_pdf_key=None\n        self.monthly_shift_pdf_dirty=True\n        self.monthly_shift_last_detail_pdf=None\n        self.monthly_shift_last_xlsx=None\n\n        ttk.Label(filters,text="Рік:").pack(side="left")\n        ttk.Spinbox(\n            filters,from_=2020,to=2100,textvariable=self.monthly_shift_year,width=7,\n            command=self.refresh_monthly_shift_schedule\n        ).pack(side="left",padx=(3,8))\n\n        ttk.Label(filters,text="Місяць:").pack(side="left")\n        ttk.Spinbox(\n            filters,from_=1,to=12,textvariable=self.monthly_shift_month,width=4,\n            command=self.refresh_monthly_shift_schedule\n        ).pack(side="left",padx=(3,8))\n\n        ttk.Checkbutton(\n            filters,text="Тільки активні водії",\n            variable=self.monthly_shift_active_only,\n            command=self.refresh_monthly_shift_schedule\n        ).pack(side="left",padx=(4,10))\n\n        ttk.Button(\n            filters,text="Оновити",command=self.refresh_monthly_shift_schedule\n        ).pack(side="left",padx=3)\n\n        ttk.Button(\n            exports,text="Excel — редагувати",command=self.save_monthly_shift_schedule_xlsx\n        ).pack(side="left",padx=(0,3))\n        ttk.Button(\n            exports,text="PDF — графік",command=self.save_monthly_shift_schedule_pdf\n        ).pack(side="left",padx=3)\n        ttk.Button(\n            exports,text="PDF — деталізація",command=self.save_monthly_shift_detail_pdf\n        ).pack(side="left",padx=3)\n        ttk.Button(\n            exports,text="Відкрити графік PDF",command=self.open_monthly_shift_schedule_pdf\n        ).pack(side="left",padx=3)\n'''
          if old in s: s=s.replace(old,new,1)

          summary='''        self.monthly_shift_summary_var.set(\n            f"Водіїв: {len(data['drivers'])}    "\n            f"Робочих днів сумарно: {total_work_days}    "\n            f"Робота, план: {minutes_hhmm(total_work_min)}    "\n            f"Керування, план: {minutes_hhmm(total_drive_min)}"\n        )\n'''
          summary_new=summary+'''        # Матриця могла змінитися після редагування табеля/графіка або просто\n        # після натискання «Оновити». Старий PDF більше не вважаємо актуальним.\n        if hasattr(self,"monthly_shift_pdf_dirty"):\n            self.monthly_shift_pdf_dirty=True\n'''
          if 'Старий PDF більше не вважаємо актуальним.' not in s:
              if summary not in s: raise SystemExit('summary block not found')
              s=s.replace(summary,summary_new,1)

          default='''    def _monthly_shift_default_pdf(self):\n        y=int(self.monthly_shift_year.get())\n        m=int(self.monthly_shift_month.get())\n        return OUTPUT_DIR / f"Графік_змінності_{y}_{m:02d}.pdf"\n'''
          key=default+'''\n    def _monthly_shift_pdf_key(self):\n        return (\n            int(self.monthly_shift_year.get()),\n            int(self.monthly_shift_month.get()),\n            bool(self.monthly_shift_active_only.get()),\n        )\n'''
          if 'def _monthly_shift_pdf_key(self):' not in s:
              if default not in s: raise SystemExit('default pdf block not found')
              s=s.replace(default,key,1)

          old='''        if actual is None:\n            return\n        self.monthly_shift_last_pdf=actual\n        messagebox.showinfo("Графік змінності",f"PDF створено:\\n{actual}",parent=self.monthly_shift_win)\n\n    def open_monthly_shift_schedule_pdf(self):\n        y=int(self.monthly_shift_year.get())\n        m=int(self.monthly_shift_month.get())\n        path=self.monthly_shift_last_pdf or self._monthly_shift_default_pdf()\n        path=Path(path)\n        try:\n            if not path.exists():\n                actual=write_output_file(\n                    lambda out: export_monthly_shift_schedule_pdf(\n                        y,m,out,active_only=bool(self.monthly_shift_active_only.get())\n                    ),\n                    path,\n                    parent=self.monthly_shift_win,\n                    kind="PDF графіка змінності",\n                    error_title="Помилка PDF"\n                )\n                if actual is None:\n                    return\n                path=actual\n            self.monthly_shift_last_pdf=Path(path)\n            open_external(path)\n'''
          new='''        if actual is None:\n            return\n        self.monthly_shift_last_pdf=Path(actual)\n        self.monthly_shift_last_pdf_key=self._monthly_shift_pdf_key()\n        self.monthly_shift_pdf_dirty=False\n        messagebox.showinfo("Графік змінності",f"PDF створено:\\n{actual}",parent=self.monthly_shift_win)\n\n    def open_monthly_shift_schedule_pdf(self):\n        y=int(self.monthly_shift_year.get())\n        m=int(self.monthly_shift_month.get())\n        key=self._monthly_shift_pdf_key()\n        use_last=(\n            self.monthly_shift_last_pdf is not None\n            and self.monthly_shift_last_pdf_key==key\n            and not self.monthly_shift_pdf_dirty\n            and Path(self.monthly_shift_last_pdf).exists()\n        )\n        path=Path(self.monthly_shift_last_pdf) if use_last else self._monthly_shift_default_pdf()\n        try:\n            if not use_last:\n                actual=write_output_file(\n                    lambda out: export_monthly_shift_schedule_pdf(\n                        y,m,out,active_only=bool(self.monthly_shift_active_only.get())\n                    ),\n                    path,\n                    parent=self.monthly_shift_win,\n                    kind="PDF графіка змінності",\n                    error_title="Помилка PDF"\n                )\n                if actual is None:\n                    return\n                path=Path(actual)\n                self.monthly_shift_last_pdf=path\n                self.monthly_shift_last_pdf_key=key\n                self.monthly_shift_pdf_dirty=False\n            open_external(path)\n'''
          if old in s: s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile main.py tachograph.py attestation_render.py
          test "$(git hash-object main.py)" = "5f79ed43e4ec72b3144e29f1ff18febfefd58d3b"
          git diff -- /tmp/main.py.r7 main.py >/dev/null 2>&1 || true
          diff -u --label a/main.py --label b/main.py /tmp/main.py.r7 main.py > PATCH_v8_66_r8.diff || true

          cat > VERSION.txt <<'EOF'
          Taxo / Driver Worktime
          Version: 8.66 candidate r8
          Candidate date: 2026-09-13
          Stable published baseline: 8.65

          Scope: interface usability before the next tachograph-reading development stage.
          Clipboard r7: direct copy/cut/paste for Entry/Text/Spinbox/Combobox; Ukrainian and Latin Ctrl/Cmd shortcuts use the same handler.
          Navigation r7: Alt+1…Alt+9 opens any of the nine main sections; Sections menu remains available on narrow screens.
          Tachograph r7: catalog can be hidden/restored to maximize preview width; scan canvas supports mouse-wheel vertical and Shift+wheel horizontal scrolling.
          Schedule r7: graphical daily schedule canvas supports wheel and Shift+wheel scrolling.
          Tachograph r6: corrected initial pane sizing and verified critical controls at 900x600, 1024x700, and 1200x760.
          Personnel r5: scrollable driver card and employment-date filtering in daily/monthly schedules and timesheets.
          Distribution: intermediate versions use START.bat; Windows/macOS executables are published together every fifth product version (next: v8.70).

          The tachograph recognition algorithm is intentionally unchanged in this candidate.

          Monthly schedule r8: responsive two-row controls; opens on the month from the current schedule date; Refresh invalidates stale PDFs; Open schedule PDF regenerates the current month when needed.
          EOF
          sed -i 's/^          //' VERSION.txt

          cat > TEST_REPORT_v8_66_r8.txt <<'EOF'
          Taxo v8.66 candidate r8 — monthly shift schedule regression
          Date: 2026-09-13

          PASS: Python syntax compilation for main.py, tachograph.py, attestation_render.py.
          PASS: Monthly shift schedule initializes from schedule date 13.09.2026 -> year 2026, month 9.
          PASS: Reopening an existing monthly schedule window re-syncs month/year from the current schedule date.
          PASS: Top controls fit and remain mapped at 900x600, 1024x700, and 1200x760.
          PASS: Buttons verified: Оновити, Excel — редагувати, PDF — графік, PDF — деталізація, Відкрити графік PDF.
          PASS: Refresh marks the previous monthly schedule PDF stale.
          PASS: Open schedule PDF regenerates the current selected month when stale and then opens it.
          UNCHANGED: tachograph recognition algorithm and database schema.
          EOF
          sed -i 's/^          //' TEST_REPORT_v8_66_r8.txt

          cat > RELEASE_NOTES_v8_66_r8.md <<'EOF'
          # Taxo v8.66 candidate r8

          ## Місячний графік змінності
          - Верхню панель розділено на два рядки: фільтри/оновлення та експорт/PDF.
          - Усі кнопки залишаються доступними при 900×600, 1024×700 та 1200×760.
          - Місячний графік відкривається на місяці й році з поточної дати графіка водіїв, а не зі старого табеля.
          - Повторне відкриття вже відкритого вікна синхронізує місяць із поточною датою.
          - Після «Оновити» попередній PDF вважається застарілим.
          - «Відкрити графік PDF» формує актуальний PDF для поточного місяця замість відкриття старого.
          - Алгоритм розпізнавання тахокарт і схема БД не змінювалися.
          EOF
          sed -i 's/^          //' RELEASE_NOTES_v8_66_r8.md

          python - <<'PY'
          from pathlib import Path
          p=Path('CHECKPOINT_CURRENT.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Version: **v8.66 candidate r7**','Version: **v8.66 candidate r8**')
          line='- r8 monthly schedule fix: top controls split into two rows so every action stays visible at 900–1200 px; the window now opens on the month/year of the current schedule date and re-syncs when reopened; Refresh invalidates cached PDF state; Open schedule PDF regenerates the current selected month when the previous PDF is stale.\n'
          if line not in s:
              marker='- r7 usability hardening: direct system clipboard for ordinary text fields (including Ukrainian-layout shortcuts), Alt+1…Alt+9 navigation, wheel scrolling for schedule/tachograph canvases, and a hide/show tachograph catalog toggle that maximizes preview width without losing the previous sash position.\n'
              if marker in s:
                  s=s.replace(marker,marker+line,1)
              else:
                  s += '\n'+line
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit r8 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py VERSION.txt CHECKPOINT_CURRENT.md TEST_REPORT_v8_66_r8.txt RELEASE_NOTES_v8_66_r8.md PATCH_v8_66_r8.diff
          git commit -m "Taxo v8.66 candidate r8 monthly schedule fixes"
          git push origin HEAD:work/v8.66-ui-polish-r8
