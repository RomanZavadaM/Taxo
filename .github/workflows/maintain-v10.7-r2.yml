name: Maintain Taxo 10.7-r2 integration

on:
  push:
    branches:
      - 'work/v10.7-r2-operations-orders'
    paths:
      - '.github/workflows/maintain-v10.7-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded maintenance patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return False
                  raise SystemExit(f'Expected patch anchor missing in {path}: {old!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Patch anchor not unique in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              return True

          replace_once('main.py', 'APP_VERSION = "10.7-r1"', 'APP_VERSION = "10.7-r2"')

          p = Path('tests/test_v10_7_r1.py')
          text = p.read_text(encoding='utf-8')
          old = '''    def test_version_file_is_r1(self):\n        text = Path("VERSION.txt").read_text(encoding="utf-8")\n        self.assertIn("Version: 10.7-r1", text)\n\n    def test_main_version_literal_is_r1(self):\n        text = Path("main.py").read_text(encoding="utf-8")\n        self.assertIn('APP_VERSION = "10.7-r1"', text)\n'''
          if old not in text:
              # Older form used open(); handle that exact historical text too.
              old = '''    def test_version_file_is_r1(self):\n        text = open("VERSION.txt", "r", encoding="utf-8").read()\n        self.assertIn("Version: 10.7-r1", text)\n\n    def test_main_version_literal_is_r1(self):\n        text = open("main.py", "r", encoding="utf-8").read()\n        self.assertIn('APP_VERSION = "10.7-r1"', text)\n'''
          new = '''    def test_current_version_is_r1_or_later_in_10_7_line(self):\n        text = Path("VERSION.txt").read_text(encoding="utf-8")\n        match = __import__("re").search(r"Version:\\s+10\\.7-r(\\d+)", text)\n        self.assertIsNotNone(match)\n        self.assertGreaterEqual(int(match.group(1)), 1)\n\n    def test_r1_feature_layer_keeps_historical_identity(self):\n        text = Path("v1071_features.py").read_text(encoding="utf-8")\n        self.assertIn('APP_VERSION = "10.7-r1"', text)\n'''
          if old not in text:
              raise SystemExit('Expected 10.7-r1 identity test block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('operations_orders_ui.py')
          text = p.read_text(encoding='utf-8')
          old = '''    def current_assignment_order():\n        row=selected_order()\n        if row is None or row["order_type"]!=ops.TYPE_VEHICLE_ASSIGNMENT:\n            return None\n        return row\n'''
          new = '''    def current_assignment_order():\n        sel = order_tree.selection()\n        if not sel:\n            return None\n        row = order_cache.get(int(sel[0]))\n        if row is None or row["order_type"] != ops.TYPE_VEHICLE_ASSIGNMENT:\n            return None\n        return row\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('current_assignment_order patch anchor missing')

          old = '''        def save_new():\n            con3=core.db()\n            try:\n                oid=ops.create_order(\n                    con3, order_type=type_by_label.get(type_var.get(),ops.TYPE_GENERIC),\n'''
          new = '''        def save_new():\n            order_type = type_by_label.get(type_var.get(), ops.TYPE_GENERIC)\n            con3=core.db()\n            try:\n                oid=ops.create_order(\n                    con3, order_type=order_type,\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('save_new type patch anchor missing')

          old = '''            dialog.destroy(); refresh_orders(oid)\n            if type_by_label.get(type_var.get())==ops.TYPE_VEHICLE_ASSIGNMENT:\n                book.select(assignments_tab)\n'''
          new = '''            dialog.destroy(); refresh_orders(oid)\n            if order_type == ops.TYPE_VEHICLE_ASSIGNMENT:\n                book.select(assignments_tab)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('save_new post-destroy patch anchor missing')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit maintenance patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No maintenance changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py tests/test_v10_7_r1.py operations_orders_ui.py
          git commit -m 'fix: synchronize 10.7-r2 identity and operations UI'
          git push origin HEAD:work/v10.7-r2-operations-orders
