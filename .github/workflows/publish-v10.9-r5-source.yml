name: Publish Taxo 10.9-r5 source prerelease

on:
  push:
    branches:
      - ops/publish-v10.9-r5-source
    paths:
      - '.github/workflows/publish-v10.9-r5-source.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
      ISSUED_SHA: bb2f4424d12cab1fa479950a0743910b909e9fc6
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact verified r5 source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$ISSUED_SHA"
          test "$(git rev-parse HEAD)" = "$ISSUED_SHA"

      - name: Verify candidate identity and unused immutable tag
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'Version: 10.9-r5' VERSION.txt
          grep -Fxq 'APP_VERSION = "10.9-r5"' main.py
          test -f activity_register_60.py
          test -f docs/maintenance/AUDIT_TACHOGRAPH_ACTIVITY_SAFETY_v10.9-r5.md
          test -f docs/releases/RELEASE_NOTES_v10.9-r5.md
          if git ls-remote --exit-code --tags origin refs/tags/v10.9-r5 >/dev/null 2>&1; then
            echo 'Tag v10.9-r5 already exists; refusing to move/reuse it.' >&2
            exit 1
          fi

      - name: Install regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install -r requirements.txt

      - name: Run exact-source regression suite
        run: |
          python -m py_compile main.py taxo_app.py activity_register_60.py application_context.py feature_layers.py output_files.py backup_migration.py database_runtime.py data_access.py waybill_integrity.py vehicle_document_validity.py work_rest_compliance.py
          xvfb-run -a python -m unittest discover -s tests -v

      - name: Build and verify START archive
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          stem='Taxo_v10_9_candidate_r5_START'
          archive="${stem}.zip"
          git archive --format=zip --prefix="${stem}/" --output="$archive" HEAD
          for f in START.bat requirements.txt taxo_app.py main.py activity_register_60.py application_context.py feature_layers.py output_files.py backup_migration.py database_runtime.py data_access.py waybill_integrity.py vehicle_document_validity.py work_rest_compliance.py workspace.py vehicle_documents.py vehicle_maintenance.py vehicle_maintenance_ui.py LICENSE.md COPYRIGHT.md THIRD_PARTY_NOTICES.md; do
            unzip -l "$archive" | grep -q "/${f}$" || { echo "Missing ${f}" >&2; exit 1; }
          done
          if unzip -l "$archive" | grep -Eiq '\.(db|sqlite|sqlite3)([[:space:]]|$)|__pycache__|\.pyc([[:space:]]|$)'; then
            echo 'Database/cache unexpectedly included' >&2
            exit 1
          fi
          sha256sum "$archive" > SHA256SUMS_v10_9_r5.txt
          sha=$(sha256sum "$archive" | awk '{print $1}')
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create immutable tag and prerelease
        shell: bash
        run: |
          set -euo pipefail
          git tag v10.9-r5 "$ISSUED_SHA"
          git push origin refs/tags/v10.9-r5
          gh release create v10.9-r5 \
            "${{ steps.pack.outputs.archive }}" SHA256SUMS_v10_9_r5.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title 'Taxo 10.9-r5' \
            --prerelease \
            --notes-file docs/releases/RELEASE_NOTES_v10.9-r5.md
          target=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v10.9-r5 --jq '.object.sha')
          test "$target" = "$ISSUED_SHA"
          printf 'Issued source: %s\nSTART SHA-256: %s\n' "$ISSUED_SHA" '${{ steps.pack.outputs.sha }}'
