name: Diagnose Taxo 10.9-r6 personnel balance

on:
  push:
    branches:
      - work/v10.9-r6-personnel-balance-safety
    paths:
      - '.github/workflows/diagnose-v10.9-r6.yml'
      - 'v1096_personnel_balance.py'
      - 'tests/test_v10_9_r6.py'
      - 'feature_layers.py'
      - 'VERSION.txt'

permissions:
  contents: read

jobs:
  diagnose-r6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install -r requirements.txt
      - name: Run only r6 regression
        run: xvfb-run -a python -m unittest tests.test_v10_9_r6 -v
