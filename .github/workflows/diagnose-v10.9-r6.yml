name: Diagnose Taxo 10.9-r6 personnel balance

on:
  push:
    branches:
      - work/v10.9-r6-personnel-balance-safety
    paths:
      - '.github/workflows/diagnose-v10.9-r6.yml'
      - 'v1096_personnel_balance.py'
      - 'tests/**'
      - 'feature_layers.py'
      - 'VERSION.txt'

permissions:
  contents: read

jobs:
  diagnose-r6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq python3-tk xvfb >/dev/null
          python -m pip install -q -r requirements.txt
      - name: Run full regression and capture failure tail
        id: regression
        shell: bash
        run: |
          set +e
          xvfb-run -a python -m unittest discover -s tests > /tmp/r6-full.log 2>&1
          rc=$?
          tail -n 180 /tmp/r6-full.log > /tmp/r6-failure-tail.txt
          cat /tmp/r6-failure-tail.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compact diagnostic
        if: steps.regression.outputs.rc != '0'
        uses: actions/upload-artifact@v4
        with:
          name: r6-regression-diagnostic
          path: /tmp/r6-failure-tail.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failure conclusion
        if: steps.regression.outputs.rc != '0'
        run: exit 1
