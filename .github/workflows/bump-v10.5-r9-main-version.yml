name: Align Taxo 10.5-r9 main version

on:
  push:
    branches:
      - work/v10.5-r9-off-route-waybill
    paths:
      - .github/workflows/bump-v10.5-r9-main-version.yml

permissions:
  contents: write

jobs:
  align-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/v10.5-r9-off-route-waybill
          fetch-depth: 0

      - name: Align main.py version marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.5-r8"'
          new = 'APP_VERSION = "10.5-r9"'
          if new in text:
              print('main.py already aligned')
          else:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one old version marker, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit aligned marker
        shell: bash
        run: |
          if git diff --quiet -- main.py; then
            echo 'No version change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'chore: align main APP_VERSION with 10.5-r9'
          git push origin HEAD:work/v10.5-r9-off-route-waybill
