name: Move legacy specs for r10
on:
  push:
    branches: [work/v10.9-r10-structure]
    paths: ['.github/workflows/move-legacy-specs-r10.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          mkdir -p packaging/history
          shopt -s nullglob
          for f in ./*.spec; do
            git mv "$f" "packaging/history/$(basename "$f")"
          done
          git config user.name 'RomanZavadaM'
          git config user.email 'zavada.roman.m@gmail.com'
          git add -A -- ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: move legacy packaging specs out of root'
            git push origin HEAD:work/v10.9-r10-structure
          fi
