name: Apply Taxo 10.9-r10 structural file migration

on:
  push:
    branches:
      - work/v10.9-r10-structure
    paths:
      - '.github/workflows/refactor-v10.9-r10-files.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reorganize repository files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          src = root / 'src' / 'taxo'
          assets = root / 'assets'
          packaging = root / 'packaging'
          src.mkdir(parents=True, exist_ok=True)
          assets.mkdir(parents=True, exist_ok=True)
          packaging.mkdir(parents=True, exist_ok=True)

          for p in sorted(root.glob('*.py')):
              if p.name not in {'main.py', 'taxo_app.py', 'sitecustomize.py'}:
                  shutil.move(str(p), str(src / p.name))

          (src / '__init__.py').write_text(
              '# Taxo internal source package.\n'
              '# Flat module names are temporarily preserved through the root bootstrap path.\n',
              encoding='utf-8',
          )

          for name in ('Бланк підтвердження.docx', 'attestation_visual_template.pdf'):
              p = root / name
              if p.exists():
                  shutil.move(str(p), str(assets / name))

          for name in ('Taxo.spec', 'Taxo_win7.spec', 'Taxo_macos.spec'):
              p = root / name
              if p.exists():
                  shutil.move(str(p), str(packaging / name))
          if (root / 'installer').exists():
              shutil.move(str(root / 'installer'), str(packaging / 'installer'))

          Path('sitecustomize.py').write_text(
              '"""Taxo repository bootstrap: expose internal source modules without polluting root."""\n'
              'from pathlib import Path\n'
              'import sys\n\n'
              '_SRC = Path(__file__).resolve().parent / "src" / "taxo"\n'
              'if _SRC.is_dir() and str(_SRC) not in sys.path:\n'
              '    sys.path.insert(0, str(_SRC))\n',
              encoding='utf-8',
          )

          app = Path('taxo_app.py')
          text = app.read_text(encoding='utf-8')
          marker = '"""Taxo application entry point. Current version is owned by main.APP_VERSION."""\n'
          bootstrap = marker + (
              'from pathlib import Path\nimport sys\n\n'
              '_SRC = Path(__file__).resolve().parent / "src" / "taxo"\n'
              'if _SRC.is_dir() and str(_SRC) not in sys.path:\n'
              '    sys.path.insert(0, str(_SRC))\n'
          )
          if marker in text and '_SRC = Path(__file__).resolve().parent / "src" / "taxo"' not in text:
              app.write_text(text.replace(marker, bootstrap, 1), encoding='utf-8')

          main = Path('main.py')
          text = main.read_text(encoding='utf-8')
          text = text.replace('APP_VERSION = "10.9-r9"', 'APP_VERSION = "10.9-r10"', 1)
          text = text.replace('TEMPLATE_PATH = APP_DIR / "Бланк підтвердження.docx"', 'TEMPLATE_PATH = APP_DIR / "assets" / "Бланк підтвердження.docx"', 1)
          text = text.replace('ATT_VISUAL_TEMPLATE_PATH = APP_DIR / "attestation_visual_template.pdf"', 'ATT_VISUAL_TEMPLATE_PATH = APP_DIR / "assets" / "attestation_visual_template.pdf"', 1)
          main.write_text(text, encoding='utf-8')
          Path('VERSION.txt').write_text('Version: 10.9-r10\n', encoding='utf-8')

          start = '''@echo off\nsetlocal\ncd /d "%~dp0"\n\necho ==============================================\necho   Taxo 10.9-r10 - START\necho ==============================================\necho.\n\nif not exist "requirements.txt" goto :package_incomplete\nif not exist "taxo_app.py" goto :package_incomplete\nif not exist "main.py" goto :package_incomplete\nif not exist "src\\taxo\\application_context.py" goto :package_incomplete\nif not exist "src\\taxo\\feature_layers.py" goto :package_incomplete\nif not exist "src\\taxo\\workspace.py" goto :package_incomplete\nif not exist "src\\taxo\\vehicle_documents.py" goto :package_incomplete\nif not exist "src\\taxo\\v1099_schema_compatibility.py" goto :package_incomplete\nif not exist "assets\\Бланк підтвердження.docx" goto :package_incomplete\nif not exist "assets\\attestation_visual_template.pdf" goto :package_incomplete\n\nset "PYTHONPATH=%CD%\\src\\taxo;%PYTHONPATH%"\npy -3.13 -c "import sys" >nul 2>&1\nif errorlevel 1 goto :python_missing\n\nif /I "%TAXO_START_PREFLIGHT_ONLY%"=="1" (\n    echo START preflight OK.\n    exit /b 0\n)\n\npy -3.13 -m pip install -r "requirements.txt"\nif errorlevel 1 goto :install_failed\n\necho.\necho Starting Taxo 10.9-r10...\npy -3.13 "taxo_app.py"\nif errorlevel 1 goto :app_failed\nexit /b 0\n\n:package_incomplete\necho ERROR: Taxo START package is incomplete in this folder.\necho.\necho Extract the ZIP completely before running START.bat.\necho Required layout: main.py, taxo_app.py, src\\taxo\\..., assets\\..., requirements.txt.\npause\nexit /b 2\n\n:python_missing\necho ERROR: Python 3.13 with the py launcher was not found.\necho Install Python 3.13 x64 with the Python launcher and run START.bat again.\npause\nexit /b 3\n\n:install_failed\necho.\necho ERROR: Python package installation failed.\npause\nexit /b 1\n\n:app_failed\necho.\necho ERROR: Taxo stopped with an error.\npause\nexit /b 1\n'''
          Path('START.bat').write_text(start, encoding='utf-8', newline='\r\n')

          for name in ('Taxo.spec', 'Taxo_win7.spec', 'Taxo_macos.spec'):
              p = packaging / name
              text = p.read_text(encoding='utf-8')
              text = text.replace('from branding import generate_build_icons', 'from pathlib import Path\nimport sys\nROOT = Path.cwd()\nSRC = ROOT / "src" / "taxo"\nsys.path.insert(0, str(SRC))\nfrom branding import generate_build_icons')
              text = text.replace('pathex=[]', 'pathex=[str(SRC)]')
              text = text.replace("('Бланк підтвердження.docx', '.')", "('assets/Бланк підтвердження.docx', 'assets')")
              text = text.replace("('attestation_visual_template.pdf', '.')", "('assets/attestation_visual_template.pdf', 'assets')")
              if name == 'Taxo_macos.spec':
                  text = text.replace("version='10.3'", "version='10.9.10'")
                  text = text.replace("'CFBundleShortVersionString': '10.3'", "'CFBundleShortVersionString': '10.9.10'")
                  text = text.replace("'CFBundleVersion': '10.3'", "'CFBundleVersion': '10910'")
              p.write_text(text, encoding='utf-8')

          iss = packaging / 'installer' / 'Taxo.iss'
          if iss.exists():
              text = iss.read_text(encoding='utf-8')
              text = text.replace('#define MyAppVersion "10.3"', '#define MyAppVersion "10.9-r10"')
              text = text.replace('OutputDir=..\\release_out', 'OutputDir=..\\..\\release_out')
              text = text.replace('OutputBaseFilename=Taxo_v10_3_Setup_Windows_x64', 'OutputBaseFilename=Taxo_v10_9_candidate_r10_Setup_Windows_x64')
              text = text.replace('Source: "..\\dist\\Taxo_v10_3_Windows_x64\\*"', 'Source: "..\\..\\dist\\Taxo_v10_9_candidate_r10_Windows_x64\\*"')
              iss.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('> **Наступна кодова ревізія:** `10.9-r10`', '> **Поточна ревізія розробки:** `10.9-r10` — структурне впорядкування репозиторію')
          readme.write_text(text, encoding='utf-8')
          PY

          git config user.name 'RomanZavadaM'
          git config user.email 'zavada.roman.m@gmail.com'
          git add -A -- ':!.github/workflows/**'
          git commit -m 'refactor: reorganize Taxo source tree for 10.9-r10'
          git push origin HEAD:work/v10.9-r10-structure
