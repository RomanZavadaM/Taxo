name: Apply Taxo v8.66 candidate r6 patch

on:
  push:
    branches:
      - work/v8.66-ui-polish-r6
    paths:
      - .github/workflows/apply-v8-66-r6.yml

permissions:
  contents: write

jobs:
  apply-r6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: work/v8.66-ui-polish-r6
          fetch-depth: 0

      - name: Apply exact r6 source patch
        shell: bash
        run: |
          set -euo pipefail
          if git apply --reverse --check PATCH_v8_66_r6.diff >/dev/null 2>&1; then
            echo "r6 patch is already applied"
          else
            git apply --check PATCH_v8_66_r6.diff
            git apply PATCH_v8_66_r6.diff
          fi
          python -m py_compile main.py tachograph.py attestation_render.py

      - name: Commit r6 source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py tachograph.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Apply Taxo v8.66 candidate r6 UI fixes"
            git push origin HEAD:work/v8.66-ui-polish-r6
          fi
