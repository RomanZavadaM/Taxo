name: Fix historical 10.7 version tests for 10.8 rollover

on:
  push:
    branches:
      - work/v10.8-r1-interface-functionality-guard

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.8-r1-interface-functionality-guard
          fetch-depth: 0
      - name: Convert frozen current-line assertions into historical anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "tests/test_v10_7_r4.py": [
                  (
                      '        self.assertEqual((major, minor), (10, 7))\n        self.assertGreaterEqual(revision, 4)\n',
                      '        self.assertGreaterEqual((major, minor, revision), (10, 7, 4))\n',
                  ),
                  (
                      '        self.assertEqual((major, minor), (10, 7))\n        self.assertGreaterEqual(revision, 4)\n',
                      '        self.assertGreaterEqual((major, minor, revision), (10, 7, 4))\n',
                  ),
              ],
              "tests/test_v10_7_r5.py": [
                  (
                      '        m = re.search(r"Version:\\s*10\\.7-r(\\d+)", current)\n        self.assertIsNotNone(m)\n        self.assertGreaterEqual(int(m.group(1)), 5)\n',
                      '        m = re.search(r"Version:\\s*(\\d+)\\.(\\d+)-r(\\d+)", current)\n        self.assertIsNotNone(m)\n        self.assertGreaterEqual(tuple(map(int, m.groups())), (10, 7, 5))\n',
                  ),
              ],
              "tests/test_v10_7_r6.py": [
                  (
                      '    def _current_10_7_revision():\n        text = Path("VERSION.txt").read_text(encoding="utf-8")\n        match = re.search(r"Version:\\s*10\\.7-r(\\d+)", text)\n        if not match:\n            raise AssertionError("Current VERSION.txt is not in the Taxo 10.7-rN line")\n        return int(match.group(1))\n',
                      '    def _current_version_tuple():\n        text = Path("VERSION.txt").read_text(encoding="utf-8")\n        match = re.search(r"Version:\\s*(\\d+)\\.(\\d+)-r(\\d+)", text)\n        if not match:\n            raise AssertionError("Current VERSION.txt has no Taxo candidate version")\n        return tuple(map(int, match.groups()))\n',
                  ),
                  (
                      '        self.assertGreaterEqual(self._current_10_7_revision(), 6)\n',
                      '        self.assertGreaterEqual(self._current_version_tuple(), (10, 7, 6))\n',
                  ),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      # r4 has the same block twice; after first replacement the second occurrence may remain.
                      if filename.endswith("r4.py") and new in text:
                          continue
                      raise SystemExit(f"Expected historical test block not found in {filename}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/fix-v10.8-r1-history-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v10_7_r4.py tests/test_v10_7_r5.py tests/test_v10_7_r6.py
          git commit -m "test: preserve 10.7 history after 10.8 rollover"
          git push origin HEAD:work/v10.8-r1-interface-functionality-guard
