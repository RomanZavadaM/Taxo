name: Publish Taxo 10.0.1 candidate r1 source

on:
  push:
    branches:
      - 'work/v10.0.1-driver-role-lifecycle'
    paths:
      - '.github/workflows/publish-v10.0.1-r1-source.yml'

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and run regression tests
        run: |
          python -m py_compile main.py taxo_app.py work_analysis_ext.py activity_register_60.py v9_release.py hotfix_901.py v91_features.py personnel_v91.py work_regime.py workspace.py waybill.py tachograph.py attestation_render.py release_naming.py
          python -m unittest discover -s tests -v

      - name: Prepare verified START package
        shell: bash
        run: |
          expected='Taxo_v10_0_1_candidate_r1_START'
          actual="$(python - <<'PY'
          from release_naming import start_archive_stem, version_from_file
          print(start_archive_stem(version_from_file('VERSION.txt')))
          PY
          )"
          test "$actual" = "$expected" || {
            echo "Unexpected START stem: $actual" >&2
            exit 1
          }

          mkdir release-upload
          git archive --format=zip --prefix="$expected/" --output="release-upload/$expected.zip" "$GITHUB_SHA"
          archive="release-upload/$expected.zip"

          if unzip -l "$archive" | grep -Eiq '\.(db|sqlite|sqlite3)([[:space:]]|$)|__pycache__|\.pyc([[:space:]]|$)'; then
            echo 'Database/cache unexpectedly bundled in START' >&2
            exit 1
          fi

          for file in START.bat requirements.txt taxo_app.py main.py VERSION.txt 00_README_START.txt release_naming.py; do
            unzip -l "$archive" | grep -q "/$file$" || {
              echo "Required START file missing: $file" >&2
              exit 1
            }
          done

          unzip -p "$archive" '*/START.bat' > /tmp/START.bat
          python - <<'PY'
          data = open('/tmp/START.bat', 'rb').read()
          if any(byte >= 128 for byte in data):
              raise SystemExit('START.bat must be ASCII-only')
          if b'chcp' in data.lower():
              raise SystemExit('START.bat must not switch code pages')
          if b'\r\n' not in data:
              raise SystemExit('START.bat must contain CRLF')
          PY

          cd release-upload
          sha256sum "$expected.zip" > 'SHA256SUMS_v10_0_1_candidate_r1.txt'
          sha256sum -c 'SHA256SUMS_v10_0_1_candidate_r1.txt'

      - name: Create immutable pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view 'v10.0.1-r1' >/dev/null 2>&1; then
            echo 'v10.0.1-r1 already exists; refusing to overwrite immutable candidate.'
            exit 1
          fi
          gh release create 'v10.0.1-r1' \
            release-upload/Taxo_v10_0_1_candidate_r1_START.zip \
            release-upload/SHA256SUMS_v10_0_1_candidate_r1.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'Taxo 10.0.1 candidate r1' \
            --notes-file 'docs/releases/RELEASE_NOTES_v10_0_1_candidate_r1.md'
