name: Apply Taxo 10.8-r2 main identity once

on:
  push:
    branches:
      - work/v10.8-r2-ui-runtime-smoke

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.8-r2-ui-runtime-smoke
          fetch-depth: 0
      - name: Apply exact current version and remove one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'^APP_VERSION = "[^"]+"$',
              'APP_VERSION = "10.8-r2"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit('Expected exactly one top-level APP_VERSION assignment')
          path.write_text(updated, encoding='utf-8')
          PY
          git rm .github/workflows/apply-v10.8-r2-main-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "chore: apply 10.8-r2 main identity"
          git push origin HEAD:work/v10.8-r2-ui-runtime-smoke
