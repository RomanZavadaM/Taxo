name: Apply Taxo 10.8-r4 package guard once

on:
  push:
    branches:
      - work/v10.8-r4-stoir-maintenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.8-r4-stoir-maintenance
          fetch-depth: 0
      - name: Extend START archive required files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/source-test-archive.yml')
          text=path.read_text(encoding='utf-8')
          anchor='            v1083_features.py\n'
          insert='            v1083_features.py\n            v1084_features.py\n            vehicle_maintenance.py\n            vehicle_maintenance_ui.py\n'
          if '            v1084_features.py\n' not in text:
              if anchor not in text: raise SystemExit('v1083 package anchor missing')
              text=text.replace(anchor,insert,1)
          path.write_text(text,encoding='utf-8')
          PY
          git rm .github/workflows/apply-v10.8-r4-package-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/source-test-archive.yml
          git commit -m "test: require 10.8-r4 STOIR runtime in START package"
          git push origin HEAD:work/v10.8-r4-stoir-maintenance
