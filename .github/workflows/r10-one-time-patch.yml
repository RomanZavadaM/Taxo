name: r10 one time patch

on:
  push:
    branches:
      - work/v10.4-r10-military-transport-vehicles

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r10-military-transport-vehicles
          fetch-depth: 0
      - run: python scripts/r10_one_time_patch.py
      - run: |
          if git diff --quiet -- tests/test_v10_4_r9.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v10_4_r9.py
          git commit -m "test(r10): preserve r9 historical guards"
          git push origin HEAD:work/v10.4-r10-military-transport-vehicles
