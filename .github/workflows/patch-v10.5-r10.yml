name: Finalize Taxo 10.5-r10 audit-domain checkpoint

on:
  push:
    branches:
      - work/v10.5-r10-audit-plan-fact

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.5-r10-audit-plan-fact
          fetch-depth: 0

      - name: Patch r10 identity and historical r9 test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('main.py')
          text = main.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.5-r9"'
          new = 'APP_VERSION = "10.5-r10"'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one {old!r} in main.py')
              text = text.replace(old, new, 1)
              main.write_text(text, encoding='utf-8')

          version_lines = [
              'Taxo / Driver Worktime',
              'Version: 10.5-r10',
              'Release date: 2026-09-28',
              'Release type: candidate',
              'Stable baseline: Taxo 10.3',
              'Stable tag: v10.3',
              'Stable target: 7d2044d2cad00acdd7d6fccdad2ffc037dc2bf60',
              '',
              'Taxo 10.5-r10 — аудит графіків без змішування різних планових знімків.',
              '',
              'Основне:',
              '- аудит конкретного дня більше не порівнює збережені work_segments дня з поточною таблицею route_stops каталогу;',
              '- така різниця не є доказом помилки дня: день може бути перепланований, вручну скоригований або зберігати історичний план, а шаблон маршруту пізніше змінюється;',
              '- фактичні fact_work_* залишаються окремим шаром і не підміняють план у цій перевірці;',
              '- внутрішній контроль актуального шаблону route_segments ↔ route_stops збережено у режимі «Шаблони маршрутів»;',
              '- інші перевірки цілісності дня (неповні пари, перекриття, вихід керування за межі роботи, порожні частини) працюють як раніше;',
              '- жодні планові або фактичні дані аудит автоматично не переписує.',
              '',
              'Нумерація:',
              '- 10.5-r1..r9 вже видані та immutable;',
              '- поточний кодовий крок — 10.5-r10;',
              '- після видачі 10.5-r10 наступний кодовий крок — 10.6-r1.',
              '',
          ]
          Path('VERSION.txt').write_text('\n'.join(version_lines), encoding='utf-8')

          r9test = Path('tests/test_v10_5_r9.py')
          text = r9test.read_text(encoding='utf-8')
          text = text.replace(
              'def test_candidate_identity_is_r9(self):',
              'def test_candidate_identity_is_r9_or_later(self):'
          )
          text = text.replace(
              'self.assertEqual(tuple(map(int, match.groups())), (10, 5, 9))',
              'self.assertGreaterEqual(tuple(map(int, match.groups())), (10, 5, 9))'
          )
          text = text.replace(
              'def test_r9_is_outermost_and_r8_remains_in_chain(self):',
              'def test_r9_remains_in_chain_after_later_revisions(self):'
          )
          text = text.replace(
              'self.assertIn("App = install_v1059(", entry)',
              'self.assertIn("install_v1059(", entry)'
          )
          r9test.write_text(text, encoding='utf-8')
          PY

      - name: Install Tk runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install regression dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full regression
        run: python -m unittest discover -s tests -v

      - name: Commit finalized r10 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py VERSION.txt tests/test_v10_5_r9.py
          if git diff --cached --quiet; then
            echo 'No finalization changes needed.'
            exit 0
          fi
          git commit -m 'fix: finalize 10.5-r10 audit domain separation'
          git push origin HEAD:work/v10.5-r10-audit-plan-fact
