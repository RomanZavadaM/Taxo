name: Apply Taxo 10.8-r6 main modularization

on:
  push:
    branches:
      - work/v10.8-r6-main-modularization
    paths:
      - '.github/workflows/apply-v10.8-r6-main-modularization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.8-r6-main-modularization
          fetch-depth: 0

      - name: Extract helpers from main and bump r6 identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          if 'APP_VERSION = "10.8-r5"' not in text:
              raise SystemExit('Unexpected main version marker')
          text = text.replace('APP_VERSION = "10.8-r5"', 'APP_VERSION = "10.8-r6"', 1)

          tree = ast.parse(text)
          remove_names = {
              'open_external',
              'report_font_candidates',
              '_is_file_access_error',
              '_next_output_copy_path',
              '_ask_locked_file_action',
              '_friendly_file_error',
              'write_output_file',
          }
          nodes = [
              node for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in remove_names
          ]
          found = {node.name for node in nodes}
          if found != remove_names:
              raise SystemExit(f'Modularization target mismatch: {sorted(remove_names - found)}')

          lines = text.splitlines(keepends=True)
          for node in sorted(nodes, key=lambda n: n.lineno, reverse=True):
              start = node.lineno - 1
              end = node.end_lineno
              while end < len(lines) and lines[end].strip() == '':
                  end += 1
              del lines[start:end]
          text = ''.join(lines)

          anchor = 'from document_viewer import open_document\n'
          import_block = '''from output_files import (\n    open_external,\n    report_font_candidates,\n    is_file_access_error as _is_file_access_error,\n    next_output_copy_path as _next_output_copy_path,\n    ask_locked_file_action as _ask_locked_file_action,\n    friendly_file_error as _friendly_file_error,\n    write_output_file as _write_output_file,\n)\n'''
          if anchor not in text:
              raise SystemExit('Import anchor not found')
          text = text.replace(anchor, anchor + import_block, 1)

          wrapper_anchor = 'ACTIVE_WORKSPACE_LOCK = None\n\n'
          wrapper = '''def write_output_file(writer, target_path, parent=None, kind="файл", error_title="Помилка файла"):\n    """Compatibility wrapper; implementation lives in output_files.py."""\n    return _write_output_file(\n        writer,\n        target_path,\n        parent=parent,\n        kind=kind,\n        error_title=error_title,\n        append_error_log=_append_error_log,\n    )\n\n\n'''
          if wrapper_anchor not in text:
              raise SystemExit('Wrapper anchor not found')
          text = text.replace(wrapper_anchor, wrapper_anchor + wrapper, 1)
          path.write_text(text, encoding='utf-8')

          version = Path('VERSION.txt').read_text(encoding='utf-8')
          if 'Version: 10.8-r5' not in version:
              raise SystemExit('Unexpected VERSION.txt marker')
          Path('VERSION.txt').write_text(version.replace('Version: 10.8-r5', 'Version: 10.8-r6', 1), encoding='utf-8')
          PY

      - name: Verify source and regression
        run: |
          python -m py_compile main.py output_files.py
          python -m unittest tests.test_v10_8_r6 -v

      - name: Commit refactor and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-v10.8-r6-main-modularization.yml
          git config user.name 'RomanZavadaM'
          git config user.email 'zavada.roman.m@gmail.com'
          git add main.py VERSION.txt output_files.py tests/test_v10_8_r6.py .github/workflows/apply-v10.8-r6-main-modularization.yml
          git commit -m 'refactor: split output helpers from oversized main module'
          git push origin HEAD:work/v10.8-r6-main-modularization
