name: One-time sync Taxo r8 policies

on:
  push:
    branches:
      - work/v10.4-r8-shlyakh-vehicle-reconciliation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r8-shlyakh-vehicle-reconciliation
          fetch-depth: 0
      - name: Append permanent rules and registry roadmap clarification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rules = Path('PROJECT_RULES.md')
          text = rules.read_text(encoding='utf-8')
          marker = '## Реєстри як джерело автоматичного наповнення Taxo'
          if marker not in text:
              text = text.rstrip() + '''\n\n\n## Реєстри як джерело автоматичного наповнення Taxo\n\n- Державний реєстр є не лише джерелом звіряння, а й дозволеним джерелом **автоматичного наповнення робочої БД Taxo** після попереднього перегляду користувачем.\n- Якщо корисний реквізит є у підтримуваному державному витягу, але відповідного поля ще немає у моделі Taxo, модель/схема та картка сутності мають бути розширені цим полем; повторний ручний ввід офіційних даних не є цільовим сценарієм.\n- Якщо поле вже існує, але порожнє, режим «Доповнити» може заповнити його непорожнім значенням реєстру.\n- Режим «Оновити з реєстру + доповнити» може замінити локальне значення тільки непорожнім значенням із реєстру; порожнє/відсутнє у витягу поле **ніколи не очищає** локальне значення.\n- Сутність, яка є у реєстрі, але ще відсутня у Taxo (працівник або ТЗ), може бути створена з даних реєстру тільки після preview та явного підтвердження користувача. Неоднозначні/конфліктні збіги автоматично не об'єднувати.\n- При створенні працівника з витягу реєстр не призначає йому автоматично роль водія або іншу внутрішню роль підприємства.\n- При створенні/оновленні ТЗ статус «Шлях» зберігається як реєстровий статус і не визначає автоматично локальний `active`/виведення з експлуатації.\n- Для реєстрових полів зберігати джерело, дату останнього підтвердження та історію імпортів/знімків.\n- Базова періодичність звірки підтримуваних державних реєстрів — **один раз на календарний квартал**; повторний імпорт дозволений у будь-який момент.\n- Ці правила не змінюють жорстке розділення між реєстровою звіркою та локальним контролем документів ТЗ.\n\n## Режим тестових пакетів під час розробки\n\n- При інтенсивній розробці, коли протягом години може бути кілька кодових ревізій/перевірок, стандартним тестовим пакетом є **START**. Portable/Setup для кожного такого кроку не будувати без окремої потреби, щоб не витрачати CI/ресурси.\n- Для завершеного денного або іншого рідшого контрольного checkpoint стандартним пакетом є **Portable**; Setup додається за потреби.\n- Команда «злити у main» як повний релізний checkpoint і надалі передбачає актуальні пакети для підтримуваних платформ згідно з релізною політикою.\n- Якщо власник окремо вказує тип пакета для конкретної ревізії, пріоритет має ця явна вказівка.\n'''
              rules.write_text(text, encoding='utf-8')

          roadmap = Path('docs/roadmap/REGISTRY_RECONCILIATION_AND_MILITARY_ACCOUNTING.md')
          text = roadmap.read_text(encoding='utf-8')
          marker = '## 10. Реєстр як джерело автоматичного наповнення робочої БД'
          if marker not in text:
              text = text.rstrip() + '''\n\n## 10. Реєстр як джерело автоматичного наповнення робочої БД\n\nПісля уточнення власника проєкту реєстровий імпорт має не лише порівнювати уже наявні поля. Підтримуваний офіційний XLSX/CSV використовується також для зменшення ручного вводу:\n\n- поле є в Taxo та порожнє → запропонувати/виконати автоматичне доповнення;\n- корисне поле є в офіційному форматі, але його ще немає у Taxo → розширити робочу модель БД та картку, після чого дозволити автоматичне заповнення;\n- працівник/ТЗ є у реєстрі, але картки ще немає у Taxo → показати у preview як нову сутність і дозволити створити картку з реєстрових даних після явного підтвердження;\n- конфлікт ідентичності → не об'єднувати автоматично;\n- відсутність рядка/поля у витягу → не видаляти й не очищати локальне;\n- зберігати provenance: джерело, дату звірки, SHA-256 та історичний snapshot;\n- повторне завантаження свіжого файла є новим циклом звіряння, а не дублюванням записів.\n\nБазовий цикл актуалізації для реєстрів працівників і «Шлях» — **раз на календарний квартал** з можливістю ручної позачергової звірки.\n'''
              roadmap.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- PROJECT_RULES.md docs/roadmap/REGISTRY_RECONCILIATION_AND_MILITARY_ACCOUNTING.md; then
            echo "No documentation change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_RULES.md docs/roadmap/REGISTRY_RECONCILIATION_AND_MILITARY_ACCOUNTING.md
          git commit -m "docs(r8): codify registry enrichment and START package policy"
          git push origin HEAD:work/v10.4-r8-shlyakh-vehicle-reconciliation
