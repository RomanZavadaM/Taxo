name: One-time sync Taxo 10.4-r8 version

on:
  push:
    branches:
      - work/v10.4-r8-shlyakh-vehicle-reconciliation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r8-shlyakh-vehicle-reconciliation
          fetch-depth: 0
      - name: Sync main.APP_VERSION
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          text = p.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.4-r7"'
          new = 'APP_VERSION = "10.4-r8"'
          count = text.count(old)
          if count == 0:
              if new in text:
                  print('main.APP_VERSION already 10.4-r8')
                  raise SystemExit(0)
              raise SystemExit('Expected r7 or r8 APP_VERSION marker not found')
          if count != 1:
              raise SystemExit(f'Expected exactly one r7 APP_VERSION marker, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet -- main.py; then
            echo "No version change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "chore(r8): sync main APP_VERSION"
          git push origin HEAD:work/v10.4-r8-shlyakh-vehicle-reconciliation
