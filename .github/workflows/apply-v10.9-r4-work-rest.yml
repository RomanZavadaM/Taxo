name: Apply Taxo 10.9-r4 work/rest compliance

on:
  push:
    branches:
      - work/v10.9-r4-work-rest-compliance
    paths:
      - .github/workflows/apply-v10.9-r4-work-rest.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.9-r4-work-rest-compliance
          fetch-depth: 0
      - name: Apply r4 slice
        shell: bash
        run: |
          python - <<'PY'
