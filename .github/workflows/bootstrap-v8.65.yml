name: Bootstrap Taxo v8.65 release source

on:
  push:
    branches:
      - candidate-v8.65
    paths:
      - '.github/workflows/bootstrap-v8.65.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: candidate-v8.65
          fetch-depth: 0

      - name: Reconstruct verified release patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, lzma
          parts = sorted(Path('.release_payload/v8.65').glob('h4_*.txt'))
          if len(parts) != 14:
              raise SystemExit(f'Expected 14 h4 chunks, got {len(parts)}')
          hex_text = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          packed = bytes.fromhex(hex_text)
          packed_sha = hashlib.sha256(packed).hexdigest()
          expected_packed = '32a74ec4fd409477173df8764a02e7ef179b5239729d8a9f2c139a4ab568958d'
          if packed_sha != expected_packed:
              raise SystemExit(f'XZ SHA mismatch: {packed_sha}')
          patch = lzma.decompress(packed)
          patch_sha = hashlib.sha256(patch).hexdigest()
          expected_patch = '9a19fb2cfd22600a682278bfbb5c274aac701a24a8dba6b5dce9f3ebac385cdd'
          if patch_sha != expected_patch:
              raise SystemExit(f'Patch SHA mismatch: {patch_sha}')
          Path('/tmp/v865.patch').write_bytes(patch)
          print('verified patch', patch_sha, len(patch))
          PY
          git apply --check /tmp/v865.patch
          git apply /tmp/v865.patch

      - name: Install v8.65 workflows and clean staging payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cp .release_payload/v8.65/build-candidate.yml.txt .github/workflows/build-windows-v8.65-candidate.yml
          cp .release_payload/v8.65/publish.yml.txt .github/workflows/publish-windows-v8.65.yml
          rm -f .github/workflows/publish-windows-v8.64.yml
          rm -f CANDIDATE_V8_65_R2.md CANDIDATE_V8_65_R3.md
          rm -rf .release_payload
          rm -f .github/workflows/bootstrap-v8.65.yml

      - name: Verify release source and push
        shell: bash
        run: |
          set -euo pipefail
          echo '8373d80611f2bcb3d5efb6c29f17bb9363dd8436dc0ccf010fa4941063e8d5f7  main.py' | sha256sum -c -
          echo '83c916457c6602e9ed93a55fdc0578e91775e073dad12da94ccd31d1e81fa108  tachograph.py' | sha256sum -c -
          echo 'b65178e0bf18207e75e10ebfb6c2896397e685184228ece70efb7615d4215c88  attestation_render.py' | sha256sum -c -
          echo '47aeb545509af8d43102f76de772838b36de1fa85a2d09bae2d2ce7798358ec0  Бланк підтвердження.docx' | sha256sum -c -
          echo '6e5d79bebdeed68c79e49d438d37dbd165e2316fda3233b3442911a9a3b61151  attestation_visual_template.pdf' | sha256sum -c -
          python -m py_compile main.py tachograph.py attestation_render.py
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare Taxo v8.65 release source'
            git push origin HEAD:candidate-v8.65
          fi
