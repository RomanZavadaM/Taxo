name: One-time sync Taxo r9 military UI

on:
  push:
    branches:
      - work/v10.4-r9-personnel-registry-military-accounting
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r9-personnel-registry-military-accounting
          fetch-depth: 0
      - name: Patch military action UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('military_accounting_ui.py')
          text=p.read_text(encoding='utf-8')
          if 'from tkinter import simpledialog' not in text:
              text=text.replace('from datetime import date\n', 'from datetime import date\nfrom tkinter import simpledialog\n', 1)
          old='''            def add_monthly():\n                con = core.db()\n                try:\n                    military.add_monthly_change_report_action(con, date.today()); con.commit()\n                finally:\n                    con.close()\n                refresh()\n\n            controls = core.ttk.Frame(body); controls.pack(fill="x", pady=(8,0))\n            core.ttk.Button(controls, text="Позначити виконаною", command=complete_selected).pack(side="left", padx=(0,8))\n            core.ttk.Button(controls, text="Додати щомісячне повідомлення", command=add_monthly).pack(side="left", padx=4)\n'''
          new='''            def set_order_date():\n                sel = tree.selection()\n                if not sel:\n                    core.messagebox.showinfo("Військовий облік", "Виберіть повідомлення про прийняття/звільнення.", parent=win); return\n                value = simpledialog.askstring(\n                    "Дата наказу",\n                    "Дата наказу (YYYY-MM-DD). Саме від цієї дати рахується 7-денний строк:",\n                    initialvalue=date.today().isoformat(), parent=win,\n                )\n                if not value:\n                    return\n                con = core.db()\n                try:\n                    military.set_notice_order_date(con, int(sel[0]), value); con.commit()\n                except Exception as exc:\n                    con.rollback(); core.messagebox.showerror("Військовий облік", str(exc), parent=win); return\n                finally:\n                    con.close()\n                refresh()\n\n            def add_monthly():\n                con = core.db()\n                try:\n                    military.add_monthly_change_report_action(con); con.commit()\n                finally:\n                    con.close()\n                refresh()\n\n            controls = core.ttk.Frame(body); controls.pack(fill="x", pady=(8,0))\n            core.ttk.Button(controls, text="Позначити виконаною", command=complete_selected).pack(side="left", padx=(0,8))\n            core.ttk.Button(controls, text="Вказати дату наказу", command=set_order_date).pack(side="left", padx=4)\n            core.ttk.Button(controls, text="Додати щомісячне повідомлення", command=add_monthly).pack(side="left", padx=4)\n'''
          if old in text:
              text=text.replace(old,new,1)
          elif 'def set_order_date()' not in text:
              raise SystemExit('Expected military action UI block not found')
          p.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- military_accounting_ui.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add military_accounting_ui.py
          git commit -m "fix(r9): derive notice deadline from order date in UI"
          git push origin HEAD:work/v10.4-r9-personnel-registry-military-accounting
