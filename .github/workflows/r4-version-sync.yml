name: One-time sync Taxo 10.5-r4 version

on:
  push:
    branches:
      - work/v10.5-r4-personnel-registry-lossless-import

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.5-r4-personnel-registry-lossless-import
          fetch-depth: 0
      - name: Sync main APP_VERSION
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          text = p.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.5-r3"'
          new = 'APP_VERSION = "10.5-r4"'
          if new in text:
              print('main.py already 10.5-r4')
          elif old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit('Expected 10.5-r3 APP_VERSION marker not found')
          PY
          if git diff --quiet -- main.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "chore(10.5-r4): sync main application version"
          git push origin HEAD:work/v10.5-r4-personnel-registry-lossless-import
