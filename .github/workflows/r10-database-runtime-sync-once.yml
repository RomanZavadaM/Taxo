name: r10 database runtime sync once

on:
  workflow_dispatch:
  push:
    branches:
      - work/v10.8-r10-database-runtime-infrastructure
    paths:
      - .github/workflows/r10-database-runtime-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.8-r10-database-runtime-infrastructure
          fetch-depth: 0

      - name: Patch main.py exactly once
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "import backup_migration as backup_store\n"
          import_line = "from database_runtime import connect_database as _connect_database\n"
          if text.count(import_anchor) != 1:
              raise SystemExit(f"unexpected backup_migration import count: {text.count(import_anchor)}")
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_version = 'APP_VERSION = "10.8-r9"'
          new_version = 'APP_VERSION = "10.8-r10"'
          if text.count(old_version) != 1:
              raise SystemExit(f"unexpected r9 APP_VERSION count: {text.count(old_version)}")
          text = text.replace(old_version, new_version, 1)

          pattern = re.compile(r"def db\(\):\n(?:    .*\n)+?(?=\n\ndef _driver_role_mode)")
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"unexpected db() block count: {len(matches)}")
          replacement = 'def db():\n    """Compatibility wrapper; SQLite policy lives in database_runtime.py."""\n    return _connect_database(DB_PATH)\n'
          text = text[:matches[0].start()] + replacement + text[matches[0].end():]

          path.write_text(text, encoding="utf-8")

      - name: Verify boundary
        shell: python
        run: |
          from pathlib import Path
          text = Path("main.py").read_text(encoding="utf-8")
          assert text.count('APP_VERSION = "10.8-r10"') == 1
          assert text.count('from database_runtime import connect_database as _connect_database') == 1
          assert text.count('return _connect_database(DB_PATH)') == 1

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/r10-database-runtime-sync-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py .github/workflows/r10-database-runtime-sync-once.yml
          git commit -m "refactor: route database opening through runtime boundary"
          git push origin HEAD:work/v10.8-r10-database-runtime-infrastructure
