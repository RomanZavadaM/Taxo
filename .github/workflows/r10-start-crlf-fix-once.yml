name: r10 START CRLF fix once

on:
  push:
    branches:
      - work/v10.8-r10-database-runtime-infrastructure
    paths:
      - .github/workflows/r10-start-crlf-fix-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.8-r10-database-runtime-infrastructure
          fetch-depth: 0

      - name: Normalize START.bat to Windows CRLF
        shell: python
        run: |
          from pathlib import Path
          path = Path("START.bat")
          raw = path.read_bytes()
          text = raw.decode("ascii")
          normalized = text.replace("\r\n", "\n").replace("\r", "\n")
          path.write_bytes(normalized.replace("\n", "\r\n").encode("ascii"))
          checked = path.read_bytes()
          if b"\r\n" not in checked:
              raise SystemExit("CRLF not restored")
          if b"\n" in checked.replace(b"\r\n", b""):
              raise SystemExit("bare LF remains")
          if b'if not exist "database_runtime.py" goto :package_incomplete' not in checked:
              raise SystemExit("r10 START guard missing")

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/r10-start-crlf-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add START.bat .github/workflows/r10-start-crlf-fix-once.yml
          git commit -m "fix: restore Windows CRLF in START batch"
          git push origin HEAD:work/v10.8-r10-database-runtime-infrastructure
