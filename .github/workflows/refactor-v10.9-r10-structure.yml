name: Refactor Taxo 10.9-r10 structure

on:
  push:
    branches:
      - work/v10.9-r10-structure
    paths:
      - '.github/workflows/refactor-v10.9-r10-structure.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reorganize repository
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          src = root / 'src' / 'taxo'
          assets = root / 'assets'
          packaging = root / 'packaging'
          src.mkdir(parents=True, exist_ok=True)
          assets.mkdir(parents=True, exist_ok=True)
          packaging.mkdir(parents=True, exist_ok=True)

          # Keep only the two executable entry points in repository root.
          keep_root_py = {'main.py', 'taxo_app.py', 'sitecustomize.py'}
          for p in sorted(root.glob('*.py')):
              if p.name not in keep_root_py:
                  shutil.move(str(p), str(src / p.name))

          init = src / '__init__.py'
          if not init.exists():
              init.write_text(
                  '# Taxo internal source package.\n'
                  '# Flat module names are temporarily preserved through the root bootstrap path.\n',
                  encoding='utf-8',
              )

          # Runtime templates now live in a dedicated asset directory.
          for name in ('Бланк підтвердження.docx', 'attestation_visual_template.pdf'):
              p = root / name
              if p.exists():
                  shutil.move(str(p), str(assets / name))

          # Packaging definitions are not runtime source.
          for name in ('Taxo.spec', 'Taxo_win7.spec', 'Taxo_macos.spec'):
              p = root / name
              if p.exists():
                  shutil.move(str(p), str(packaging / name))
          if (root / 'installer').exists():
              shutil.move(str(root / 'installer'), str(packaging / 'installer'))

          # Explicit compatibility bootstrap for historical flat imports.
          Path('sitecustomize.py').write_text(
              '"""Taxo repository bootstrap: expose internal source modules without polluting root."""\n'
              'from pathlib import Path\n'
              'import sys\n\n'
              '_SRC = Path(__file__).resolve().parent / "src" / "taxo"\n'
              'if _SRC.is_dir() and str(_SRC) not in sys.path:\n'
              '    sys.path.insert(0, str(_SRC))\n',
              encoding='utf-8',
          )

          # Make the executable entry point self-sufficient even when Python skips sitecustomize.
          app = Path('taxo_app.py')
          text = app.read_text(encoding='utf-8')
          marker = '"""Taxo application entry point. Current version is owned by main.APP_VERSION."""\n'
          bootstrap = (
              marker
              + 'from pathlib import Path\n'
              + 'import sys\n\n'
              + '_SRC = Path(__file__).resolve().parent / "src" / "taxo"\n'
              + 'if _SRC.is_dir() and str(_SRC) not in sys.path:\n'
              + '    sys.path.insert(0, str(_SRC))\n'
          )
          if marker in text and '_SRC = Path(__file__).resolve().parent / "src" / "taxo"' not in text:
              text = text.replace(marker, bootstrap, 1)
              app.write_text(text, encoding='utf-8')

          # r10 identity and template paths.
          main = Path('main.py')
          text = main.read_text(encoding='utf-8')
          text = text.replace('APP_VERSION = "10.9-r9"', 'APP_VERSION = "10.9-r10"', 1)
          text = text.replace('TEMPLATE_PATH = APP_DIR / "Бланк підтвердження.docx"', 'TEMPLATE_PATH = APP_DIR / "assets" / "Бланк підтвердження.docx"', 1)
          text = text.replace('ATT_VISUAL_TEMPLATE_PATH = APP_DIR / "attestation_visual_template.pdf"', 'ATT_VISUAL_TEMPLATE_PATH = APP_DIR / "assets" / "attestation_visual_template.pdf"', 1)
          main.write_text(text, encoding='utf-8')
          Path('VERSION.txt').write_text('Version: 10.9-r10\n', encoding='utf-8')

          # START package: preserve simple entry point but validate the new layout.
          start = r'''@echo off
          setlocal
          cd /d "%~dp0"

          echo ==============================================
          echo   Taxo 10.9-r10 - START
          echo ==============================================
          echo.

          if not exist "requirements.txt" goto :package_incomplete
          if not exist "taxo_app.py" goto :package_incomplete
          if not exist "main.py" goto :package_incomplete
          if not exist "src\taxo\application_context.py" goto :package_incomplete
          if not exist "src\taxo\feature_layers.py" goto :package_incomplete
          if not exist "src\taxo\workspace.py" goto :package_incomplete
          if not exist "src\taxo\vehicle_documents.py" goto :package_incomplete
          if not exist "src\taxo\v1099_schema_compatibility.py" goto :package_incomplete
          if not exist "assets\Бланк підтвердження.docx" goto :package_incomplete
          if not exist "assets\attestation_visual_template.pdf" goto :package_incomplete

          set "PYTHONPATH=%CD%\src\taxo;%PYTHONPATH%"
          py -3.13 -c "import sys" >nul 2>&1
          if errorlevel 1 goto :python_missing

          if /I "%TAXO_START_PREFLIGHT_ONLY%"=="1" (
              echo START preflight OK.
              exit /b 0
          )

          py -3.13 -m pip install -r "requirements.txt"
          if errorlevel 1 goto :install_failed

          echo.
          echo Starting Taxo 10.9-r10...
          py -3.13 "taxo_app.py"
          if errorlevel 1 goto :app_failed
          exit /b 0

          :package_incomplete
          echo ERROR: Taxo START package is incomplete in this folder.
          echo.
          echo Extract the ZIP completely before running START.bat.
          echo Required layout: main.py, taxo_app.py, src\taxo\..., assets\..., requirements.txt.
          pause
          exit /b 2

          :python_missing
          echo ERROR: Python 3.13 with the py launcher was not found.
          echo Install Python 3.13 x64 with the Python launcher and run START.bat again.
          pause
          exit /b 3

          :install_failed
          echo.
          echo ERROR: Python package installation failed.
          pause
          exit /b 1

          :app_failed
          echo.
          echo ERROR: Taxo stopped with an error.
          pause
          exit /b 1
          '''
          start = '\n'.join(line[10:] if line.startswith('          ') else line for line in start.splitlines()) + '\n'
          Path('START.bat').write_text(start, encoding='utf-8', newline='\r\n')

          # Patch PyInstaller specs for src/assets and current version.
          for name in ('Taxo.spec', 'Taxo_win7.spec', 'Taxo_macos.spec'):
              p = packaging / name
              text = p.read_text(encoding='utf-8')
              text = text.replace('from branding import generate_build_icons',
                  'from pathlib import Path\nimport sys\nROOT = Path.cwd()\nSRC = ROOT / "src" / "taxo"\nsys.path.insert(0, str(SRC))\nfrom branding import generate_build_icons')
              text = text.replace('pathex=[]', 'pathex=[str(SRC)]')
              text = text.replace("('Бланк підтвердження.docx', '.')", "('assets/Бланк підтвердження.docx', 'assets')")
              text = text.replace("('attestation_visual_template.pdf', '.')", "('assets/attestation_visual_template.pdf', 'assets')")
              if name == 'Taxo_macos.spec':
                  text = text.replace("version='10.3'", "version='10.9.10'")
                  text = text.replace("'CFBundleShortVersionString': '10.3'", "'CFBundleShortVersionString': '10.9.10'")
                  text = text.replace("'CFBundleVersion': '10.3'", "'CFBundleVersion': '10910'")
              p.write_text(text, encoding='utf-8')

          # Installer now lives under packaging/installer and targets r10 artifacts.
          iss = packaging / 'installer' / 'Taxo.iss'
          if iss.exists():
              text = iss.read_text(encoding='utf-8')
              text = text.replace('#define MyAppVersion "10.3"', '#define MyAppVersion "10.9-r10"')
              text = text.replace('OutputDir=..\\release_out', 'OutputDir=..\\..\\release_out')
              text = text.replace('OutputBaseFilename=Taxo_v10_3_Setup_Windows_x64', 'OutputBaseFilename=Taxo_v10_9_candidate_r10_Setup_Windows_x64')
              text = text.replace('Source: "..\\dist\\Taxo_v10_3_Windows_x64\\*"', 'Source: "..\\..\\dist\\Taxo_v10_9_candidate_r10_Windows_x64\\*"')
              iss.write_text(text, encoding='utf-8')

          # Update the active Windows gate for the new source layout.
          wf = Path('.github/workflows/build-windows-v8.70.yml')
          text = wf.read_text(encoding='utf-8')
          old_paths = [
              "      - 'main.py'", "      - 'taxo_app.py'", "      - 'work_analysis_ext.py'",
              "      - 'activity_register_60.py'", "      - 'v91_features.py'", "      - 'personnel_v91.py'",
              "      - 'branding.py'", "      - 'branding_asset.py'", "      - 'work_regime.py'",
              "      - 'workspace.py'", "      - 'vehicle_documents.py'", "      - 'waybill.py'",
              "      - 'tachograph.py'", "      - 'attestation_render.py'",
          ]
          for line in old_paths:
              text = text.replace(line + '\n', '')
          anchor = "      - 'taxo_app.py'\n"
          text = text.replace(anchor, anchor + "      - 'src/taxo/**'\n      - 'assets/**'\n      - 'packaging/**'\n      - 'sitecustomize.py'\n", 1)
          text = text.replace("      - 'Бланк підтвердження.docx'\n", '')
          text = text.replace("      - 'attestation_visual_template.pdf'\n", '')
          text = text.replace("      - 'release_naming.py'\n", '')
          text = text.replace("      - 'Taxo.spec'\n", '')
          text = text.replace("      - 'installer/**'\n", '')
          text = text.replace(
              'python -m py_compile main.py taxo_app.py work_analysis_ext.py activity_register_60.py v9_release.py hotfix_901.py v91_features.py personnel_v91.py work_regime.py workspace.py vehicle_documents.py waybill.py tachograph.py attestation_render.py',
              'python -m py_compile main.py taxo_app.py sitecustomize.py src/taxo/*.py'
          )
          text = text.replace('python -m PyInstaller --noconfirm --clean Taxo.spec', 'python -m PyInstaller --noconfirm --clean packaging/Taxo.spec')
          text = text.replace("Move-Item 'dist/Taxo' 'dist/Taxo_v10_3_Windows_x64'", "Move-Item 'dist/Taxo' 'dist/Taxo_v10_9_candidate_r10_Windows_x64'")
          text = text.replace("$bundle = 'dist/Taxo_v10_3_Windows_x64'", "$bundle = 'dist/Taxo_v10_9_candidate_r10_Windows_x64'")
          text = text.replace("$bundle/_internal/Бланк підтвердження.docx", "$bundle/_internal/assets/Бланк підтвердження.docx")
          text = text.replace("$bundle/_internal/attestation_visual_template.pdf", "$bundle/_internal/assets/attestation_visual_template.pdf")
          text = text.replace("Compress-Archive -Path 'dist/Taxo_v10_3_Windows_x64' -DestinationPath 'Taxo_v10_3_Windows_x64_Portable.zip' -Force", "Compress-Archive -Path 'dist/Taxo_v10_9_candidate_r10_Windows_x64' -DestinationPath 'Taxo_v10_9_candidate_r10_Windows_x64_Portable.zip' -Force")
          text = text.replace("& $iscc 'installer/Taxo.iss'", "& $iscc 'packaging/installer/Taxo.iss'")
          text = text.replace("release_out/Taxo_v10_3_Setup_Windows_x64.exe", "release_out/Taxo_v10_9_candidate_r10_Setup_Windows_x64.exe")
          text = text.replace("'Taxo_v10_3_Windows_x64_Portable.zip'", "'Taxo_v10_9_candidate_r10_Windows_x64_Portable.zip'")
          text = text.replace("'SHA256SUMS_v10_0_Windows_x64.txt'", "'SHA256SUMS_v10_9_r10_Windows_x64.txt'")
          text = text.replace("name: Taxo-v10.3-Windows-x64", "name: Taxo-v10.9-r10-Windows-x64")
          wf.write_text(text, encoding='utf-8')

          # Keep docs/start protocol aware of the structural boundary.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('> **Наступна кодова ревізія:** `10.9-r10`', '> **Поточна ревізія розробки:** `10.9-r10` — структурне впорядкування репозиторію')
          readme.write_text(text, encoding='utf-8')
          PY

          # Remove this one-off migration workflow from the resulting tree.
          rm -f .github/workflows/refactor-v10.9-r10-structure.yml

          git config user.name 'RomanZavadaM'
          git config user.email 'zavada.roman.m@gmail.com'
          git add -A
          git commit -m 'refactor: reorganize Taxo source tree for 10.9-r10'
          git push origin HEAD:work/v10.9-r10-structure
