name: Patch Taxo 10.4-r6 main identity

on:
  push:
    branches:
      - work/v10.4-r6-registry-reconciliation
    paths:
      - .github/workflows/patch-v10.4-r6-main-version.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.4-r6-registry-reconciliation
          fetch-depth: 0
      - name: Patch main.APP_VERSION
        shell: python
        run: |
          from pathlib import Path
          path=Path('main.py')
          text=path.read_text(encoding='utf-8')
          old='APP_VERSION = "10.4-r5"'
          new='APP_VERSION = "10.4-r6"'
          if old in text:
              path.write_text(text.replace(old,new,1),encoding='utf-8')
          elif new not in text:
              raise SystemExit('Unexpected main.APP_VERSION marker')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "chore: align main APP_VERSION with 10.4-r6"
          git push origin HEAD:work/v10.4-r6-registry-reconciliation
