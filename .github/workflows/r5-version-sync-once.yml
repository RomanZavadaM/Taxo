name: One-shot Taxo 10.8-r5 core version sync

on:
  push:
    branches:
      - work/v10.8-r5-stoir-forecast-repair-requests

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout r5 branch
        uses: actions/checkout@v4
        with:
          ref: work/v10.8-r5-stoir-forecast-repair-requests
          fetch-depth: 0

      - name: Update only the core version marker
        shell: python
        run: |
          from pathlib import Path
          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.8-r4"'
          new = 'APP_VERSION = "10.8-r5"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one core r4 marker, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Verify exact change and remove one-shot workflow
        shell: bash
        run: |
          grep -F 'APP_VERSION = "10.8-r5"' main.py
          ! grep -F 'APP_VERSION = "10.8-r4"' main.py
          git rm .github/workflows/r5-version-sync-once.yml
          git diff --check
          git diff -- main.py .github/workflows/r5-version-sync-once.yml

      - name: Commit exact version sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py .github/workflows/r5-version-sync-once.yml
          git commit -m 'chore: sync Taxo core identity to 10.8-r5'
          git push origin HEAD:work/v10.8-r5-stoir-forecast-repair-requests
