name: Apply Taxo 10.9-r6 identity fix

on:
  push:
    branches:
      - work/v10.9-r6-personnel-balance-safety
    paths:
      - '.github/workflows/apply-v10.9-r6-identity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.9-r6-personnel-balance-safety
      - name: Apply minimal identity and START-package guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('main.py')
          text = main.read_text(encoding='utf-8')
          old = 'APP_VERSION = "10.9-r5"'
          new = 'APP_VERSION = "10.9-r6"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old APP_VERSION marker, got {text.count(old)}')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/source-test-archive.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '            work_rest_compliance.py\n'
          addition = marker + '            v1096_personnel_balance.py\n'
          if '            v1096_personnel_balance.py\n' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('Unable to locate START required-files insertion point')
              text = text.replace(marker, addition, 1)
              workflow.write_text(text, encoding='utf-8')
          PY
          grep -Fxq 'APP_VERSION = "10.9-r6"' main.py
          grep -Fxq '            v1096_personnel_balance.py' .github/workflows/source-test-archive.yml
      - name: Commit fix to r6 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Taxo CI'
          git config user.email 'actions@users.noreply.github.com'
          git add main.py .github/workflows/source-test-archive.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align r6 identity and START package guard'
          git push origin HEAD:work/v10.9-r6-personnel-balance-safety
