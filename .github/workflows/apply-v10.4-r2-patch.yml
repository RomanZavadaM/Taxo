name: Apply Taxo 10.4-r2 verified patch

on:
  push:
    branches:
      - 'work/v10.4-r2-ui-docs-waybill'
    paths:
      - '.release/v10.4-r2-patch/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, decode and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'Payload checksums:'
          sha256sum .release/v10.4-r2-patch/part*.b85
          cat .release/v10.4-r2-patch/part*.b85 > /tmp/v10_4_r2.b85
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          encoded = Path('/tmp/v10_4_r2.b85').read_bytes()
          Path('/tmp/v10_4_r2.patch').write_bytes(zlib.decompress(base64.b85decode(encoded)))
          PY
          git apply --check /tmp/v10_4_r2.patch
          git apply /tmp/v10_4_r2.patch
          git rm -r .release/v10.4-r2-patch
          git rm .github/workflows/apply-v10.4-r2-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Taxo 10.4-r2: UI cleanup, vehicle docs and waybill readability'
          git push origin HEAD:work/v10.4-r2-ui-docs-waybill
